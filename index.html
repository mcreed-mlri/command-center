<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Training Unit — Command Center</title>
  <meta name="description" content="One place for every tool the MLRI Training Unit uses." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://trainingunit.pages.dev/" />
  <meta property="og:title" content="Training Unit — Command Center" />
  <meta property="og:description" content="One place for every tool the MLRI Training Unit uses." />
  <meta property="og:image" content="https://trainingunit.pages.dev/icons/app/icon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Training Unit — Command Center" />
  <meta name="twitter:description" content="One place for every tool the MLRI Training Unit uses." />
  <meta name="twitter:image" content="https://trainingunit.pages.dev/icons/app/icon.svg" />
  <meta name="theme-color" content="#fdf6f1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
  <link rel="icon" href="icons/app/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/app/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icons/app/icon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="icons/app/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />

  <style>
    /* top-right actions (greeting + avatars + search + theme) */
    .head-right {
      display: flex; align-items: center; justify-content: flex-end;
      flex-wrap: wrap; gap: 10px 14px; min-width: 0;
    }
    .top-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      color: var(--ink); cursor: pointer; box-shadow: var(--shadow);
      transition: transform .17s ease, border-color .17s ease, background .17s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 35%, transparent), var(--shadow); }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn[aria-expanded="true"],
    .icon-btn.is-active {
      border-color: var(--brand);
      color: var(--brand);
    }

    .search-wrap { position: relative; z-index: 5; }
    .search-panel {
      position: absolute; top: calc(100% + 8px); right: 0;
      width: min(320px, calc(100dvw - 32px));
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(-6px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s;
    }
    .search-panel.is-open {
      opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0);
    }
    .search-panel input {
      width: 100%; font: inherit; font-size: 15px; color: var(--ink);
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 11px 14px;
      box-shadow: var(--shadow); transition: border-color .15s;
    }
    .search-panel input::placeholder { color: var(--faint); }
    .search-panel input:focus { outline: none; border-color: var(--brand); }
    .search-field { position: relative; }
    .search-field input { padding-right: 38px; }
    .search-clear {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      display: none; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; border: 0; border-radius: 999px;
      background: transparent; color: var(--faint); cursor: pointer; font-size: 18px;
      line-height: 1; transition: color .14s ease, background .14s ease;
    }
    .search-clear:hover, .search-clear:focus-visible {
      outline: none; color: var(--ink);
      background: color-mix(in srgb, var(--brand) 14%, transparent);
    }
    .search-field.has-text .search-clear { display: inline-flex; }
    .search-count {
      margin: 0 2px; font-size: 12.5px; color: var(--faint);
    }
    .search-count:not(:empty) { margin-top: 7px; }
    mark.hl {
      background: color-mix(in srgb, var(--brand) 26%, transparent);
      color: inherit; border-radius: 3px; padding: 0 1px;
    }

    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      overflow-x: clip;
      overscroll-behavior-x: none;
    }
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y pinch-zoom;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--canvas-bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: max(20px, env(safe-area-inset-top)) var(--layout-gutter) calc(40px + env(safe-area-inset-bottom));
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .wrap {
      width: 100%;
      max-width: min(var(--layout-max), 100%);
      margin-inline: auto;
      min-width: 0;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ---- accessibility --------------------------------------------- */
    .skip-link {
      position: absolute; left: 16px; top: -100%;
      z-index: 100; padding: 10px 14px; border-radius: var(--radius);
      background: var(--card); color: var(--ink); font-weight: 650;
      border: 1px solid var(--line); box-shadow: var(--shadow);
      text-decoration: none;
    }
    .skip-link:focus {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px;
      outline: none;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ---- header ---------------------------------------------------- */
    /* A band, not a card: the wash and the hairline run the full width of the
       window while the content stays on the same column as the board below.
       `margin-inline: calc(50% - 50vw)` reaches from .wrap out to both edges at
       any width; .hero-inner puts the content back on the grid. (html already
       carries overflow-x: clip, so a scrollbar's worth of 100vw is clipped
       rather than becoming a sideways scroll.) */
    header.hero-band {
      margin-inline: calc(50% - 50vw);
      margin-top: calc(-1 * max(20px, env(safe-area-inset-top)));
      margin-bottom: 26px;
      padding-inline: var(--layout-gutter);
      background: var(--hero-bg);
      border-bottom: 1px solid var(--line);
    }
    .hero-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px 28px;
      max-width: min(var(--layout-max), 100%);
      margin-inline: auto;
      padding: 18px 0 16px;
      min-width: 0;
    }
    /* Title and eyebrow share one line, the eyebrow trailing it as a kicker. */
    .head-main {
      min-width: 0;
      display: flex; align-items: baseline; flex-wrap: wrap;
      column-gap: 14px; row-gap: 2px;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--earth-deep); font-weight: 700; margin: 0;
      white-space: nowrap;
    }
    h1 {
      font-family: var(--sans); font-weight: 750;
      font-size: clamp(22px, 2.8vw, 28px); line-height: 1.1;
      letter-spacing: -0.025em; color: var(--ink); margin: 0;
    }
    /* The header is the one boxed container on the page, so nothing inside it
       gets a box of its own — the greeting sits directly on the hero wash. */
    .head-meta {
      flex: 0 1 auto; min-width: 0; text-align: right;
      display: flex; flex-direction: column; justify-content: center;
    }
    .greeting { font-size: 14px; font-weight: 650; color: var(--ink); line-height: 1.25; }
    .today { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* ---- team avatar stack (the door to each focus page) ------------ */
    .avatar-stack { display: flex; align-items: center; flex: none; }
    .avatar-stack > * + * { margin-left: -8px; }
    .avatar {
      position: relative; flex: none;
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--sans); font-weight: 700; font-size: 12.5px;
      text-decoration: none; color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
      box-shadow: 0 0 0 2px var(--card);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    /* Person accents are literals, so unlike a token they do NOT lighten with
       the theme and accent-on-dark-tint lands near 3:1. Mix the letter toward
       paper in dark mode, matching the focus pages' .who-mono. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .avatar {
        color: color-mix(in srgb, var(--accent) 45%, #fff);
        background: color-mix(in srgb, var(--accent) 26%, var(--card));
      }
    }
    :root[data-theme="dark"] .avatar {
      color: color-mix(in srgb, var(--accent) 45%, #fff);
      background: color-mix(in srgb, var(--accent) 26%, var(--card));
    }
    .avatar:hover, .avatar:focus-visible {
      outline: none; z-index: 3; transform: translateY(-2px);
      box-shadow: 0 0 0 2px var(--card), 0 0 0 4px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    /* Overflow beyond AVATAR_MAX collapses here; the popover reuses .focus-list. */
    .av-menu { position: relative; flex: none; }
    .av-menu > summary {
      list-style: none; cursor: pointer;
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 11.5px; font-weight: 700; color: var(--muted);
      background: var(--paper-2); box-shadow: 0 0 0 2px var(--card);
      font-variant-numeric: tabular-nums;
      transition: color .15s ease, transform .16s ease;
    }
    .av-menu > summary::-webkit-details-marker { display: none; }
    .av-menu > summary:hover, .av-menu[open] > summary { color: var(--ink); transform: translateY(-2px); }
    .av-menu > summary:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--card), 0 0 0 4px color-mix(in srgb, var(--brand) 40%, transparent);
    }
    @media (max-width: 640px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));
      }
      header.hero-band {
        margin-top: calc(-1 * max(12px, env(safe-area-inset-top)));
        margin-bottom: 18px;
        padding-inline: 12px;
      }
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 14px 0 12px;
      }
      .head-right {
        width: 100%;
        justify-content: space-between;
        gap: 10px 12px;
      }
      .head-meta {
        flex: 1 1 auto;
        min-width: 0;
        text-align: left;
      }
      .avatar { width: 30px; height: 30px; font-size: 12px; }
      .av-menu > summary { width: 30px; height: 30px; }
      .top-actions { gap: 6px; }
      .icon-btn {
        width: 42px;
        height: 42px;
        box-shadow: none;
      }
      .search-wrap { position: static; }
      .search-panel {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        width: auto;
        z-index: 50;
      }
      h1 { font-size: clamp(21px, 6vw, 26px); }
    }

    /* ---- dashboard grid -------------------------------------------- */
    #board { margin-top: 0; min-width: 0; max-width: 100%; margin-bottom: 40px; }

    @media (min-width: 960px) {
      #board {
        display: grid;
        grid-template-columns: minmax(0, 63fr) minmax(300px, 37fr);
        gap: 44px;
        align-items: start;
      }
      .dash-col {
        display: flex;
        flex-direction: column;
        gap: 34px;
        min-width: 0;
      }

      #board.is-searching {
        display: block;
      }
      #board.is-searching .dash-col {
        display: block;
      }
      #board.is-searching .dash-col + .dash-col {
        margin-top: 0;
      }
      #board.is-searching .dash-panel + .dash-panel {
        margin-top: 34px;
      }
      #board.is-searching .dash-col:first-child .dash-panel:first-child {
        margin-top: 0;
      }
    }

    @media (max-width: 959px) {
      #board {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .dash-col {
        display: flex;
        flex-direction: column;
        gap: 30px;
        min-width: 0;
        max-width: 100%;
      }
    }

    /* A section is a label and a rule, not a card. Nothing on the board is
       boxed or shadowed — the header band is the page's only container. */
    .dash-panel {
      min-width: 0;
      max-width: 100%;
    }

    .panel-head {
      margin: 0 0 4px; padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--earth-deep); margin: 0;
    }
    .panel-title::before {
      content: ""; flex-shrink: 0;
      width: 4px; height: 11px; border-radius: 2px;
      background: var(--earth);
    }


    /* ---- layouts --------------------------------------------------- */
    /* Rows butt directly against each other; the hairline is the only
       separator, so every list gap here is 0. */
    .grid { display: grid; gap: 0; grid-template-columns: minmax(0, 1fr); }

    /* ---- Documents of Record (editorial document roster) ----------- */
    .doc-list {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: 0;
    }
    .doc-list > li { min-width: 0; }
    .doc-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 4px; border-radius: 7px;
      text-decoration: none; color: inherit;
      border-bottom: 1px solid var(--line-soft);
      min-width: 0; max-width: 100%;
      transition: background .17s ease, border-color .17s ease;
    }
    /* A row that already has a divider under it doesn't also draw its own rule. */
    .doc-list > li:has(+ .doc-divider-item) .doc-row,
    .doc-list > li:last-child .doc-row { border-bottom: none; }
    /* Hover reads as the row being picked out, not merely touched: it lifts to
       the top of the tonal ladder and takes a short accent edge on its leading
       side. The edge is an inset shadow so it costs no layout and can't shift
       the text by a pixel on the way in. */
    .doc-row:hover {
      background: var(--hover-tint);
      border-bottom-color: transparent;
      box-shadow: inset 2px 0 0 var(--accent, var(--brand));
    }
    .doc-row:focus-visible {
      background: var(--hover-tint);
      border-bottom-color: transparent;
      outline: none;
      box-shadow: inset 2px 0 0 var(--accent, var(--brand)),
                  0 0 0 3px color-mix(in srgb, var(--accent, var(--brand)) 35%, transparent);
    }
    .doc-row .tile-body { flex: 1; min-width: 0; }
    .doc-row .tile-name { font-size: 14.5px; font-weight: 650; color: var(--ink); }
    .doc-row .tile-desc { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .doc-row .tile-arrow { margin-left: 0; font-size: 14px; opacity: .65; color: var(--muted); transition: transform .17s ease, color .17s ease, opacity .17s ease; }
    .doc-row:hover .tile-arrow, .doc-row:focus-visible .tile-arrow { opacity: 1; color: var(--accent, var(--brand)); transform: translate(2px, -2px); }
    .doc-divider-item { list-style: none; }
    .doc-divider {
      border: 0; border-top: 1px solid var(--line-soft);
      margin: 5px 0; height: 0;
    }
    /* Documents of Record: a 30px icon chip, smaller than a board tile's mark. */
    .dash-panel[data-section="Important Documents"] .mono {
      width: 30px; height: 30px; border-radius: 8px; font-size: 14px;
    }
    .dash-panel[data-section="Important Documents"] .mono--icon svg { width: 16px; height: 16px; }

    /* ---- LMS (2x2 of unboxed tool rows) ---------------------------- */
    .dash-panel[data-section="LMS"] .doc-list {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 26px; row-gap: 0;
    }
    .dash-panel[data-section="LMS"] .doc-list > li:not(.doc-divider-item) { display: contents; }
    .dash-panel[data-section="LMS"] .doc-divider-item { grid-column: 1 / -1; }
    .dash-panel[data-section="LMS"] .doc-row { padding: 13px 4px; gap: 13px; }
    /* Both cells of the bottom row end the list, not just the last child. */
    .dash-panel[data-section="LMS"] .doc-list > li:nth-last-child(-n+2) .doc-row { border-bottom: none; }
    /* Slightly larger chip than a document row's; the fill comes from
       `mono--fill` on the items themselves. */
    .dash-panel[data-section="LMS"] .mono { width: 34px; height: 34px; border-radius: 9px; }
    .dash-panel[data-section="LMS"] .doc-row .tile-name { font-size: 15px; }
    .dash-panel[data-section="LMS"] .doc-row .tile-arrow { opacity: .8; }
    /* Stacked in one column, only the true last row ends the list again. */
    @media (max-width: 520px) {
      .dash-panel[data-section="LMS"] .doc-list { grid-template-columns: 1fr; }
      .dash-panel[data-section="LMS"] .doc-list > li:nth-last-child(2) .doc-row { border-bottom: 1px solid var(--line-soft); }
    }

    /* ---- LMS Health & deploys (Live + CI) ---------------------------
       Nested under the LMS panel. Collapsed by default; summary dot
       goes red only when something is actually broken. Pattern ported
       from teaching-cc (ebhcs-command-center). */
    .sites-status {
      margin-top: 8px; padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }
    .sites-status.is-collapsed { padding-top: 10px; }
    .sites-status-head {
      display: flex; align-items: center; gap: 8px;
    }
    .sites-status.is-collapsed .sites-status-head { margin-bottom: 0; }
    .sites-status:not(.is-collapsed) .sites-status-head { margin-bottom: 8px; }
    .status-toggle {
      display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
      font: inherit; background: none; border: 0; padding: 2px 0; cursor: pointer; color: inherit;
    }
    .status-toggle:focus-visible {
      outline: none; border-radius: 4px;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .sites-status-label {
      font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: 0;
      text-transform: none; transition: color .15s;
    }
    .status-toggle:hover .sites-status-label { color: var(--muted); }
    .status-chevron {
      flex: none; width: 14px; height: 14px; color: var(--faint);
      transition: transform .15s;
    }
    .sites-status:not(.is-collapsed) .status-chevron { transform: rotate(180deg); }
    .status-summary-dot {
      flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint);
    }
    .status-summary-dot.is-ok { background: var(--ok); }
    .status-summary-dot.is-fail { background: var(--danger); animation: ci-pulse 1.4s ease-in-out infinite; }
    .status-summary-dot.is-pending { background: var(--hue-3); }
    .ci-refresh {
      flex: none; font-size: 12px; font-weight: 600; color: var(--faint);
      background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px;
    }
    .sites-status.is-collapsed .ci-refresh { display: none; }
    .ci-refresh:hover { color: var(--muted); background: var(--hover-tint); }
    .ci-rows {
      list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px;
    }
    .sites-status.is-collapsed .ci-rows,
    #ciStatus[hidden] { display: none; }
    .ci-group {
      grid-column: 1 / -1; padding: 7px 2px 2px;
    }
    .ci-group:first-child { padding-top: 0; }
    .ci-group-label {
      font-size: 9px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--faint);
    }
    .ci-block--live {
      grid-column: 1 / -1;
      padding-bottom: 8px; margin-bottom: 2px;
      border-bottom: 1px solid var(--line-soft);
    }
    .ci-block--live .ci-group-label { display: block; }
    .ci-live-grid {
      list-style: none; margin: 5px 0 0; padding: 0;
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px;
    }
    .ci-row { min-width: 0; }
    .ci-row--live .ci-row-main {
      padding: 8px 10px;
      background: var(--paper-2);
      border: 1px solid var(--line-soft);
      border-radius: 8px; gap: 8px;
    }
    .ci-row--live .ci-text {
      flex-direction: row; align-items: center; justify-content: space-between; gap: 8px;
    }
    .ci-row--live .ci-name { font-size: 12px; font-weight: 650; }
    .ci-row--live .ci-meta { flex: none; font-size: 10px; font-weight: 600; letter-spacing: .01em; }
    .ci-row-main {
      display: flex; align-items: center; gap: 6px; padding: 4px 2px;
      text-decoration: none; color: inherit; border-radius: 5px; transition: background .15s;
    }
    a.ci-row-main:hover { background: var(--hover-tint); }
    .ci-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .ci-dot.is-ok { background: var(--ok); }
    .ci-dot.is-fail { background: var(--danger); }
    .ci-dot.is-pending { background: var(--hue-3); animation: ci-pulse 1.4s ease-in-out infinite; }
    .ci-dot.is-warn { background: var(--hue-3); }
    .ci-dot.is-idle { background: var(--faint); }
    @keyframes ci-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ci-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
    .ci-name { font-size: 11.5px; font-weight: 650; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ci-meta { font-size: 10px; line-height: 1.2; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- focus page popover (the avatar stack's "+N" overflow) ------ */
    .focus-list {

    @media (max-width: 400px) {

    @media (hover: none) {

    /* legacy quick styles (search results fallback) */
    .quick-links { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-links--block { margin-left: 0; margin-top: 2px; gap: 10px; }
    .quick {
      display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
      color: var(--ink); background: var(--paper-2); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 14px; font-weight: 600;
      transition: transform .14s ease, border-color .14s ease;
    }
    .quick:hover, .quick:focus-visible {
      transform: translateY(-1px); outline: none;
      border-color: color-mix(in srgb, var(--accent, var(--brand)) 55%, var(--line));
    }
    .quick img { width: 17px; height: 17px; display: block; }

      width: 17px; height: 17px; display: grid; place-items: center; border-radius: 5px;

    }

    /* ---- tile (a childless tool row) ------------------------------- */
    .tile {
      display: flex; align-items: center; gap: 14px; text-decoration: none;
      color: inherit; background: transparent; border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 7px; padding: 13px 4px;

      transition: background .17s ease, border-color .17s ease;

    .grid > .tile:last-child { border-bottom: none; }
    .tile:hover {
      background: var(--hover-tint);
      border-bottom-color: transparent;
      box-shadow: inset 2px 0 0 var(--accent, var(--brand));
    }
    .tile:focus-visible {
      background: var(--hover-tint);
      border-bottom-color: transparent;
      outline: none;
      box-shadow: inset 2px 0 0 var(--accent, var(--brand)),
                  0 0 0 3px color-mix(in srgb, var(--accent, var(--brand)) 35%, transparent);
    }
    /* ---- shared application-icon chip (all app logos + letter tiles) ---- */
    .mono {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; font-family: var(--sans);
      font-weight: 700; font-size: 18px;
      color: var(--accent, var(--brand));
      background: color-mix(in srgb, var(--accent, var(--brand)) 12%, var(--card));
      border: 1px solid color-mix(in srgb, var(--accent, var(--brand)) 20%, transparent);
    }
    /* Transparent artwork (Slack, Drive, Monday) sits on a white plate. */
    .mono--logo {
      background: var(--card);
      border: 1px solid var(--line-soft);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .mono--logo img { width: 24px; height: 24px; display: block; object-fit: contain; }
    /* `fill: true` — the logo already paints its own rounded ground (Otter's
       rect, Claude's rounded path, the Brightspace/D2L marks), so it fills the
       chip. A plate behind one of these just rings the artwork's own edge. */
    .mono--fill {
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .mono--fill img {
      width: 100%; height: 100%;
      border-radius: inherit;
      object-fit: cover;
    }
    .mono--icon svg {
      width: 20px; height: 20px; display: block;
      stroke: currentColor; fill: none;
    }
    .tile-body { min-width: 0; }
    .tile-name { font-weight: 650; font-size: 16.5px; letter-spacing: 0; }
    .tile-desc {
      color: var(--muted); font-size: 14px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tile-arrow { margin-left: auto; color: var(--muted); flex: none; transition: transform .17s, color .17s; }
    .tile:hover .tile-arrow, .tile:focus-visible .tile-arrow { color: var(--accent, var(--brand)); transform: translateX(3px); }

    /* ---- accordion tile (Drive, Monday) --------------------------- */
    /* Open by default: the section is meant to read as an app row with its
       folders/workspaces listed under it, not as something you unfold. */
    .tile-accordion {
      grid-column: 1 / -1;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      overflow: visible;

    .grid > .tile-accordion:last-child { border-bottom: none; }
    .acc-summary {

    /* One line of text, so the row closes up around a smaller mark. */
    .acc-summary--tight { padding: 9px 4px; gap: 11px; }
    .acc-summary--tight .mono { width: 32px; height: 32px; border-radius: 9px; font-size: 15px; }
    .acc-summary--tight .mono--logo img { width: 20px; height: 20px; }
    .acc-summary--tight .tile-name { font-size: 15.5px; }
    .acc-summary .tile-body { flex: 1; min-width: 0; }
    .acc-summary::-webkit-details-marker { display: none; }
    .acc-summary:focus-visible {
      outline: none;
      background: var(--hover-tint);
      box-shadow: inset 2px 0 0 var(--accent, var(--brand)),
                  0 0 0 3px color-mix(in srgb, var(--accent, var(--brand)) 35%, transparent);
    }
    /* Plain text, no pill — the count is a quiet fact about the row, and a
       bordered capsule was the last enclosed shape left on the board. */
    .acc-count {
      margin-left: auto; flex: none;
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .acc-chev { margin-left: 0; font-size: 15px; }
    .tile-accordion[open] .acc-chev { transform: rotate(90deg); }
    .acc-summary:hover .acc-chev,
    .acc-summary:focus-visible .acc-chev { color: var(--accent, var(--brand)); }

    /* A two-column mini list, indented under the app row it belongs to. */
    .sublinks {
      list-style: none; margin: 0;
      border-top: 0; padding: 0 0 6px 34px;
      display: grid; grid-template-columns: minmax(0, 1fr);
      row-gap: 0; column-gap: 22px;
    }
    @media (min-width: 560px) {
      .sublinks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .sublinks > li { margin-left: 0; min-width: 0; }
    .sublinks > li:has(.sublink-lead) { grid-column: 1 / -1; }
    .sublink {
      display: flex; align-items: center; gap: 9px; padding: 8px 8px;
      border-radius: 7px; text-decoration: none; color: var(--ink); font-size: 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--line-soft) 60%, transparent);
      transition: background .14s ease, border-color .14s ease;
    }
    .sublink:hover { background: var(--hover-tint); border-bottom-color: transparent; }
    .sublink:focus-visible {
      outline: none; border-bottom-color: transparent; background: var(--hover-tint);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, var(--brand)) 45%, transparent);
    }
    .sublink-tick { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent, var(--brand)); }
    .sublink-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sublink-arrow { margin-left: auto; color: var(--faint); opacity: 0; transition: opacity .14s; }
    .sublink:hover .sublink-arrow { opacity: 1; }
    /* ---- nested drill-down (a folder that holds subfolders) ------- */
    /* Closed, it's one cell of the mini list; open, it takes the full width so
       its own two-column list has room. */
    .subfolder { min-width: 0; }
    .sublinks > li.subfolder-item:has(> .subfolder[open]) { grid-column: 1 / -1; }
    .sublink-parent { cursor: pointer; list-style: none; min-width: 0; }
    .sublink-parent::-webkit-details-marker { display: none; }
    /* --muted, not --faint: --faint sits at 3.9:1 on the --paper-2 pill. */
    .subfolder-count {
      margin-left: auto; flex: none; font-size: 12px; color: var(--muted);
      background: var(--paper-2); border-radius: 999px; padding: 1px 8px;
      font-variant-numeric: tabular-nums;
    }
    .subfolder-chev { flex: none; margin-left: 8px; color: var(--muted); transition: transform .16s; }
    .subfolder[open] > .sublink-parent { color: var(--accent, var(--brand)); }
    .subfolder[open] > .sublink-parent .subfolder-chev { transform: rotate(90deg); color: var(--accent, var(--brand)); }
    .subsublinks {
      list-style: none;
      display: grid; gap: 0 18px;
      margin: 0 0 6px 10px; padding: 2px 0 2px 12px;
      border-left: 1px solid var(--line);

    .subsublinks > li { min-width: 0; }
    @media (min-width: 560px) { .subsublinks { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
    .subsublink { font-size: 13.5px; }
    .subsublink .sublink-tick { width: 5px; height: 5px; opacity: .55; }
    .subsublink-open { color: var(--muted); }

    /* pinned "open whole drive" row at the top */
    .sublink-lead { grid-column: 1 / -1; color: var(--muted); border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 2px; }
    .sublink-lead .sublink-tick { display: none; }
    .sublink-lead .sublink-name { font-style: italic; }
    .sublink-lead .sublink-arrow { opacity: .8; }
    /* a row (or subfolder) set off by a separator line above it */
    .sublink-divider, .subfolder.has-divider { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
    .subfolder.has-divider { padding-top: 0; }
    .subfolder.has-divider > .sublink-parent { margin-top: 6px; }
    .acc-note { margin: 0; padding: 4px 4px 14px; color: var(--muted); font-size: 14px; }

    .empty {
      color: var(--muted); font-size: 15px; padding: 28px 4px;

    .results-bar {

    footer {

    .announce {

    .announce-body { min-width: 0; }
    a.announce-body { color: inherit; text-decoration: none; }

    .quick.is-soon { cursor: default; opacity: .62; background: var(--paper-2); box-shadow: none; }
    .tile.is-soon, .doc-row.is-soon { cursor: default; opacity: .62; background: transparent; }

      background: var(--card);
    }
    .tile .soon-tag { margin-left: auto; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

  <script>

    /* ---- LMS Health & deploys --------------------------------------

    const STATUS_CACHE_KEY = "tu-lms-status-cache-v6";
    const STATUS_TTL_MS = 5 * 60 * 1000;
    const LIVE_SITES = [
      {

      {
        repo: "mcreed-mlri/lms-discovery",
        label: "Learning Hub",
        workflows: [
          // Pinned to main: a green run on a PR branch says nothing about
          // production, and this row is also the reference that tells a live
          // failure from a stale scheduled one (see ciApplySupersede).
          { file: "ci.yml", label: "CI", branch: "main" },
          // Same workflow file; Monday cron is filtered via event=schedule.
          { file: "ci.yml", label: "Weekly", event: "schedule" },
        ],
      },
      {
        repo: "mcreed-mlri/brightspace-manager",
        label: "Brightspace Manager",
        workflows: [
          { file: "ci.yml", label: "CI", branch: "main" },
          { file: "ci.yml", label: "Weekly", event: "schedule" },

    function buildLmsStatusPanel() {
      const panel = document.createElement("div");
      panel.className = "sites-status is-collapsed";
      panel.id = "statusPanel";
      panel.dataset.search = "health deploys ci deploy learning hub brightspace manager github status uptime";
      panel.innerHTML =
        '<div class="sites-status-head">' +
          '<button class="status-toggle" type="button" id="statusToggle" aria-expanded="false" aria-controls="ciStatus">' +
            '<span class="status-summary-dot is-pending" id="statusSummaryDot" aria-hidden="true"></span>' +
            '<span class="sites-status-label">Health &amp; deploys</span>' +
            '<svg class="status-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
          "</button>" +
          '<button class="ci-refresh" type="button" id="ciRefresh">Refresh</button>' +
        "</div>" +
        '<ul class="ci-rows" id="ciStatus" hidden></ul>';
      return panel;

    function ciRelTime(iso) {
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      return Math.round(hrs / 24) + "d ago";
    }

    async function ciFetchRun(repo, file, { event, branch } = {}) {
      const params = new URLSearchParams({ per_page: "1" });
      if (event) params.set("event", event);
      if (branch) params.set("branch", branch);
      const res = await fetch(
        "https://api.github.com/repos/" + repo + "/actions/workflows/" + file + "/runs?" + params,
        { headers: { Accept: "application/vnd.github+json" } }
      );
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      const run = data.workflow_runs && data.workflow_runs[0];
      if (!run) return null;
      return {
        status: run.status,
        conclusion: run.conclusion,
        url: run.html_url,
        createdAt: run.created_at,
        updatedAt: run.updated_at,
        event: run.event,
        sha: run.head_sha,
      };
    }

    /* Re-running a scheduled run replays the commit it was triggered on, so a
       cron failure caused by something already fixed on main can never go
       green again — the run stays red until the next Monday, days after the
       fix. A newer passing run on main, on a newer commit, is the more recent
       answer to the same question ("is main good?"), so the row takes that
       colour instead of sitting red for a week. */
    function ciApplySupersede(projects) {
      return (projects || []).map((p) => {
        const mainRuns = (p.workflows || []).filter(
          (w) => w.branch && !w.event && w.run
        );
        return {
          ...p,
          workflows: (p.workflows || []).map((w) => {
            const run = w.run;
            if (!w.event || !run || run.status !== "completed") return w;
            if (!["failure", "timed_out", "action_required"].includes(run.conclusion)) return w;
            const ref = mainRuns.find(
              (m) =>
                m.file === w.file &&
                m.run.conclusion === "success" &&
                m.run.sha &&
                m.run.sha !== run.sha &&
                new Date(m.run.createdAt) > new Date(run.createdAt)
            );
            return ref ? { ...w, supersededBy: ref.run } : w;
          }),
        };
      });
    }

    /* A weekly cron only carries information while it keeps firing, and GitHub
       disables scheduled workflows on repos that go quiet. A green dot on a run
       from three weeks ago is worse than no dot, so the row says so. Eight days
       is the Monday cadence plus a day of slack. */
    const CI_CRON_STALE_MS = 8 * 24 * 60 * 60 * 1000;

    function ciStatusMeta(w) {
      const run = w.run;
      /* Scheduled rows (Weekly) start empty until the first cron — don't treat
         that as a failure or the summary dot flashes red all week. */
      if (!run) return { cls: "is-idle", label: "Waiting for first run" };
      if (run.status !== "completed") {
        return {
          cls: "is-pending",
          label: run.status === "in_progress" ? "Running…" : "Queued…",
        };
      }
      /* Ahead of the conclusion on purpose: a cron that stopped firing hides
         behind a stale green exactly as well as behind a stale red, and it is
         the more urgent of the two problems. */
      if (
        w.event === "schedule" &&
        Date.now() - new Date(run.createdAt).getTime() > CI_CRON_STALE_MS
      ) {
        return {
          cls: "is-warn",
          label: "Cron overdue · " + ciRelTime(run.createdAt),
          title:
            "The weekly cron last fired " +
            ciRelTime(run.createdAt) +
            ". GitHub disables scheduled workflows on repos with no recent activity — check the Actions tab.",
        };
      }
      if (run.conclusion === "success") return { cls: "is-ok", label: ciRelTime(run.updatedAt) };
      if (["failure", "timed_out", "action_required"].includes(run.conclusion)) {
        if (w.supersededBy) {
          return {
            cls: "is-ok",
            label: "Fixed since · " + ciRelTime(w.supersededBy.updatedAt),
            title:
              "This run failed " +
              ciRelTime(run.updatedAt) +
              " on an older commit. Main has passed since (" +
              ciRelTime(w.supersededBy.updatedAt) +
              "). Re-running replays the old commit, so the run itself stays red until the next cron.",
          };
        }
        return { cls: "is-fail", label: "Failed · " + ciRelTime(run.updatedAt) };
      }
      return {
        cls: "is-unknown",
        label: (run.conclusion || "unknown") + " · " + ciRelTime(run.updatedAt),
      };
    }

    function liveStatusMeta(site) {
      if (!site || site.error) return { cls: "is-unknown", label: "Couldn't check" };
      if (site.ok) {
        const parts = ["Up"];
        if (site.db === "ok") parts.push("DB");
        if (typeof site.latencyMs === "number") parts.push(site.latencyMs + "ms");
        return { cls: "is-ok", label: parts.join(" · ") };
      }
      if (site.db === "fail") return { cls: "is-fail", label: "DB down" };
      if (site.db === "unconfigured") return { cls: "is-fail", label: "DB not configured" };
      return { cls: "is-fail", label: "Down" };
    }

    function liveRowHtml(site) {
      const meta = liveStatusMeta(site);
      const href = (site && site.url) || (site && site.fallbackUrl) || "#";
      return (
        '<li class="ci-row ci-row--live' + (meta.cls === "is-fail" ? " is-fail" : "") + '">' +
          '<a class="ci-row-main" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' +
            '<span class="ci-dot ' + meta.cls + '" aria-hidden="true"></span>' +
            '<span class="ci-text">' +
              '<span class="ci-name">' + escapeHtml(site.label || "Site") + "</span>" +
              '<span class="ci-meta">' + escapeHtml(meta.label) + "</span>" +
            "</span>" +
          "</a>" +
        "</li>"
      );
    }

    function ciRowHtml(project, w) {
      const meta = w.error
        ? { cls: "is-unknown", label: "Couldn't check" }
        : ciStatusMeta(w);
      const href = (w.run && w.run.url) || ("https://github.com/" + project.repo + "/actions");
      const title = meta.title ? ' title="' + escapeHtml(meta.title) + '"' : "";
      return (
        '<li class="ci-row' + (meta.cls === "is-fail" ? " is-fail" : "") + '">' +
          '<a class="ci-row-main" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer"' + title + ">" +
            '<span class="ci-dot ' + meta.cls + '" aria-hidden="true"></span>' +
            '<span class="ci-text">' +
              '<span class="ci-name">' + escapeHtml(w.label) + "</span>" +
              '<span class="ci-meta">' + escapeHtml(meta.label) + "</span>" +
            "</span>" +
          "</a>" +
        "</li>"
      );
    }

    function applyCiLabels(projects) {
      const labelByKey = new Map();
      CI_PUBLIC_PROJECTS.forEach((p) => {
        p.workflows.forEach((w) => {
          labelByKey.set(p.repo + ":" + w.file + ":" + (w.event || "") + ":" + w.label, w.label);
        });
      });
      return (projects || []).map((p) => ({
        ...p,
        label: CI_PUBLIC_PROJECTS.find((c) => c.repo === p.repo)?.label || p.label,
        workflows: (p.workflows || []).map((w) => ({
          ...w,
          label:
            labelByKey.get(p.repo + ":" + w.file + ":" + (w.event || "") + ":" + w.label) ||
            w.label,
        })),
      }));
    }

    function statusRender(el, sites, projects) {
      const labeledProjects = ciApplySupersede(applyCiLabels(projects));
      const liveItems = (sites && sites.length
        ? sites
        : LIVE_SITES.map((s) => ({ ...s, error: true }))
      )
        .map(liveRowHtml)
        .join("");
      const liveHtml =
        '<li class="ci-block ci-block--live">' +
          '<span class="ci-group-label">Live</span>' +
          '<ul class="ci-live-grid">' + liveItems + "</ul>" +
        "</li>";
      const ciHtml = labeledProjects
        .map(
          (p) =>
            '<li class="ci-group"><span class="ci-group-label">' +
            escapeHtml(p.label) +
            "</span></li>" +
            p.workflows.map((w) => ciRowHtml(p, w)).join("")
        )
        .join("");
      el.innerHTML = liveHtml + ciHtml;
      updateStatusSummary(sites, labeledProjects);
      setStatusCollapsed(
        document.getElementById("statusPanel")?.classList.contains("is-collapsed") ?? true
      );
    }

    function computeStatusSummary(sites, projects) {
      const classes = [];
      (sites || []).forEach((s) => classes.push(liveStatusMeta(s).cls));
      (projects || []).forEach((p) => {
        p.workflows.forEach((w) => {
          const meta = w.error ? { cls: "is-unknown" } : ciStatusMeta(w);
          classes.push(meta.cls);
        });
      });
      if (!classes.length) return "pending";
      /* Only live failures flash red — a cron failure main has already moved
         past reads green, since main passing later is the newer answer. Idle =
         waiting for first scheduled run; unknown/pending stay amber so
         rate-limits don't look like outages, and warn is a cron that has
         stopped firing: worth a glance, not an alarm. */
      if (classes.some((c) => c === "is-fail")) return "fail";
      if (classes.some((c) => c === "is-unknown" || c === "is-pending" || c === "is-warn"))
        return "pending";
      return "ok";
    }

    function updateStatusSummary(sites, projects) {
      const dot = document.getElementById("statusSummaryDot");
      if (!dot) return;
      dot.className = "status-summary-dot is-" + computeStatusSummary(sites, projects);
    }

    function setStatusCollapsed(collapsed) {
      const panel = document.getElementById("statusPanel");
      const list = document.getElementById("ciStatus");
      const toggle = document.getElementById("statusToggle");
      if (!panel || !list || !toggle) return;
      panel.classList.toggle("is-collapsed", collapsed);
      list.hidden = collapsed;
      toggle.setAttribute("aria-expanded", String(!collapsed));
    }

    async function probeLiveSiteClient(site) {
      const started = Date.now();
      try {
        if (site.kind === "homepage") {
          const res = await fetch(site.healthUrl, {
            cache: "no-store",
            mode: "no-cors",
          });
          return {
            id: site.id,
            label: site.label,
            ok: res.type === "opaque" || res.ok || (res.status >= 300 && res.status < 400),
            source: "homepage",
            db: null,
            latencyMs: Date.now() - started,
            url: site.fallbackUrl,
          };
        }

        const res = await fetch(site.healthUrl, { cache: "no-store" });
        const latencyMs = Date.now() - started;
        const contentType = res.headers.get("content-type") || "";
        if (res.ok && contentType.includes("application/json")) {
          const body = await res.json();
          if (body && typeof body.ok === "boolean") {
            return {
              id: site.id,
              label: site.label,
              ok: body.ok === true && body.db !== "fail",
              source: "health",
              db: body.db ?? null,
              latencyMs: typeof body.latencyMs === "number" ? body.latencyMs : latencyMs,
              url: site.fallbackUrl,
            };
          }
        }
        const homeStarted = Date.now();
        const home = await fetch(site.fallbackUrl, { cache: "no-store", mode: "no-cors" });
        return {
          id: site.id,
          label: site.label,
          ok: home.type === "opaque" || home.ok,
          source: "homepage",
          db: null,
          latencyMs: Date.now() - homeStarted,
          url: site.fallbackUrl,
        };
      } catch {
        return {
          id: site.id,
          label: site.label,
          ok: false,
          source: "error",
          db: null,
          latencyMs: Date.now() - started,
          url: site.fallbackUrl,
          error: true,
        };
      }
    }

    async function fetchLiveSites() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.sites)) return data.sites;
        }
      } catch {}
      return Promise.all(LIVE_SITES.map(probeLiveSiteClient));
    }

    async function ciFetchProjectsClient() {
      return Promise.all(
        CI_PUBLIC_PROJECTS.map(async (project) => {
          const workflows = await Promise.all(
            project.workflows.map(async (w) => {
              try {
                return {
                  ...w,
                  run: await ciFetchRun(project.repo, w.file, w),
                };
              } catch {
                return { ...w, run: null, error: true };
              }
            })
          );
          return { repo: project.repo, label: project.label, workflows };
        })
      );
    }

    async function ciFetchProjects() {
      try {
        const res = await fetch("/api/ci", { cache: "no-store" });
        if (res.ok) return (await res.json()).projects;
      } catch {}
      return ciFetchProjectsClient();
    }

    async function loadStatusPanel(force) {
      const el = document.getElementById("ciStatus");
      if (!el) return;

      let cache = null;
      try {
        cache = JSON.parse(localStorage.getItem(STATUS_CACHE_KEY) || "null");
      } catch {}
      const fresh = cache && Date.now() - cache.ts < STATUS_TTL_MS;

      if (fresh && !force) {
        statusRender(el, cache.sites, cache.projects);
        return;
      }
      if (cache) statusRender(el, cache.sites, cache.projects);
      else {
        updateStatusSummary(null, null);
        el.innerHTML =
          '<li class="ci-row" style="grid-column:1/-1"><span class="ci-row-main">' +
          '<span class="ci-dot is-pending" aria-hidden="true"></span>' +
          '<span class="ci-text"><span class="ci-name">Checking status…</span></span></span></li>';
        setStatusCollapsed(
          document.getElementById("statusPanel")?.classList.contains("is-collapsed") ?? true
        );
      }

      try {
        const [sites, projects] = await Promise.all([fetchLiveSites(), ciFetchProjects()]);
        localStorage.setItem(
          STATUS_CACHE_KEY,
          JSON.stringify({ ts: Date.now(), sites, projects })
        );
        statusRender(el, sites, projects);
      } catch {
        // Network down or rate-limited: leave stale cache showing.
      }
    }

    document.getElementById("statusToggle")?.addEventListener("click", () => {
      const panel = document.getElementById("statusPanel");
      setStatusCollapsed(!panel?.classList.contains("is-collapsed"));
    });
    document.getElementById("ciRefresh")?.addEventListener("click", (e) => {
      e.stopPropagation();
      loadStatusPanel(true);
    });
    setStatusCollapsed(true);
    loadStatusPanel(false);

    /* ---- team avatar stack ----------------------------------------- */
    /* Each focus page is one avatar in the header. Past AVATAR_MAX the rest
       collapse into a "+N" chip that opens the same popover list, so the stack
       never pushes the header's actions off the row. */
    const AVATAR_MAX = 4;

    (function renderAvatarStack() {
      const stack = document.getElementById("avatarStack");
      if (!stack) return;

      const fits = FOCUS_PAGES.length <= AVATAR_MAX;
      const shown = fits ? FOCUS_PAGES : FOCUS_PAGES.slice(0, AVATAR_MAX - 1);
      const rest = fits ? [] : FOCUS_PAGES.slice(AVATAR_MAX - 1);

      for (const p of shown) {
        const a = document.createElement("a");
        a.className = "avatar";
        a.href = p.url;                       // same-site, so same tab
        a.style.setProperty("--accent", p.accent);
        a.title = p.name + "’s focus page";
        a.setAttribute("aria-label", p.name + "’s focus page");
        a.textContent = p.mono;
        stack.appendChild(a);
      }

      if (!rest.length) return;

      const menu = document.createElement("details");
      menu.className = "av-menu";
      const sum = document.createElement("summary");
      sum.title = rest.length + " more focus pages";
      sum.setAttribute("aria-label", "Show " + rest.length + " more focus pages");
      sum.textContent = "+" + rest.length;

      const list = document.createElement("ul");
      list.className = "focus-list";
      for (const p of rest) {
        const a = document.createElement("a");
        a.href = p.url;
        a.style.setProperty("--accent", p.accent);
        const mono = document.createElement("span");
        mono.className = "fm-mono";
        mono.setAttribute("aria-hidden", "true");
        mono.textContent = p.mono;
        const name = document.createElement("span");
        name.textContent = p.name;
        a.append(mono, name);
        const li = document.createElement("li");
        li.appendChild(a);
        list.appendChild(li);
      }

      menu.append(sum, list);
      stack.appendChild(menu);

      // <details> has no built-in dismiss, so wire up the two people expect.
      document.addEventListener("click", (e) => {
        if (menu.open && !menu.contains(e.target)) menu.open = false;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && menu.open) {
          menu.open = false;
          sum.focus();
        }
      });
    })();

    /* ---- announcement --------------------------------------------- */
    /* Shows the banner unless its `id` was already dismissed on this device.
       Bumping ANNOUNCEMENT.id re-shows it to everyone. */
    (function renderAnnouncement() {
      const a = ANNOUNCEMENT;
      if (!a || !a.text || !a.text.trim()) return;
      let dismissed = "";
      try { dismissed = localStorage.getItem("tu-announce") || ""; } catch (e) {}
      if (a.id && dismissed === a.id) return;

      const el = document.createElement("div");
      el.className = "announce";
      el.setAttribute("role", "region");
      el.setAttribute("aria-label", "Team announcement");

      const dot = document.createElement("span");
      dot.className = "announce-dot"; dot.setAttribute("aria-hidden", "true");

      const body = document.createElement(a.url ? "a" : "span");
      body.className = "announce-body";
      if (a.url) { body.href = a.url; body.target = "_blank"; body.rel = "noopener noreferrer"; }
      body.innerHTML = '<span class="announce-text"></span>' +
        (a.url ? '<span class="announce-more">Open<span class="sr-only"> (opens in new tab)</span> →</span>' : '');
      body.querySelector(".announce-text").textContent = a.text;

      const x = document.createElement("button");
      x.className = "announce-x"; x.type = "button";
      x.setAttribute("aria-label", "Dismiss announcement");
      x.innerHTML = "&times;";
      x.addEventListener("click", () => {
        el.remove();
        try { if (a.id) localStorage.setItem("tu-announce", a.id); } catch (e) {}
      });

      el.append(dot, body, x);
      document.getElementById("announce").appendChild(el);
    })();

    /* ---- filter ---------------------------------------------------- */
    const q = document.getElementById("q");
    const empty = document.getElementById("empty");
    const searchToggle = document.getElementById("searchToggle");
    const searchPanel = document.getElementById("searchPanel");
    const searchField = document.getElementById("searchField");
    const searchClear = document.getElementById("searchClear");
    const searchCount = document.getElementById("searchCount");
    const resultsBar = document.getElementById("resultsBar");
    const resultsBarText = document.getElementById("resultsBarText");
    const resultsBarClear = document.getElementById("resultsBarClear");

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, c => (c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"));
    }

    // Wrap each matching token in the element's visible text with <mark>.
    // Stores the pristine text in dataset.raw so it can be restored when cleared.
    function highlight(el, tokens) {
      if (el.dataset.raw === undefined) el.dataset.raw = el.textContent;
      const raw = el.dataset.raw;
      if (!tokens.length) {
        if (el.innerHTML !== raw) el.textContent = raw;
        return;
      }
      const escaped = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).filter(Boolean);
      const re = new RegExp("(" + escaped.join("|") + ")", "gi");
      el.innerHTML = escapeHtml(raw).replace(re, '<mark class="hl">$1</mark>');
    }

    function setSearchOpen(open) {
      searchPanel.classList.toggle("is-open", open);
      searchToggle.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) {
        searchPanel.removeAttribute("inert");
        q.tabIndex = 0;
        q.focus();
      } else {
        searchPanel.setAttribute("inert", "");
        q.tabIndex = -1;
        q.blur();
      }
    }

    function applyFilter() {
      const term = q.value.trim().toLowerCase();
      const tokens = term.split(/\s+/).filter(Boolean);
      const matches = (hay) => tokens.every(t => hay.includes(t));
      board.classList.toggle("is-searching", !!term);
      board.setAttribute("aria-label", term ? "Search results" : "Training Unit tools");
      searchField.classList.toggle("has-text", !!q.value);
      let anyVisible = false;
      let count = 0;
      for (const sec of board.querySelectorAll(".dash-panel")) {
        let secVisible = false;
        for (const el of sec.querySelectorAll("[data-search]")) {
          const match = !term || matches(el.dataset.search);
          el.style.display = match ? "" : "none";
          if (match) {
            secVisible = true; anyVisible = true;
            // Count only top-level tiles/cards, not their nested sublinks.
            if (term && !el.parentElement.closest("[data-search]")) count++;
          }
          if (el.classList.contains("tile-accordion")) {
            // While searching, drop the exclusive <details name> grouping so
            // several matching accordions (e.g. Google + Monday) can stay open
            // at once; restore it when the search clears.
            if (el.dataset.group) {
              if (term) el.removeAttribute("name");
              else el.setAttribute("name", el.dataset.group);
            }
            el.open = term ? match : el.dataset.default === "open";
          }
          if (el.classList.contains("subfolder")) {
            el.open = term ? match : false;
          }
        }
        sec.style.display = secVisible ? "" : "none";
      }
      for (const t of board.querySelectorAll(".tile-name, .sublink-name, .app-label")) highlight(t, tokens);
      empty.style.display = anyVisible ? "none" : "block";
      searchToggle.classList.toggle("is-active", !!term);
      // #searchCount is a polite live region; the #empty message covers the zero case.
      if (!term || !anyVisible) {
        searchCount.textContent = "";
      } else {
        searchCount.textContent = count + (count === 1 ? " tool matches" : " tools match");
      }
      // Results bar: a visible, always-present way back to all tools while
      // searching (the search panel may be closed but the filter still active).
      resultsBar.hidden = !term;
      if (term) {
        const n = anyVisible ? count : 0;
        resultsBarText.innerHTML = anyVisible
          ? "Showing <strong>" + n + "</strong> result" + (n === 1 ? "" : "s") + " for “<strong>" + escapeHtml(term) + "</strong>”"
          : "No results for “<strong>" + escapeHtml(term) + "</strong>”";
      }
    }
    q.addEventListener("input", applyFilter);

    /* Rotating a phone to landscape crosses the breakpoint, so re-apply the
       default rather than leaving the lists in the other layout's state. An
       active search owns the open/closed state, so leave it alone. */
    compact.addEventListener("change", () => {
      if (q.value.trim()) return;
      for (const el of board.querySelectorAll('.tile-accordion[data-wants-open="1"]')) {
        el.dataset.default = compact.matches ? "closed" : "open";
        el.open = !compact.matches;
      }
    });

    function clearSearch(focusEl) {
      q.value = ""; applyFilter();
      if (focusEl) focusEl.focus();
    }
    searchClear.addEventListener("click", () => clearSearch(q));
    resultsBarClear.addEventListener("click", () => { clearSearch(); setSearchOpen(false); searchToggle.focus(); });

    searchToggle.addEventListener("click", () => {
      setSearchOpen(!searchPanel.classList.contains("is-open"));
    });

    document.addEventListener("click", (e) => {
      if (searchPanel.classList.contains("is-open") && !e.target.closest(".search-wrap")) {
        setSearchOpen(false);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const active = document.activeElement;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable)) return;
        e.preventDefault(); setSearchOpen(true);
      }
      if (e.key === "Escape" && (document.activeElement === q || searchPanel.classList.contains("is-open"))) {
        if (q.value) { q.value = ""; applyFilter(); q.focus(); }  // first Esc clears
        else { setSearchOpen(false); }                           // then closes
      }
    });

    /* ---- theme toggle --------------------------------------------- */
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const SUN  = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : prefersDark.matches);

    function paintTheme() {
      const dark = isDark();
      toggle.innerHTML = dark ? SUN : MOON;                 // show where the click takes you
      const themeLabel = dark ? "Switch to light mode" : "Switch to dark mode";
      toggle.setAttribute("aria-label", themeLabel);
      toggle.setAttribute("title", themeLabel);
      if (themeMeta) themeMeta.content = dark ? "#191c24" : "#fdf6f1";  // match the header band
    }
    toggle.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("tu-theme", next); } catch (e) {}
      paintTheme();
    });
    prefersDark.addEventListener("change", () => { if (!root.dataset.theme) paintTheme(); });
    paintTheme();

    /* ---- greeting + date ------------------------------------------ */
    (function () {
      const now = new Date();
      const h = now.getHours();
      const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      const g = document.getElementById("greeting");
      const t = document.getElementById("today");
      if (g) g.textContent = greet + ".";
      if (t) t.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    })();

    /* ---- service worker ------------------------------------------- */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
