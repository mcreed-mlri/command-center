name: Refresh Monday snapshot

# Regenerates the task lists baked into each team focus page from the live LACE
# boards and commits them, so /marlie, /olivia, /carolina, and /ashley stay
# current without anyone re-pulling by hand. Needs the repo secret
# MONDAY_API_TOKEN (Monday → avatar → Developers → My access tokens).
#
# Every page is wired up — the Monday user ids are baked into the script, so
# these secrets are optional overrides, only needed if someone's id changes:
#   MONDAY_USER_ID_MARLIE, MONDAY_USER_ID_OLIVIA, MONDAY_USER_ID_CAROLINA,
#   MONDAY_USER_ID_ASHLEY

on:
  schedule:
    # 07:17 UTC — 3:17am in Boston on EDT, 2:17am on EST. Off the hour on
    # purpose: :00 is the busiest minute on GitHub's scheduler.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-tasks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate snapshots
        shell: bash
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_USER_ID_MARLIE: ${{ secrets.MONDAY_USER_ID_MARLIE }}
          MONDAY_USER_ID_OLIVIA: ${{ secrets.MONDAY_USER_ID_OLIVIA }}
          MONDAY_USER_ID_CAROLINA: ${{ secrets.MONDAY_USER_ID_CAROLINA }}
          MONDAY_USER_ID_ASHLEY: ${{ secrets.MONDAY_USER_ID_ASHLEY }}
        run: |
          set -o pipefail
          node scripts/refresh-tasks.mjs | tee /tmp/refresh.log
          {
            echo "### Monday refresh"
            echo
            echo '```'
            cat /tmp/refresh.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed pages
        shell: bash
        run: |
          changed=$(git diff --name-only -- marlie/index.html olivia/index.html carolina/index.html ashley/index.html || true)
          if [ -z "$changed" ]; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marlie/index.html olivia/index.html carolina/index.html ashley/index.html
          git commit -m "Refresh team Monday task snapshots"
          git push
