      puzzle: SVG('<path d="M19.439 7.85c-.049.322.059.648.293.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 1 0-3.214 3.214c.446.166.855.497.925.968a.979.979 0 0 1-.276.837l-1.61 1.61a2.404 2.404 0 0 1-1.705.707 2.402 2.402 0 0 1-1.704-.706l-1.568-1.568a1.026 1.026 0 0 0-.877-.293 2.483 2.483 0 0 1-2.502-2.502c0-.29.062-.566.293-.877L5.024 8.367c.47-.47 1.086-.706 1.704-.706s1.233.235 1.704.706l1.568 1.568c.23.23.556.338.877.293a2.483 2.483 0 0 1 2.502 2.502Z"/>'),
    };
    const PIN_ICON_KEYS = Object.keys(PIN_ICONS);
    const CHECK_SVG = SVG('<path d="M20 6 9 17l-5-5"/>');

    const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    const nowISO = () => new Date().toISOString();

    /* A pin url becomes an href, so anything but http(s) is dropped — the
       same gate the Worker applies, repeated here because data can also
       arrive straight from localStorage. */
    function safeUrl(v) {
      try {
        const u = new URL(String(v == null ? "" : v).trim());
        return u.protocol === "http:" || u.protocol === "https:" ? u.href : "";
      } catch (e) { return ""; }
    }
    const clip = (v, n) => String(v == null ? "" : v).slice(0, n).trim();

    function normalize(o) {
      o = o && typeof o === "object" ? o : {};
      const pins = (Array.isArray(o.pins) ? o.pins : []).slice(0, 40).map(p => ({
        id: clip(p && p.id, 40) || rid(),
        label: clip(p && p.label, 60),
        url: safeUrl(p && p.url),
        icon: PIN_ICON_KEYS.indexOf(p && p.icon) > -1 ? p.icon : "link",
        color: /^#[0-9a-fA-F]{6}$/.test((p && p.color) || "") ? p.color : PIN_COLORS[0],
      })).filter(p => p.label && p.url);
      const todos = (Array.isArray(o.todos) ? o.todos : []).slice(0, 300).map(t => ({
        id: clip(t && t.id, 40) || rid(),
        text: clip(t && t.text, 300),
        done: Boolean(t && t.done),
        created: clip(t && t.created, 40) || nowISO(),
      })).filter(t => t.text);
      return { v: 1, pins, todos, updated: clip(o.updated, 40) || null };
    }

    let myData = (function () {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) return normalize(JSON.parse(raw));
      } catch (e) {}
      return normalize(null);
    })();

    /* ---- sync -------------------------------------------------------- */
    let pushTimer = null;
    let remoteLive = null;  // null = untested, true = KV answered, false = local only
    let pullDone = false;

    const syncEl = document.createElement("span");
    syncEl.className = "sync-note";
    syncEl.hidden = true;
    syncEl.innerHTML = '<span class="sync-dot"></span><span class="sync-text"></span>';
    document.getElementById("syncSlot").append(" · ", syncEl);

    function dataEqual(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    function mergeTodos(local, remote, localWins) {
      const byId = new Map();
      for (const t of remote) byId.set(t.id, { ...t });
      for (const t of local) {
        const r = byId.get(t.id);
        if (!r) { byId.set(t.id, { ...t }); continue; }
        byId.set(t.id, {
          id: t.id,
          text: localWins ? (t.text || r.text) : (r.text || t.text),
          done: r.done || t.done,
          created: r.created || t.created,
        });
      }
      const out = [];
      const seen = new Set();
      for (const t of local) {
        if (byId.has(t.id)) { out.push(byId.get(t.id)); seen.add(t.id); }
      }
      for (const t of remote) {
        if (!seen.has(t.id)) out.push(byId.get(t.id));
      }
      return out;
    }

    function mergePins(local, remote, localWins) {
      const byId = new Map();
      for (const p of remote) byId.set(p.id, { ...p });
      for (const p of local) {
        const r = byId.get(p.id);
        if (!r) { byId.set(p.id, { ...p }); continue; }
        byId.set(p.id, {
          id: p.id,
          label: localWins ? (p.label || r.label) : (r.label || p.label),
          url: localWins ? (p.url || r.url) : (r.url || p.url),
          icon: localWins ? (p.icon || r.icon) : (r.icon || p.icon),
          color: localWins ? (p.color || r.color) : (r.color || p.color),
        });
      }
      const out = [];
      const seen = new Set();
      for (const p of local) {
        if (byId.has(p.id)) { out.push(byId.get(p.id)); seen.add(p.id); }
      }
      for (const p of remote) {
        if (!seen.has(p.id)) out.push(byId.get(p.id));
      }
      return out;
    }

    function mergeData(local, remote) {
      const localWins = (local.updated || "") >= (remote.updated || "");
      return normalize({
        v: 1,
        pins: mergePins(local.pins, remote.pins, localWins),
        todos: mergeTodos(local.todos, remote.todos, localWins),
        updated: [local.updated, remote.updated].filter(Boolean).sort().pop() || null,
      });
    }

    function applyData(next, opts) {
      const prev = JSON.stringify(myData);
      myData = next;
      if (JSON.stringify(myData) === prev) return false;
      if (opts && opts.bump) myData.updated = nowISO();
      saveLocal();
      renderPins();
      renderTodos();
      return true;
    }

    function setSync(state, text) {
      if (remoteLive === false && state !== "local") return;
      syncEl.hidden = false;
      syncEl.dataset.state = state;
      syncEl.querySelector(".sync-text").textContent = text;
    }

    function saveLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(myData)); } catch (e) {}
    }

    /* Every mutation goes through here: stamp, persist locally, queue a push. */
    function changed() {
      myData.updated = nowISO();
      saveLocal();
      clearTimeout(pushTimer);
      if (remoteLive !== false) setSync("saving", "Saving…");
      pushTimer = setTimeout(push, PUSH_DELAY);
    }

    async function push() {
      if (remoteLive === false) return;
      try {
        const getRes = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (getRes.ok) {
          const remote = normalize(await getRes.json());
          const merged = mergeData(myData, remote);
          if (!dataEqual(merged, myData)) applyData(merged, { bump: true });
        }
        const res = await fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(myData),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        remoteLive = true;
        setSync("saved", "Synced across devices");
      } catch (e) {
        if (remoteLive === null && !pullDone) return;
        if (remoteLive === null) { remoteLive = false; setSync("local", "Saved on this device only"); }
        else setSync("error", "Couldn't sync — will retry");
      }
    }

    async function pull() {
      try {
        const res = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const remote = normalize(await res.json());
        remoteLive = true;
        const merged = mergeData(myData, remote);
        const differsFromLocal = !dataEqual(merged, myData);
        const differsFromRemote = !dataEqual(merged, remote);
        if (differsFromLocal) applyData(merged, { bump: differsFromRemote });
        if (differsFromLocal && differsFromRemote) {
          clearTimeout(pushTimer);
          if (remoteLive !== false) setSync("saving", "Saving…");
          pushTimer = setTimeout(push, PUSH_DELAY);
        }
        setSync("saved", "Synced across devices");
      } catch (e) {
        remoteLive = false;
        setSync("local", "Saved on this device only");
      } finally {
        pullDone = true;
      }
    }

    /* ---- pins -------------------------------------------------------- */
    const pinsEl = document.getElementById("pins");
    const pinEditorEl = document.getElementById("pinEditor");
    const pinManageBtn = document.getElementById("pinManage");
    let manageMode = false;
    let editingId = null;   // pin id being edited, or "new", or null

    function pinLink(p) {
      const a = document.createElement("a");
      a.href = p.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--link-accent", p.color);
      const icon = document.createElement("span");
      icon.className = "link-icon";
      icon.innerHTML = PIN_ICONS[p.icon] || PIN_ICONS.link;
      const name = document.createElement("span");
      name.className = "lname";
      name.textContent = p.label;
      const arr = document.createElement("span");
      arr.className = "larr";
      arr.setAttribute("aria-hidden", "true");
      arr.textContent = "↗";
      a.append(icon, name, arr);
      return a;
    }

    function miniBtn(label, title, onClick, disabled) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mini-btn icon-only";
      b.textContent = label;
      b.title = title;
      b.setAttribute("aria-label", title);
      b.disabled = Boolean(disabled);
      b.addEventListener("click", onClick);
      return b;
    }

    function renderPins() {
      pinsEl.replaceChildren();

      if (!myData.pins.length && !manageMode) {
        const li = document.createElement("li");
        li.className = "list-empty";
        li.textContent = "No pins yet — hit Manage to add one.";
        pinsEl.appendChild(li);
      }

      myData.pins.forEach((p, i) => {
        const li = document.createElement("li");
        if (!manageMode) {
          li.appendChild(pinLink(p));
        } else {
          li.className = "pin-manage";
          li.style.setProperty("--link-accent", p.color);
          const dot = document.createElement("span");
          dot.className = "pin-swatch";
          const label = document.createElement("span");
          label.className = "pin-label";
          label.textContent = p.label;
          const actions = document.createElement("span");
          actions.className = "pin-actions";
          actions.append(
            miniBtn("↑", "Move up", () => movePin(i, -1), i === 0),
            miniBtn("↓", "Move down", () => movePin(i, 1), i === myData.pins.length - 1),
            miniBtn("✎", "Edit " + p.label, () => openEditor(p.id)),
            miniBtn("✕", "Delete " + p.label, () => deletePin(p.id))
          );
          li.append(dot, label, actions);
        }
        pinsEl.appendChild(li);
      });

      renderEditor();
    }

    function movePin(i, d) {
      const j = i + d;
      if (j < 0 || j >= myData.pins.length) return;
      const [p] = myData.pins.splice(i, 1);
      myData.pins.splice(j, 0, p);
      changed();
      renderPins();
    }

    function deletePin(id) {
      myData.pins = myData.pins.filter(p => p.id !== id);
      if (editingId === id) editingId = null;
      changed();
      renderPins();
    }

    function renderEditor() {
      pinEditorEl.replaceChildren();
      if (!manageMode) return;

      if (!editingId) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "mini-btn";
        add.textContent = "+ Add a pin";
        add.style.marginTop = "10px";
        add.addEventListener("click", () => openEditor("new"));
        pinEditorEl.appendChild(add);
        return;
      }

      const existing = myData.pins.find(p => p.id === editingId);
      const draft = existing
        ? Object.assign({}, existing)
        : { id: rid(), label: "", url: "", icon: "link", color: PIN_COLORS[0] };

      const form = document.createElement("form");
      form.className = "pin-form";

      const nameLabel = document.createElement("label");
      nameLabel.textContent = "Label";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.maxLength = 60;
      nameInput.value = draft.label;
      nameInput.placeholder = "Faculty tracker";

      const urlLabel = document.createElement("label");
      urlLabel.textContent = "Link";
      const urlInput = document.createElement("input");
      urlInput.type = "url";
      urlInput.value = draft.url;
      urlInput.placeholder = "https://…";

      const iconLabel = document.createElement("label");
      iconLabel.textContent = "Icon";
      const iconGrid = document.createElement("div");
      iconGrid.className = "icon-grid";
      PIN_ICON_KEYS.forEach(k => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon-pick";
        b.innerHTML = PIN_ICONS[k];
        b.title = k;
        b.setAttribute("aria-label", "Icon: " + k);
        b.setAttribute("aria-pressed", String(draft.icon === k));
        b.addEventListener("click", () => {
          draft.icon = k;
          iconGrid.querySelectorAll(".icon-pick").forEach((x, xi) =>
            x.setAttribute("aria-pressed", String(PIN_ICON_KEYS[xi] === k)));
        });
        iconGrid.appendChild(b);
      });

      const colorLabel = document.createElement("label");
      colorLabel.textContent = "Color";
      const swatches = document.createElement("div");
      swatches.className = "swatches";
      PIN_COLORS.forEach(c => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.background = c;
        b.title = c;
        b.setAttribute("aria-label", "Color " + c);
        b.setAttribute("aria-pressed", String(draft.color === c));
        b.addEventListener("click", () => {
          draft.color = c;
          swatches.querySelectorAll(".swatch").forEach((x, xi) =>
            x.setAttribute("aria-pressed", String(PIN_COLORS[xi] === c)));
        });
        swatches.appendChild(b);
      });

      const actions = document.createElement("div");
      actions.className = "form-actions";
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "btn-sm btn-primary";
      save.textContent = existing ? "Save" : "Add pin";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "btn-sm btn-ghost";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => { editingId = null; renderEditor(); });
      actions.append(save, cancel);
      if (existing) {
        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-sm btn-danger";
        del.textContent = "Delete";
        del.addEventListener("click", () => deletePin(existing.id));
        actions.appendChild(del);
      }

      const err = document.createElement("p");
      err.className = "list-empty";
      err.style.cssText = "padding:6px 0 0;text-align:left;color:var(--danger)";
      err.hidden = true;

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const label = clip(nameInput.value, 60);
        const url = safeUrl(urlInput.value);
        if (!label) { err.textContent = "Give it a label."; err.hidden = false; return; }
        if (!url) { err.textContent = "Needs a full http:// or https:// link."; err.hidden = false; return; }
        const next = { id: draft.id, label, url, icon: draft.icon, color: draft.color };
        if (existing) myData.pins = myData.pins.map(p => (p.id === next.id ? next : p));
        else myData.pins.push(next);
        editingId = null;
        changed();
        renderPins();
      });

      form.append(nameLabel, nameInput, urlLabel, urlInput, iconLabel, iconGrid,
                  colorLabel, swatches, actions, err);
      pinEditorEl.appendChild(form);
      nameInput.focus();
    }

    function openEditor(id) { editingId = id; renderEditor(); }

    pinManageBtn.addEventListener("click", () => {
      manageMode = !manageMode;
      editingId = null;
      pinManageBtn.setAttribute("aria-pressed", String(manageMode));
      pinManageBtn.textContent = manageMode ? "Done" : "Manage";
      renderPins();
    });

    /* ---- my list ----------------------------------------------------- */
    const todosEl = document.getElementById("todos");
    const todoCountEl = document.getElementById("todoCount");
    const todoFootEl = document.getElementById("todoFoot");
    const todoInput = document.getElementById("todoInput");

    function renderTodos() {
      todosEl.replaceChildren();
      const open = myData.todos.filter(t => !t.done);
      const done = myData.todos.filter(t => t.done);
      const ordered = open.concat(done);

      if (!ordered.length) {
        const li = document.createElement("li");
        li.className = "list-empty";
        li.textContent = "Nothing on your list.";
        todosEl.appendChild(li);
      }

      ordered.forEach(t => {
        const section = t.done ? done : open;
        const i = section.findIndex(x => x.id === t.id);

        const li = document.createElement("li");
        li.className = "todo" + (t.done ? " done" : "");

        const check = document.createElement("button");
        check.type = "button";
        check.className = "todo-check";
        check.innerHTML = CHECK_SVG;
        check.setAttribute("aria-pressed", String(t.done));
        check.setAttribute("aria-label", (t.done ? "Mark unfinished: " : "Mark finished: ") + t.text);
        check.addEventListener("click", () => {
          t.done = !t.done;
          changed();
          renderTodos();
        });

        const text = document.createElement("span");
        text.className = "todo-text";
        text.dataset.id = t.id;
        text.textContent = t.text;
        text.title = "Click to edit";
        /* A span with a click handler is mouse-only. Make it a real control so
           the list can be edited without a pointer. */
        text.tabIndex = 0;
        text.setAttribute("role", "button");
        text.setAttribute("aria-label", "Edit: " + t.text);
        text.addEventListener("click", () => startEdit(li, text, t));
        text.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            startEdit(li, text, t);
          }
        });

        const actions = document.createElement("span");
        actions.className = "todo-actions";
        actions.append(
          miniBtn("↑", "Move up", () => moveTodo(t.id, -1), i === 0),
          miniBtn("↓", "Move down", () => moveTodo(t.id, 1), i === section.length - 1),
        );

        const del = document.createElement("button");
        del.type = "button";
        del.className = "todo-del";
        del.textContent = "✕";
        del.title = "Delete";
        del.setAttribute("aria-label", "Delete: " + t.text);
        del.addEventListener("click", () => {
          myData.todos = myData.todos.filter(x => x.id !== t.id);
          changed();
          renderTodos();
        });
        actions.appendChild(del);

        li.append(check, text, actions);
        todosEl.appendChild(li);
      });

      const openCount = open.length;
      const doneCount = done.length;
      todoCountEl.textContent = myData.todos.length ? openCount + " open" : "";
      todoFootEl.hidden = !doneCount;
    }

    function moveTodo(id, d) {
      const open = myData.todos.filter(t => !t.done);
      const done = myData.todos.filter(t => t.done);
      let section = open;
      let i = open.findIndex(t => t.id === id);
      if (i === -1) {
        section = done;
        i = done.findIndex(t => t.id === id);
      }
      if (i === -1) return;
      const j = i + d;
      if (j < 0 || j >= section.length) return;
      const [item] = section.splice(i, 1);
      section.splice(j, 0, item);
      myData.todos = open.concat(done);
      changed();
      renderTodos();
    }

    function startEdit(li, textEl, todo) {
      const input = document.createElement("input");
      input.className = "todo-edit";
      input.type = "text";
      input.maxLength = 300;
      input.value = todo.text;
      let settled = false;
      const finish = (commit) => {
        if (settled) return;
        settled = true;
        const next = clip(input.value, 300);
        if (commit && next && next !== todo.text) { todo.text = next; changed(); }
        renderTodos();
        /* renderTodos() rebuilds the list, so put the caret back where the
           person left it instead of dropping focus to the top of the page. */
        const back = Array.from(todosEl.querySelectorAll(".todo-text"))
          .find((el) => el.dataset.id === todo.id);
        if (back) back.focus();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      input.addEventListener("blur", () => finish(true));
      li.replaceChild(input, textEl);
      input.focus();
      input.select();
    }

    document.getElementById("todoAdd").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = clip(todoInput.value, 300);
      if (!text) return;
      myData.todos.push({ id: rid(), text, done: false, created: nowISO() });
      todoInput.value = "";
      changed();
      renderTodos();
      todoInput.focus();
    });

    document.getElementById("clearDone").addEventListener("click", () => {
      myData.todos = myData.todos.filter(t => !t.done);
      changed();
      renderTodos();
    });

    /* ---- init ------------------------------------------------------ */
    loadLiveTasks();
    paintSnapNote();
    renderFilters();
    setView(view);
    renderPins();
    renderTodos();
    pull();
    // A pending debounce would otherwise be lost when the tab closes.
    addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && pushTimer) { clearTimeout(pushTimer); push(); }
      else if (document.visibilityState === "visible" && pullDone) pull();
    });
  </script>
</body>
</html>
