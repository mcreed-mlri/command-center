<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marlie · Focus Page</title>
  <meta name="description" content="Marlie's personal focus page — Monday tasks and quick links." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#efd1b9" />
  <link rel="icon" href="../icons/app/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../tokens.css" />

  <style>
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; overflow-x:clip; overscroll-behavior-x:none; }
    body {
      margin:0; width:100%; max-width:100%; overflow-x:clip; overscroll-behavior-x:none;
      touch-action:pan-y pinch-zoom;
      font-family:var(--sans); color:var(--ink); line-height:1.5;
      background:var(--canvas-bg);
      -webkit-font-smoothing:antialiased;
      padding:max(20px,env(safe-area-inset-top)) var(--layout-gutter) calc(40px + env(safe-area-inset-bottom));
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:stretch;
    }
    .wrap {
      width:100%; max-width:min(var(--layout-max),100%); margin-inline:auto; min-width:0;
      flex:1 0 auto; display:flex; flex-direction:column;
    }
    a { color:inherit; }
    .skip-link {
      position:absolute; left:16px; top:-100%; z-index:100; padding:10px 14px;
      border-radius:var(--radius); background:var(--card); color:var(--ink);
      font-weight:650; border:1px solid var(--line); box-shadow:var(--shadow);
      text-decoration:none;
    }
    .skip-link:focus { position:fixed; top:max(16px,env(safe-area-inset-top)); left:16px; outline:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ---- header ------------------------------------------------------
       A band, not a card: the wash and hairline run the full width of the
       window while the content stays on the same column as the page below.
       `margin-inline: calc(50% - 50vw)` reaches from .wrap out to both edges;
       .hero-inner puts the content back on the grid. html carries
       overflow-x:clip, so a scrollbar's worth of 100vw is clipped rather than
       becoming a sideways scroll. Mirrors the Command Center header. */
    header.hero {
      margin-inline:calc(50% - 50vw);
      margin-top:calc(-1 * max(20px,env(safe-area-inset-top)));
      margin-bottom:26px;
      padding-inline:var(--layout-gutter);
      background:var(--hero-bg);
      border-bottom:1px solid var(--line);
    }
    /* Padding and column match the Command Center's .hero-inner exactly, and
        both headers are governed by the same tallest child (the 44px icon
        button), so the band is the same height on every page. */
    .hero-inner {
      display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px;
      max-width:min(var(--layout-max),100%); margin-inline:auto; padding:18px 0 16px;
      min-width:0;
    }
    /* Back to the Command Center — plain text in the band, not a floating pill */
    .team-back {
      display:inline-flex; align-items:center; gap:6px; flex:none;
      text-decoration:none; font-size:13px; font-weight:650; color:var(--ink);
      padding:3px 2px; border-radius:6px;
      transition:color .15s;
    }
    .team-back:hover { color:var(--brand); }
    .team-back:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .tb-arrow { font-size:14px; line-height:1; }
    .hero-sep { flex:none; width:1px; height:20px; background:var(--line); }
    /* The person's mark — the same tinted circle the Command Center's avatar
       stack uses, so a face means the same thing on both pages. */
    .who-mono {
      flex:none; width:32px; height:32px; border-radius:50%;
      display:grid; place-items:center;
      font-family:var(--sans); font-weight:700; font-size:12.5px;
      color:var(--who,var(--brand));
      background:color-mix(in srgb,var(--who,var(--brand)) 16%,var(--card));
    }
    /* The person accents are literals, so unlike a token they do NOT lighten
       with the theme — accent-on-dark-tint lands near 3:1. Mixing the letter
       toward paper (and the ground a little further from it) restores it. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .who-mono {
        color:color-mix(in srgb,var(--who,var(--brand)) 45%,#fff);
        background:color-mix(in srgb,var(--who,var(--brand)) 26%,var(--card));
      }
    }
    :root[data-theme="dark"] .who-mono {
      color:color-mix(in srgb,var(--who,var(--brand)) 45%,#fff);
      background:color-mix(in srgb,var(--who,var(--brand)) 26%,var(--card));
    }
    h1 {
      font-family:var(--sans); font-weight:750; font-size:clamp(22px,2.8vw,28px);
      line-height:1.1; letter-spacing:-0.025em; color:var(--ink); margin:0;
    }
    /* Greeting and date on one line, joined by a middot */
    .head-meta {
      display:flex; align-items:baseline; gap:7px; min-width:0;
      margin-left:auto; flex:none;
    }
    .greeting { font-size:13px; font-weight:650; line-height:1.3; color:var(--ink); }
    .today { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .today::before { content:"·"; margin-right:7px; color:var(--faint); }
    .head-right { display:flex; align-items:center; gap:8px; flex:none; }
    .icon-btn {
      width:44px; height:44px; display:grid; place-items:center; background:var(--card);
      border:1px solid var(--line); border-radius:999px; color:var(--ink); cursor:pointer;
      box-shadow:var(--shadow); transition:transform .17s, border-color .17s;
    }
    .icon-btn:hover { transform:translateY(-1px); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .icon-btn svg { width:20px; height:20px; }

    /* ---- layout (matches Command Center #board grid) --------------- */
    main.cols { margin-top:0; min-width:0; max-width:100%; margin-bottom:40px; }
    @media (min-width:960px){
      .cols {
        display:grid;
        grid-template-columns:minmax(0,63fr) minmax(300px,37fr);
        gap:44px;
        align-items:start;
      }
      .col { display:flex; flex-direction:column; gap:34px; min-width:0; }
    }
    @media (max-width:959px){
      .cols { display:flex; flex-direction:column; gap:30px; }
      .col { display:flex; flex-direction:column; gap:30px; min-width:0; max-width:100%; }
    }

    /* A section is a label and a rule. Nothing here is boxed or shadowed --
       the header band is the page's only container. */
    .panel { min-width:0; }
    .panel-head { margin:0 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .panel-title {
      display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; color:var(--earth-deep); margin:0;
    }
    .panel-title::before { content:""; flex:none; width:4px; height:11px; border-radius:2px; background:var(--earth); }
    .panel-title a { color:inherit; text-decoration:none; transition:color .15s; }
    .panel-title a:hover, .panel-title a:focus-visible { color:var(--brand); outline:none; }

    /* ---- Monday tasks header + filter menus ------------------------- */
    .monday-head {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:12px 16px; flex-wrap:wrap;
      margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line);
    }
    .monday-head-main {
      display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; min-width:0;
    }
    .monday-mark { flex:none; display:block; }
    .monday-title { font-size:15px; font-weight:650; color:var(--ink); margin:0; line-height:1.3; }
    .monday-meta { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
    .monday-meta::before { content:"·"; margin:0 8px 0 2px; color:var(--line); }
    .monday-refresh {
      font:inherit; line-height:0; padding:2px; border:0; border-radius:6px;
      background:transparent; color:var(--faint); cursor:pointer;
      transition:color .15s, background .15s;
    }
    .monday-refresh:hover { color:var(--ink); background:var(--hover-tint); }
    .monday-refresh svg { width:13px; height:13px; display:block; }
    .monday-open {
      flex:none; font-size:13px; font-weight:650; color:var(--brand);
      text-decoration:none; line-height:1.3; padding-top:1px;
    }
    .monday-open:hover { text-decoration:underline; text-underline-offset:2px; }

    .monday-controls {
      display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap;
      margin:0 0 18px; padding:10px 12px;
      background:var(--paper-2);
      border:1px solid var(--line);
      border-radius:12px;
    }
    .monday-controls .menu-wrap { display:flex; align-items:center; position:relative; }
    .menu-wrap { position:relative; }
    .filter-trigger {
      font:inherit; font-size:13px; font-weight:650; color:var(--ink);
      background:var(--card); border:1px solid var(--line); border-radius:999px;
      padding:7px 12px 7px 11px; cursor:pointer;
      display:inline-flex; align-items:center; gap:7px;
      line-height:1.2; min-height:34px; box-shadow:var(--shadow);
      transition:color .15s, background .15s, border-color .15s;
    }
    .filter-trigger svg { width:14px; height:14px; color:var(--muted); flex:none; }
    .filter-trigger:hover {
      border-color:color-mix(in srgb,var(--brand) 40%,var(--line));
      color:var(--brand-deep);
    }
    .filter-trigger:hover svg { color:var(--brand-deep); }
    .filter-trigger:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent), var(--shadow);
    }
    .filter-trigger[aria-expanded="true"],
    .filter-trigger.is-filtered {
      border-color:color-mix(in srgb,var(--brand) 50%,var(--line));
      color:var(--brand-deep);
      background:var(--card);
    }
    .filter-trigger[aria-expanded="true"] svg,
    .filter-trigger.is-filtered svg { color:var(--brand); }
    .filter-summary {
      max-width:22ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      font-size:12.5px; font-weight:600; color:var(--muted);
    }
    .filter-summary:not([hidden])::before {
      content:"·"; margin-right:6px; color:var(--line);
    }
    .view-toggle {
      margin-left:auto;
      display:inline-flex; align-items:center; gap:0;
      padding:3px; background:var(--card);
      border:1px solid var(--line); border-radius:999px;
      box-shadow:var(--shadow);
    }
    .view-seg {
      font:inherit; font-size:12.5px; font-weight:650; color:var(--muted);
      background:transparent; border:0; border-radius:999px;
      padding:6px 12px; cursor:pointer; line-height:1.2; min-height:28px;
      transition:color .15s, background .15s;
    }
    .view-seg:hover { color:var(--ink); }
    .view-seg:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .view-seg[aria-pressed="true"] {
      background:var(--brand); color:var(--on-accent);
    }
    .menu-panel {
      position:absolute; top:calc(100% + 8px); left:0; z-index:25;
      min-width:210px; background:var(--card);
      border:1px solid var(--line); border-radius:10px;
      box-shadow:var(--shadow); padding:6px 0;
    }
    .menu-panel[hidden] { display:none; }
    .menu-section + .menu-section { margin-top:4px; padding-top:4px; border-top:1px solid var(--line-soft); }
    .menu-section-label {
      font-size:10px; font-weight:700; letter-spacing:.12em;
      text-transform:uppercase; color:var(--faint);
      padding:6px 14px 4px;
    }
    .menu-list { list-style:none; margin:0; padding:0; }
    .menu-item {
      display:flex; align-items:center; gap:8px; width:100%;
      font:inherit; font-size:14px; font-weight:500; color:var(--ink);
      background:transparent; border:0; padding:8px 14px;
      cursor:pointer; text-align:left; transition:background .13s;
    }
    .menu-item:hover { background:var(--hover-tint); }
    .menu-item.is-selected {
      background:color-mix(in srgb,var(--earth) 20%,var(--card));
      font-weight:650;
    }
    .menu-dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .task-content { min-height:80px; }

    /* ---- task buckets + table -------------------------------------- */
    .bucket { border:0; border-top:1px solid var(--line); border-radius:0; margin-bottom:2px; background:transparent; }
    .bucket > summary {
      list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
      padding:11px 4px; font-weight:650; font-size:14px;
    }
    .bucket > summary::-webkit-details-marker { display:none; }
    .bucket-chev { color:var(--faint); transition:transform .16s; }
    .bucket[open] .bucket-chev { transform:rotate(90deg); }
    .bucket-count { margin-left:auto; font-size:12.5px; color:var(--muted);
      font-variant-numeric:tabular-nums; }
    .bucket-dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .bucket.b-overdue .bucket-dot { background:var(--overdue); }
    .bucket.b-soon .bucket-dot { background:var(--warm); }
    .bucket.b-next .bucket-dot { background:var(--wait); }
    .bucket.b-later .bucket-dot { background:var(--idle); }
    .bucket.b-none .bucket-dot { background:var(--line); }

    .ttable { width:100%; border-collapse:collapse; background:transparent; }
    .ttable th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
      color:var(--muted); font-weight:650; padding:8px 4px; border-top:1px solid var(--line); }
    .trow { border-top:1px solid var(--line-soft); transition:background .13s; }
    .trow:hover { background:var(--hover-tint); }
    .trow td { padding:11px 4px; vertical-align:middle; font-size:14.5px; }
    .t-name a { text-decoration:none; font-weight:600; display:inline; overflow-wrap:anywhere; word-break:break-word; }
    .t-name a:hover { color:var(--brand); text-decoration:underline; text-underline-offset:2px; }
    .t-name .shared { font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:1px 6px; margin-left:8px; vertical-align:middle; }
    .t-board { font-size:12.5px; color:var(--muted); white-space:nowrap; }
    .t-area { min-width:120px; }
    .t-area .t-cat { display:block; font-size:13px; font-weight:600; color:var(--ink); line-height:1.3; }
    .t-area .t-board-sub { display:block; font-size:11.5px; color:var(--faint); }
    .t-due { white-space:nowrap; font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--muted); }
    .t-due.od { color:var(--overdue); font-weight:650; }
    .t-due.warn { color:var(--brand-deep); font-weight:600; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; white-space:nowrap; }
    .status-pill .sd { width:8px; height:8px; border-radius:50%; flex:none; }
    .st-work .sd { background:var(--working); } .st-work { color:var(--ink); }
    .st-wait .sd { background:var(--wait); }
    .st-idle .sd { background:var(--idle); }
    .st-done .sd { background:var(--ok); } .st-done { color:var(--ok); }
    @media (max-width:600px){
      .t-board-col, .t-board { display:none; }
      .trow td, .ttable th { padding:10px; }
    }

    @keyframes task-spin { to { transform: rotate(360deg); } }
    .monday-refresh.spinning svg { animation: task-spin 0.85s linear infinite; }
    @media (max-width:520px){
      .monday-head { align-items:flex-start; }
      .monday-open { width:100%; }
      .menu-panel { min-width:min(240px,calc(100vw - 48px)); }
      .monday-controls { padding:10px; }
      .view-toggle { margin-left:0; width:100%; }
      .view-seg { flex:1; text-align:center; padding:7px 8px; }
      .filter-summary { max-width:16ch; }
    }

    /* ---- week view (focused: just this week) ----------------------- */
    .wk-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    /* Date/range and nav share one baseline. */
    .wk-titles { display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 11px; min-width:0; }
    .wk-range { font-family:var(--sans); font-size:19px; font-weight:700; line-height:1.25; letter-spacing:-0.02em; }
    .wk-rel { font-size:12.5px; color:var(--muted); margin-top:0; }
    .wk-rel b { color:var(--earth-deep); font-weight:650; }

    /* ---- week strip -------------------------------------------------
       Read-only on purpose: it shows you where you are in the week, it is not
       a control. No links, no hit targets, and aria-hidden because the group
       headings below already carry the real dates. */
    .wk-strip {
      display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
      gap:2px; margin:0 0 20px;
    }
    .wk-cell { text-align:center; padding:2px 2px 4px; min-width:0; }
    .wk-cell-dow {
      font-size:10px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--muted);
    }
    .wk-cell-num {
      margin:6px auto 0; width:30px; height:30px; border-radius:50%;
      display:grid; place-items:center;
      font-size:14px; font-weight:650; color:var(--ink);
      font-variant-numeric:tabular-nums;
    }
    .wk-cell.is-past .wk-cell-dow, .wk-cell.is-past .wk-cell-num { color:var(--faint); }
    /* --on-accent, not #fff: --earth lightens in dark mode, so a hard white
       would invert from readable to invisible exactly there. */
    .wk-cell.is-today .wk-cell-num { background:var(--earth); color:var(--on-accent); }
    .wk-cell.is-today .wk-cell-dow { color:var(--earth-deep); }
    .wk-nav { margin-left:auto; display:flex; gap:6px; flex:none; }
    .wk-nav button {
      font:inherit; font-size:18px; line-height:1; width:32px; height:32px; cursor:pointer;
      background:transparent; border:1px solid var(--line); border-radius:9px;
      color:var(--muted); display:grid; place-items:center; transition:border-color .15s, color .15s, background .15s;
    }
    .wk-nav button:hover { color:var(--ink); background:var(--hover-tint); }
    .wk-nav button:hover { border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); transform:translateY(-1px); }
    .wk-nav button.wk-now { width:auto; padding:0 12px; font-size:13px; font-weight:650; }

    /* The week calendar frames the whole task panel, so it sits above the
       panel heading rather than inside the Week view's own content. */
    .week-cal { margin-bottom:32px; }
    .week-cal .wk-strip { margin-bottom:0; }

    .wk-group { margin-bottom:16px; }
    .wk-group:last-child { margin-bottom:0; }
    .wk-day-head {
      display:flex; align-items:center; gap:8px; padding:0 2px 7px; margin-bottom:8px;
      border-bottom:1px solid var(--line);
    }
    .wk-dow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--earth-deep); }
    .wk-date { font-size:12px; color:var(--faint); }
    .wk-day-n { margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
    .wk-group.is-today .wk-dow { color:var(--brand); }
    .wk-group.is-today .wk-day-head { border-bottom-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .wk-group.is-overdue .wk-dow { color:var(--overdue); }
    .wk-group.is-done .wk-dow { color:var(--ok); }
    .wk-group.is-done .wk-day-head { border-bottom-color:color-mix(in srgb,var(--ok) 35%,var(--line)); }
    .wk-group.is-ongoing .wk-dow { color:var(--working); }
    .wk-group.is-ongoing .wk-day-head { border-bottom-color:color-mix(in srgb,var(--working) 45%,var(--line)); }

    .wk-list { display:flex; flex-direction:column; gap:0; }
    /* Hairline rows, and the accent moves from a left bar to a leading dot */
    .wk-task {
      display:flex; align-items:flex-start; gap:11px; text-decoration:none; color:inherit;
      background:transparent; border:0;
      border-bottom:1px solid var(--line-soft);
      border-radius:7px; padding:11px 4px;
      transition:background .14s, border-color .14s;
    }
    .wk-task::before {
      content:""; flex:none; width:7px; height:7px; border-radius:50%;
      background:var(--accent,var(--line));
      margin-top:0.45em;
    }
    .wk-list > .wk-task:last-child { border-bottom:none; }
    .wk-task:hover {
      background:var(--hover-tint); border-bottom-color:transparent;
      box-shadow:inset 2px 0 0 var(--accent,var(--brand));
    }
    /* Name and meta stack; status stays pinned on the right */
    .wk-main { display:flex; flex-direction:column; align-items:flex-start; gap:3px; min-width:0; flex:1; }
    .wk-name { font-size:14.5px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
    .wk-task.is-done { opacity:.88; }
    .wk-task.is-done .wk-name { text-decoration:line-through; color:var(--muted); }
    .wk-meta { font-size:12px; color:var(--muted); line-height:1.35; }
    .wk-right { flex:none; text-align:right; padding-top:1px; }
    .wk-due { display:block; font-size:12px; color:var(--faint); margin-top:3px; font-variant-numeric:tabular-nums; }
    .wk-due.od { color:var(--overdue); font-weight:650; }

    /* Still a collapsed <details> — undated in-progress work stays folded away
        by default. Just unboxed to match the rest of the page. */
    .wk-ongoing { margin-top:18px; border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; }
    .wk-ongoing > summary {
      list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
      padding:11px 4px; font-weight:650; font-size:14px;
    }
    .wk-ongoing > summary::-webkit-details-marker { display:none; }
    .wk-ongoing[open] .bucket-chev { transform:rotate(90deg); }
    .wk-ongoing .wk-list { padding:0 0 8px; }

    .wk-empty { text-align:center; padding:26px 12px; border:0; background:transparent; }
    .wk-empty p { margin:0; color:var(--muted); font-size:14.5px; }
    .wk-empty .wk-jump {
      font:inherit; font-size:13.5px; font-weight:650; margin-top:12px; cursor:pointer;
      background:var(--card); border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));
      color:var(--brand); border-radius:999px; padding:7px 15px; transition:transform .14s, background .14s;
    }
    .wk-empty .wk-jump:hover { transform:translateY(-1px); background:color-mix(in srgb,var(--brand) 10%,var(--card)); }
    @media (max-width:560px){
      .wk-task { align-items:flex-start; flex-direction:column; gap:6px; }
      .wk-right { text-align:left; }
      .wk-due { display:inline; margin:0 0 0 10px; }
    }

    /* ---- kanban board (read-only visual) --------------------------- */
    .kanban { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    @media (max-width:720px){ .kanban { grid-template-columns:1fr; } }
    .kcol { background:transparent; border:0; border-top:1px solid var(--line); border-radius:0; padding:8px 0 0; min-width:0; }
    .kcol-head { display:flex; align-items:center; gap:8px; margin:2px 4px 10px; font-size:12px;
      font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
    .kcol-head .kd { width:9px; height:9px; border-radius:50%; flex:none; }
    .kcol-head .kn { margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .kcol.k-work .kd { background:var(--working); } .kcol.k-wait .kd { background:var(--wait); } .kcol.k-idle .kd { background:var(--idle); }
    .kcard { display:block; text-decoration:none; color:inherit; background:transparent;
      border:0; border-bottom:1px solid var(--line-soft); border-radius:7px;
      padding:10px 4px; margin-bottom:0; transition:background .13s, border-color .13s; }
    .kcard:last-child { border-bottom:none; }
    .kcard:hover { background:var(--hover-tint); border-bottom-color:transparent;
      box-shadow:inset 2px 0 0 var(--accent,var(--brand)); }
    .kcard-name { font-size:13.5px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
    .kcard-meta { display:flex; align-items:flex-start; gap:8px; margin-top:7px; font-size:12px; color:var(--muted); }
    .kcard-board { min-width:0; flex:1; line-height:1.35; }
    .kcard-due { margin-left:auto; flex:none; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .kcard-due.od { color:var(--overdue); font-weight:650; } .kcard-due.warn { color:var(--warm-deep); font-weight:600; }
    .kcol-empty { color:var(--faint); font-size:13px; text-align:center; padding:14px 6px; }

    /* ---- calendar view --------------------------------------------- */
    .cal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .cal-title { font-family:var(--sans); font-size:18px; font-weight:700; line-height:1.2; letter-spacing:-0.02em; }
    .cal-nav { display:flex; gap:6px; }
    .cal-nav button {
      font:inherit; font-size:18px; line-height:1; width:34px; height:34px; cursor:pointer;
      background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
      color:var(--ink); display:grid; place-items:center; transition:border-color .15s, transform .15s;
    }
    .cal-nav button:hover { border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); transform:translateY(-1px); }
    .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
    .cal-dow { font-size:10px; text-align:center; color:var(--faint); padding:4px 2px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; }
    .cal-day {
      min-height:76px; background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
      padding:4px 5px; min-width:0;
    }
    .cal-day.other { opacity:.42; }
    .cal-day.today { border-color:var(--brand); background:color-mix(in srgb,var(--brand) 8%,var(--paper-2)); }
    .cal-day.past .cal-num { color:var(--faint); }
    .cal-num { font-weight:650; font-size:11px; color:var(--muted); margin-bottom:3px; line-height:1; }
    .cal-day.today .cal-num { color:var(--brand); }
    .cal-task {
      display:block; text-decoration:none; color:var(--ink); font-size:10.5px; line-height:1.25;
      padding:2px 4px; margin-bottom:2px; border-radius:4px; background:var(--card);
      border-left:2px solid var(--accent,var(--line)); overflow-wrap:anywhere; word-break:break-word;
    }
    .cal-task:hover { background:var(--card); box-shadow:var(--shadow); }
    .cal-more { font-size:10px; color:var(--faint); padding:0 4px; line-height:1.3; }
    .cal-undated { margin-top:16px; border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; }
    .cal-undated > summary {
      list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
      padding:11px 4px; font-weight:650; font-size:14px;
    }
    .cal-undated > summary::-webkit-details-marker { display:none; }
    .cal-undated[open] .bucket-chev { transform:rotate(90deg); }
    .cal-undated-list { list-style:none; margin:0; padding:0 0 8px; display:flex; flex-direction:column; gap:0; }
    .cal-undated-list a {
      display:flex; align-items:center; gap:9px; text-decoration:none; color:inherit;
      padding:9px 4px; border-radius:7px; background:transparent;
      border:0; border-bottom:1px solid var(--line-soft); font-size:13.5px;
      transition:background .14s, border-color .14s;
    }
    .cal-undated-list > li:last-child a { border-bottom:none; }
    .cal-undated-list a:hover { background:var(--hover-tint); border-bottom-color:transparent; }
    .cal-undated-list .ud-dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--accent); }
    .cal-undated-list .ud-name { flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere; }
    .cal-undated-list .ud-board { font-size:12px; color:var(--muted); white-space:nowrap; }
    @media (max-width:720px){ .cal-day { min-height:58px; } .cal-task { font-size:10px; } }

    /* ---- shared empty state (pins, list, tasks) --------------------- */
    .list-empty { color:var(--faint); font-size:14px; text-align:center; padding:16px 8px; }

    /* ---- jump links ------------------------------------------------ */
    .links { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
    .links a {
      --link-accent:var(--earth);
      display:flex; align-items:center; gap:11px; text-decoration:none; padding:10px 4px;
      border-radius:7px; border:0; border-bottom:1px solid var(--line-soft);
      background:transparent;
      transition:background .15s, border-color .15s;
    }
    .links > li:last-child a { border-bottom:none; }
    .links a:hover {
      background:var(--hover-tint); border-bottom-color:transparent;
      box-shadow:inset 2px 0 0 var(--link-accent);
    }
    .link-icon {
      width:24px; height:24px; border-radius:50%; flex:none;
      display:grid; place-items:center;
      background:color-mix(in srgb,var(--link-accent) 16%,var(--card));
      color:var(--link-accent);
      border:1px solid color-mix(in srgb,var(--link-accent) 22%,var(--line));
    }
    .link-icon svg { width:13px; height:13px; display:block; }
    .links .lname { font-size:14.5px; font-weight:600; flex:1; min-width:0; line-height:1.35; }
    .links .larr {
      flex:none; width:20px; height:20px; border-radius:999px;
      display:grid; place-items:center; font-size:13px; line-height:1;
      color:var(--muted); background:transparent;
      opacity:.7; transition:opacity .15s, transform .15s, color .15s;
    }
    .links a:hover .larr { color:var(--link-accent); }
    .links a:hover .larr { opacity:1; transform:translate(1px,-1px); }

    /* ---- sidebar (pins + list — right column) ----------------------- */
    .sidebar .panel-head { margin-bottom:10px; }
    .sidebar .head-link {
      font:inherit; font-size:13px; font-weight:650; color:var(--brand);
      background:none; border:0; padding:0; cursor:pointer; text-decoration:none;
    }
    .sidebar .head-link:hover { text-decoration:underline; text-underline-offset:2px; }
    .sidebar .head-link[aria-pressed="true"] { color:var(--brand-deep); }
    .sidebar .links a {
      padding:11px 4px; gap:10px;
    }
    .sidebar .links a:hover {
      background:var(--hover-tint); border-bottom-color:var(--line-soft);
      box-shadow:none;
    }
    .sidebar .link-icon {
      width:20px; height:20px;
      background:var(--link-accent);
      color:var(--on-accent);
      border:none;
    }
    .sidebar .link-icon svg { width:11px; height:11px; }
    .sidebar .links .lname { font-size:14px; font-weight:600; }
    .sidebar .links .larr {
      width:auto; height:auto; font-size:13px; opacity:.5;
      transform:none;
    }
    .sidebar .links a:hover .larr { opacity:.85; transform:none; }
    .sidebar .list-empty { text-align:left; padding:8px 4px 12px; }
    .sidebar .pin-manage {
      display:flex; align-items:center; gap:10px;
      padding:11px 4px; border-bottom:1px solid var(--line-soft);
    }
    .sidebar .pin-manage:last-child { border-bottom:none; }
    .sidebar .pin-manage .pin-label { flex:1; min-width:0; font-size:14px; font-weight:600;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ---- my pins ---------------------------------------------------- */
    .pin-row { display:flex; align-items:center; gap:8px; }
    .pin-row .links { flex:1; min-width:0; }
    .pin-actions { display:flex; gap:6px; flex:none; }
    .mini-btn {
      font:inherit; font-size:12px; font-weight:650; cursor:pointer; color:var(--muted);
      background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
      padding:5px 9px; line-height:1.2; transition:border-color .15s, color .15s;
    }
    .mini-btn:hover { color:var(--ink); border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); }
    .mini-btn[aria-pressed="true"] { color:var(--brand-deep); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .mini-btn.icon-only {
      display:inline-flex; align-items:center; justify-content:center;
      line-height:0; min-width:28px; min-height:28px; padding:5px 7px;
    }
    .mini-btn.icon-only svg { width:14px; height:14px; display:block; flex-shrink:0; }
    .head-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }

    /* ---- pin editor -------------------------------------------------- */
    .pin-form { border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; padding:14px 0 4px; margin-top:8px; }
    .pin-form label { display:block; font-size:11px; font-weight:650; letter-spacing:.06em;
      text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
    .pin-form input[type="text"], .pin-form input[type="url"] {
      font:inherit; font-size:14px; width:100%; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:10px;
    }
    .pin-form input:focus { outline:none; border-color:var(--brand); }
    .swatches, .icon-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .swatch {
      width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
      border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .swatch[aria-pressed="true"] { border-color:var(--ink); }
    .icon-pick {
      width:32px; height:32px; border-radius:8px; cursor:pointer; display:grid; place-items:center;
      background:var(--card); border:1px solid var(--line); color:var(--muted); padding:0;
    }
    .icon-pick svg { width:16px; height:16px; }
    .icon-pick[aria-pressed="true"] { color:var(--brand); border-color:var(--brand); background:color-mix(in srgb,var(--brand) 10%,var(--card)); }
    .form-actions { display:flex; gap:8px; align-items:center; }
    .btn-sm { font:inherit; font-size:13px; font-weight:650; cursor:pointer; border-radius:8px; padding:7px 13px; }
    .btn-primary { background:var(--brand); border:1px solid var(--brand); color:var(--on-accent); }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
    .btn-danger { background:transparent; border:1px solid var(--line); color:var(--danger); margin-left:auto; }

    /* ---- my list ----------------------------------------------------- */
    .sidebar .todo-add { margin-bottom:10px; }
    .sidebar .todo-add[hidden] { display:none; }
    .sidebar .todo-add input { padding:9px 11px; font-size:14px; }
    .sidebar .todo-add .btn-primary {
      flex:none; background:var(--ink); border-color:var(--ink);
      padding:10px 14px; border-radius:8px;
    }
    .sidebar .todo-add .btn-primary:hover { background:color-mix(in srgb,var(--ink) 88%,var(--brand)); border-color:color-mix(in srgb,var(--ink) 88%,var(--brand)); }
    .sidebar .todo { padding:11px 4px; align-items:center; }
    .sidebar .todo-check { width:16px; height:16px; border-radius:3px; margin-top:0; }
    .sidebar .todo.done .todo-check { background:var(--ok); border-color:var(--ok); }
    .sidebar .todo-text { font-size:14px; line-height:1.4; }
    .todo-add { display:flex; gap:8px; margin-bottom:12px; }
    .todo-add input {
      font:inherit; font-size:14px; flex:1; min-width:0; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
    }
    .todo-add input:focus { outline:none; border-color:var(--brand); background:var(--card); }
    .todos { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
    .todo {
      display:flex; align-items:flex-start; gap:10px; padding:10px 4px;
      border:0; border-bottom:1px solid var(--line-soft); border-radius:7px;
      background:transparent;
      transition:background .15s, border-color .15s, opacity .15s;
    }
    .todos > .todo:last-child { border-bottom:none; }
    .todo:hover { background:var(--hover-tint); border-bottom-color:transparent; }
    .todo-check {
      flex:none; width:18px; height:18px; margin-top:1px; border-radius:5px; cursor:pointer; padding:0;
      border:1.5px solid var(--idle); background:transparent; display:grid; place-items:center; color:var(--on-accent);
    }
    .todo-check svg { width:12px; height:12px; opacity:0; }
    .todo.done .todo-check { background:var(--ok); border-color:var(--ok); }
    .todo.done .todo-check svg { opacity:1; }
    .todo-text {
      flex:1; min-width:0; font-size:14px; line-height:1.45; cursor:text;
      word-break:break-word; white-space:pre-wrap;
    }
    .todo.done { opacity:.55; }
    .todo.done .todo-text { text-decoration:line-through; }
    .todo-edit {
      font:inherit; font-size:14px; flex:1; min-width:0; color:var(--ink);
      background:var(--card); border:1px solid var(--brand); border-radius:6px; padding:3px 6px;
    }
    .todo-edit:focus { outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent); }
    .todo-actions {
      flex:none; display:flex; align-items:center; gap:6px;
      opacity:0; transition:opacity .15s;
    }
    .todo:hover .todo-actions, .todo-actions:focus-within { opacity:1; }
    .todo-actions .mini-btn { padding:3px 6px; font-size:12px; line-height:1; }
    .todo-del {
      flex:none; background:none; border:0; cursor:pointer; color:var(--faint);
      font-size:15px; line-height:1; padding:2px 4px; border-radius:6px; transition:color .15s;
    }
    .todo-del:hover { color:var(--danger); }
    .todo-foot { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12.5px; color:var(--faint); }
    .todo-foot[hidden] { display:none; }  /* display:flex would otherwise beat [hidden] */
    .link-btn { font:inherit; font-size:12.5px; background:none; border:0; padding:0; cursor:pointer;
      color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
    .link-btn:hover { color:var(--brand); }

    /* ---- sync status -------------------------------------------------- */
    .sync-note { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--faint); }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--idle); flex:none; }
    .sync-note[data-state="saving"] .sync-dot { background:var(--wait); }
    .sync-note[data-state="saved"]  .sync-dot { background:var(--ok); }
    .sync-note[data-state="local"]  .sync-dot { background:var(--idle); }
    .sync-note[data-state="error"]  .sync-dot { background:var(--danger); }

    /* margin-top:auto drops the footer to the bottom of the viewport on a
       short page, so it sits where a long page's footer sits. main carries the
       minimum gap for when the page IS long. */
    footer {
      display:flex; align-items:baseline; justify-content:space-between;
      flex-wrap:wrap; gap:6px 18px;
      margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
      color:var(--muted); font-size:12.5px; text-align:left;
    }
    footer a { color:var(--ink); font-weight:650; text-decoration:underline; text-underline-offset:2px; }
    footer a:hover { color:var(--brand); }

    @media (max-width:640px){
      body { padding:max(12px,env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)); }
      header.hero {
        margin-top:calc(-1 * max(12px,env(safe-area-inset-top)));
        margin-bottom:18px;
        padding-inline:12px;
      }
      .hero-inner { padding:14px 0 12px; gap:12px; }
      .head-meta { margin-left:0; }
      .hero-sep { display:none; }
      .todo, .wk-task, .kcard, .links a, .cal-undated-list a { min-height:48px; }
    }
    /* ---- focus states ------------------------------------------------ */
    /* One ring for every control, matching the Command Center. Each item's
       own --accent tints it, so the ring belongs to the thing you focused. */
    .filter-trigger:focus-visible, .view-seg:focus-visible, .menu-item:focus-visible, .monday-refresh:focus-visible, .monday-open:focus-visible,
    .mini-btn:focus-visible, .btn-sm:focus-visible,
    .head-link:focus-visible, .link-btn:focus-visible, .todo-check:focus-visible, .todo-del:focus-visible,
    .swatch:focus-visible, .icon-pick:focus-visible, .icon-btn:focus-visible,
    .wk-nav button:focus-visible, .cal-nav button:focus-visible,
    .wk-empty .wk-jump:focus-visible, .wk-task:focus-visible,
    .kcard:focus-visible, .cal-task:focus-visible, .t-name a:focus-visible,
    .cal-undated-list a:focus-visible, .bucket > summary:focus-visible,
    .wk-ongoing > summary:focus-visible, .cal-undated > summary:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,var(--brand)) 35%,transparent);
    }
    /* Pins carry their colour on --link-accent rather than --accent. */
    .links a:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--link-accent) 40%,transparent);
    }
    .todo-text:focus-visible {
      outline:none; border-radius:6px;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }

    /* ---- touch ------------------------------------------------------- */
    /* The row actions are revealed by hover on pointer devices. Touch has no
       hover, so without this they stay invisible while still being tappable —
       an invisible delete button sitting under your thumb. */
    @media (hover: none) {
      .todo-actions { opacity:1; }
      .wk-task:hover, .kcard:hover, .links a:hover, .icon-btn:hover,
      .wk-nav button:hover, .cal-nav button:hover { transform:none; }
    }
    /* Small controls keep their drawn size and gain a 24px hit area. */
    .todo-check, .todo-del, .todo-actions .mini-btn, .pin-actions .mini-btn { position:relative; }
    .todo-check::after, .todo-del::after,
    .todo-actions .mini-btn::after, .pin-actions .mini-btn::after {
      content:""; position:absolute; inset:-3px;
    }
    .mini-btn:disabled { opacity:.45; cursor:default; }
    .mini-btn:disabled:hover { color:var(--muted); border-color:var(--line); }

    @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
  </style>
  <script>
    try { var t = localStorage.getItem("tu-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
  </script>

        </div>
      </div>
    </header>

    <main class="cols" id="focus-main">

      <div class="col">

    };

    /* ---- date helpers ---------------------------------------------- */
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const MS_DAY = 86400000;
    function parseDue(iso){ if(!iso) return null; const [y,m,d]=iso.split("-").map(Number); return new Date(y, m-1, d); }
    function daysOut(iso){ const dt=parseDue(iso); return dt ? Math.round((dt - today)/MS_DAY) : null; }
    function fmtDue(iso){
      if(!iso) return "—";
      const dt = parseDue(iso);
      const s = dt.toLocaleDateString(undefined, { month:"short", day:"numeric" });
      const n = daysOut(iso);
      if (n < 0) return s + " · overdue";
      if (n === 0) return s + " · today";
      if (n <= 30) return s + " · " + n + "d";
      return s;
    }
    function toIso(d){
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }
    const STATUS_COLOR = { work:"var(--working)", wait:"var(--wait)", idle:"var(--idle)", done:"var(--ok)" };
    const TODAY_ISO = toIso(today);
    function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
    // Weeks run Monday → Sunday.
    /* Sunday-start, matching the week strip's Sun..Sat columns. */
    function startOfWeek(d){ return addDays(d, -d.getDay()); }
    const THIS_WEEK = startOfWeek(today);
    function weekIndexOf(iso){
      return Math.round((startOfWeek(parseDue(iso)) - THIS_WEEK) / (7 * MS_DAY));
    }

    /* ---- buckets by time horizon ----------------------------------- */
    const BUCKETS = [
      { key:"overdue", cls:"b-overdue", label:"Overdue",   open:true,  test:n => n!==null && n<0 },

      { key:"later",   cls:"b-later",   label:"Later",     open:false, test:n => n!==null && n>90 },
      { key:"none",    cls:"b-none",    label:"No due date",open:false, test:n => n===null },
    ];

    const VIEWS = ["week", "list", "board", "calendar"];
    let activeStatus = "all";
    let activeArea = "all";

    let lastSyncedAt = null;
    let calMonth = today.getMonth();

    const weekEl = document.getElementById("week");

    const kanbanEl = document.getElementById("kanban");
    const calendarEl = document.getElementById("calendar");

      work: "Working on it",
      wait: "Waiting",

    function visibleTasks(){
      return TASKS.filter(t => {
        if (t.s === "done") return false;
        if (activeStatus !== "all" && t.s !== activeStatus) return false;
        if (activeArea !== "all" && t.b !== activeArea) return false;
        return true;
      });
    }

    function areaFilteredTasks(){
      return TASKS.filter(t => activeArea === "all" || t.b === activeArea);
    }

    function countByStatus(status){
      return TASKS.filter(t => {
        if (status !== "all" && t.s !== status) return false;
        if (activeArea !== "all" && t.b !== activeArea) return false;
        return true;
      }).length;
    }

    function countByArea(area){
      return TASKS.filter(t => {
        if (activeStatus !== "all" && t.s !== activeStatus) return false;
        if (area !== "all" && t.b !== area) return false;
        return true;
      }).length;
    }

    function refreshTasks(){
      renderFilters();
      updateToolbar();
      renderView();
    }

      trigger.setAttribute("aria-expanded", open ? "true" : "false");
    }

      e.stopPropagation();
      toggleMenu(filterMenuWrap, filterTrigger, filterPanel);
    });

      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "menu-item" + (selected ? " is-selected" : "");
      if (dotColor) {
        const dot = document.createElement("span");
        dot.className = "menu-dot";

        dot.setAttribute("aria-hidden", "true");

        refreshTasks();

      li.appendChild(btn);

    function renderView(){

    function renderFilters(){
      const statusDefs = [

      if (activeStatus !== "all") parts.push(STATUS_FILTER_LABELS[activeStatus] || activeStatus);

      filterTrigger.classList.toggle("is-filtered", filtered);

        filterSummary.hidden = !filtered;

    // Sort by soonest due date; undated tasks fall to the end.
    // Ties break on status then name, so what's in progress leads its day and
    // the order never depends on how the generated TASKS array happens to sit.
    const S_RANK = { work:0, wait:1, idle:2 };
    function byDue(a, b){
      const da = daysOut(a.due), db = daysOut(b.due);
      if (da !== null && db !== null && da !== db) return da - db;
      if (da === null && db !== null) return 1;
      if (db === null && da !== null) return -1;
      return S_RANK[a.s] - S_RANK[b.s] || a.n.localeCompare(b.n);
    }

    function renderBuckets(){
      const rows = visibleTasks().slice().sort(byDue);
      bucketsEl.innerHTML = "";
      let shown = 0;
      for (const bk of BUCKETS){

        d.className = "bucket " + bk.cls;
        if (bk.open) d.open = true;
        const sum = document.createElement("summary");
        sum.innerHTML =
          '<span class="bucket-dot" aria-hidden="true"></span>' +
          '<span class="bucket-chev" aria-hidden="true">›</span>' +
          '<span>' + bk.label + (bk.note ? ' <span style="color:var(--faint);font-weight:400;font-size:12.5px;">· '+bk.note+'</span>' : '') + '</span>' +
          '<span class="bucket-count">' + items.length + '</span>';
        d.appendChild(sum);

        const table = document.createElement("table");
        table.className = "ttable";
        table.innerHTML = '<thead><tr><th>Task</th><th>Status</th><th class="t-board-col">Area</th><th>Due</th></tr></thead>';
        const tb = document.createElement("tbody");
        for (const t of items){
          const tr = document.createElement("tr");
          tr.className = "trow";
          const n = daysOut(t.due);
          const dueCls = n!==null && n<0 ? "od" : (n!==null && n<=14 ? "warn" : "");
          const st = STATUS[t.s];
          const name = document.createElement("td");
          name.className = "t-name";
          const a = document.createElement("a");
          a.href = pulse(t.b, t.id); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = t.n;
          name.appendChild(a);
          if (t.shared){ const sh=document.createElement("span"); sh.className="shared"; sh.textContent="shared"; name.appendChild(sh); }
          tr.appendChild(name);
          const stTd = document.createElement("td");
          stTd.innerHTML = '<span class="status-pill '+st.cls+'"><span class="sd" aria-hidden="true"></span>'+st.label+'</span>';
          tr.appendChild(stTd);
          const bd = document.createElement("td");
          bd.className = "t-area t-board-col";
          bd.innerHTML = '<span class="t-cat"></span><span class="t-board-sub"></span>';
          bd.querySelector(".t-cat").textContent = t.cat;
          bd.querySelector(".t-board-sub").textContent = BOARDS[t.b].label;
          tr.appendChild(bd);
          const due = document.createElement("td");
          due.className = "t-due " + dueCls;
          due.textContent = fmtDue(t.due);
          tr.appendChild(due);
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        d.appendChild(table);
        bucketsEl.appendChild(d);
      }
      if (!shown){
        bucketsEl.innerHTML = '<p class="list-empty">Nothing in this filter. 🎉</p>';
      }
    }

    /* ---- week view (focused: just what's due this week) ------------ */
    function relWeekLabel(n){
      if (n === 0) return "This week";
      if (n === 1) return "Next week";
      if (n === -1) return "Last week";
      return n > 0 ? "In " + n + " weeks" : Math.abs(n) + " weeks ago";
    }
    function fmtDayLabel(d){
      const iso = toIso(d);
      if (iso === TODAY_ISO) return "Today";
      if (iso === toIso(addDays(today, 1))) return "Tomorrow";
      return d.toLocaleDateString(undefined, { weekday:"long" });
    }
    function weekTaskRow(t, opts){
      const st = STATUS[t.s];
      const n = daysOut(t.due);
      const a = document.createElement("a");
      a.className = "wk-task" + (t.s === "done" ? " is-done" : "");
      a.href = pulse(t.b, t.id); a.target = "_blank"; a.rel = "noopener noreferrer";
      a.style.setProperty("--accent", STATUS_COLOR[t.s]);
      a.innerHTML =
        '<span class="wk-main"><span class="wk-name"></span><span class="wk-meta"></span></span>' +
        '<span class="wk-right"><span class="status-pill ' + st.cls + '">' +
        '<span class="sd" aria-hidden="true"></span>' + st.label + '</span>' +
        (opts && opts.showDue ? '<span class="wk-due' + (n !== null && n < 0 ? ' od' : '') + '"></span>' : '') +
        '</span>';
      a.querySelector(".wk-name").textContent = t.n;
      a.querySelector(".wk-meta").textContent =
        t.cat + " · " + BOARDS[t.b].label + (t.shared ? " · shared" : "");
      if (opts && opts.showDue) a.querySelector(".wk-due").textContent = fmtDue(t.due);
      return a;
    }
    function weekGroup(cls, label, sub, items, opts){
      const g = document.createElement("section");
      g.className = "wk-group " + cls;
      const head = document.createElement("div");
      head.className = "wk-day-head";
      head.innerHTML = '<span class="wk-dow"></span><span class="wk-date"></span>' +
        '<span class="wk-day-n">' + items.length + '</span>';
      head.querySelector(".wk-dow").textContent = label;
      head.querySelector(".wk-date").textContent = sub || "";
      g.appendChild(head);
      const list = document.createElement("div");
      list.className = "wk-list";
      items.forEach(t => list.appendChild(weekTaskRow(t, opts)));
      g.appendChild(list);
      return g;
    }

    function weekFrame(){
      const start = addDays(THIS_WEEK, weekOffset * 7);
      const end = addDays(start, 6);
      const startIso = toIso(start), endIso = toIso(end);
      const isCurrent = weekOffset === 0;
      const tasks = visibleTasks();
      const cutoff = isCurrent ? TODAY_ISO : startIso;
      const overdue = isCurrent ? tasks.filter(t => t.due && t.due < TODAY_ISO).sort(byDue) : [];
      const inWeek = tasks.filter(t => t.due && t.due >= cutoff && t.due <= endIso);
      const ongoing = isCurrent ? tasks.filter(t => !t.due && t.s === "work").sort((a,b) => a.n.localeCompare(b.n)) : [];
      const doneInWeek = activeStatus === "all"
        ? areaFilteredTasks().filter(t => t.s === "done" && t.due && t.due >= startIso && t.due <= endIso).sort(byDue)
        : [];
      return { start, end, startIso, endIso, isCurrent, tasks, overdue, inWeek, ongoing, doneInWeek };
    }

    function syncWeekNav(){
      renderWeekCal();
      if (view === "week") renderWeek();
    }

    function renderWeekCal(){
      weekCalEl.innerHTML = "";
      const { start, end, isCurrent } = weekFrame();
      const head = document.createElement("div");
      head.className = "wk-head";
      const titles = document.createElement("div");
      titles.className = "wk-titles";
      const sameMonth = start.getMonth() === end.getMonth();
      const range = start.toLocaleDateString(undefined, { month:"short", day:"numeric" }) + " – " +
        end.toLocaleDateString(undefined, sameMonth ? { day:"numeric" } : { month:"short", day:"numeric" });
      titles.innerHTML = '<div class="wk-range"></div><div class="wk-rel"></div>';
      titles.querySelector(".wk-range").textContent = isCurrent
        ? today.toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long" })
        : range;
      titles.querySelector(".wk-rel").textContent = "";
      const nav = document.createElement("div");
      nav.className = "wk-nav";
      if (!isCurrent){
        const nowBtn = document.createElement("button");
        nowBtn.type = "button"; nowBtn.className = "wk-now"; nowBtn.textContent = "This week";
        nowBtn.addEventListener("click", () => { weekOffset = 0; syncWeekNav(); });
        nav.appendChild(nowBtn);
      }
      const prev = document.createElement("button");
      prev.type = "button"; prev.setAttribute("aria-label", "Previous week"); prev.textContent = "‹";
      prev.addEventListener("click", () => { weekOffset--; syncWeekNav(); });
      const next = document.createElement("button");
      next.type = "button"; next.setAttribute("aria-label", "Next week"); next.textContent = "›";
      next.addEventListener("click", () => { weekOffset++; syncWeekNav(); });
      nav.append(prev, next);
      head.append(titles, nav);
      weekCalEl.appendChild(head);

      const strip = document.createElement("div");
      strip.className = "wk-strip";
      strip.setAttribute("aria-hidden", "true");
      for (let i = 0; i < 7; i++){
        const d = addDays(start, i);
        const iso = toIso(d);
        const cell = document.createElement("div");
        cell.className = "wk-cell" +
          (iso === TODAY_ISO ? " is-today" : "") +
          (iso < TODAY_ISO ? " is-past" : "");
        cell.innerHTML = '<div class="wk-cell-dow"></div><div class="wk-cell-num"></div>';
        cell.querySelector(".wk-cell-dow").textContent =
          d.toLocaleDateString(undefined, { weekday:"short" });
        cell.querySelector(".wk-cell-num").textContent = d.getDate();
        strip.appendChild(cell);
      }
      weekCalEl.appendChild(strip);
    }

    function renderWeek(){
      weekEl.innerHTML = "";
      const { start, end, endIso, isCurrent, tasks, overdue, inWeek, ongoing, doneInWeek } = weekFrame();
      const count = overdue.length + inWeek.length;
      const hasDue = count > 0;

      /* overdue carry-over */
      if (overdue.length){
        weekEl.appendChild(weekGroup("is-overdue", "Overdue", "still open", overdue, { showDue:true }));
      }

      /* one group per day that has something */
      const byDate = {};
      inWeek.forEach(t => { (byDate[t.due] = byDate[t.due] || []).push(t); });
      for (let i = 0; i < 7; i++){
        const d = addDays(start, i);
        const iso = toIso(d);
        const items = (byDate[iso] || []).sort((a,b) => a.n.localeCompare(b.n));
        if (!items.length) continue;
        weekEl.appendChild(weekGroup(
          iso === TODAY_ISO ? "is-today" : "",
          fmtDayLabel(d),
          d.toLocaleDateString(undefined, { month:"short", day:"numeric" }),
          items
        ));
      }

      /* empty state — skip the hero box when in-progress tasks are listed below */
      if (!hasDue && !(ongoing.length && isCurrent)){
        const empty = document.createElement("div");
        empty.className = "wk-empty";
        const p = document.createElement("p");
        p.textContent = weekOffset < 0 ? "Nothing was due this week." : "Nothing due this week. 🎉";
        empty.appendChild(p);
        const upcoming = tasks.filter(t => t.due && t.due > endIso).sort(byDue)[0];
        if (upcoming){
          const jump = document.createElement("button");
          jump.type = "button"; jump.className = "wk-jump";
          const target = weekIndexOf(upcoming.due);
          jump.textContent = "Next up: " + parseDue(upcoming.due)
            .toLocaleDateString(undefined, { month:"short", day:"numeric" }) + " →";
          jump.addEventListener("click", () => { weekOffset = target; syncWeekNav(); });
          empty.appendChild(jump);
        }
        weekEl.appendChild(empty);
      }

      if (doneInWeek.length){
        weekEl.appendChild(weekGroup("is-done", "Done this week", "checked off ✓", doneInWeek, { showDue:true }));
      }

      /* in-progress with no date — collapsed by default */
      if (ongoing.length && isCurrent){
        const det = document.createElement("details");
        det.className = "wk-ongoing";
        det.open = false;
        const sum = document.createElement("summary");
        sum.innerHTML = '<span class="bucket-chev" aria-hidden="true">›</span>' +
          '<span>In progress · no due date</span>' +
          '<span class="bucket-count">' + ongoing.length + '</span>';
        det.appendChild(sum);
        const list = document.createElement("div");
        list.className = "wk-list";
        ongoing.forEach(t => list.appendChild(weekTaskRow(t)));
        det.appendChild(list);
        weekEl.appendChild(det);
      }
    }

    /* ---- kanban board (grouped by status, read-only) --------------- */
    const COLS = [
      { k:"idle", label:"Not started",   cls:"k-idle", color:"var(--idle)" },
      { k:"wait", label:"Waiting",       cls:"k-wait", color:"var(--wait)" },
      { k:"work", label:"Working on it", cls:"k-work", color:"var(--working)" },
    ];
    function renderKanban(){
      kanbanEl.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "kanban";
      for (const col of COLS){
        const items = visibleTasks().filter(t => t.s===col.k).sort(byDue);
        const c = document.createElement("div");
        c.className = "kcol " + col.cls;
        const head = document.createElement("div");
        head.className = "kcol-head";
        head.innerHTML = '<span class="kd" aria-hidden="true"></span><span>' + col.label +
          '</span><span class="kn">' + items.length + '</span>';
        c.appendChild(head);
        if (!items.length){
          const e = document.createElement("p"); e.className = "kcol-empty"; e.textContent = "Nothing here";
          c.appendChild(e);
        }
        for (const t of items){
          const n = daysOut(t.due);
          const dueCls = n!==null && n<0 ? "od" : (n!==null && n<=14 ? "warn" : "");
          const a = document.createElement("a");
          a.className = "kcard";
          a.href = pulse(t.b, t.id); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.style.setProperty("--accent", col.color);
          a.innerHTML = '<div class="kcard-name"></div>' +
            '<div class="kcard-meta"><span class="kcard-board"></span>' +
            '<span class="kcard-due ' + dueCls + '"></span></div>';
          a.querySelector(".kcard-name").textContent = t.n;
          a.querySelector(".kcard-board").textContent = t.cat + " · " + BOARDS[t.b].label + (t.shared ? " · shared" : "");
          a.querySelector(".kcard-due").textContent = fmtDue(t.due);
          c.appendChild(a);
        }
        grid.appendChild(c);
      }
      kanbanEl.appendChild(grid);
    }

    /* ---- calendar (grouped by due date) ---------------------------- */
    const CAL_DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const CAL_MAX = 3;

    function renderCalendar(){
      calendarEl.innerHTML = "";
      const tasks = visibleTasks();
      if (!tasks.length){
        calendarEl.innerHTML = '<p class="list-empty">Nothing in this filter. 🎉</p>';
        return;
      }

      const wrap = document.createElement("div");

      const head = document.createElement("div");
      head.className = "cal-head";
      const title = document.createElement("div");
      title.className = "cal-title";
      title.textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
      const nav = document.createElement("div");
      nav.className = "cal-nav";
      const prev = document.createElement("button");
      prev.type = "button"; prev.setAttribute("aria-label", "Previous month"); prev.textContent = "‹";
      prev.addEventListener("click", () => {
        calMonth--;
        if (calMonth < 0){ calMonth = 11; calYear--; }
        renderCalendar();
      });
      const next = document.createElement("button");
      next.type = "button"; next.setAttribute("aria-label", "Next month"); next.textContent = "›";
      next.addEventListener("click", () => {
        calMonth++;
        if (calMonth > 11){ calMonth = 0; calYear++; }
        renderCalendar();
      });
      nav.append(prev, next);
      head.append(title, nav);
      wrap.appendChild(head);

      const byDate = {};
      tasks.forEach(t => {
        if (!t.due) return;
        if (!byDate[t.due]) byDate[t.due] = [];
        byDate[t.due].push(t);
      });
      Object.keys(byDate).forEach(k => byDate[k].sort((a,b) => a.n.localeCompare(b.n)));

      const grid = document.createElement("div");
      grid.className = "cal-grid";
      CAL_DOW.forEach(d => {
        const el = document.createElement("div");
        el.className = "cal-dow"; el.textContent = d;
        grid.appendChild(el);
      });

      const first = new Date(calYear, calMonth, 1);
      const start = new Date(calYear, calMonth, 1 - first.getDay());
      for (let i = 0; i < 42; i++){
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const iso = toIso(d);
        const inMonth = d.getMonth() === calMonth;
        const isToday = d.getTime() === today.getTime();
        const isPast = d < today;
        const cell = document.createElement("div");
        cell.className = "cal-day" + (inMonth ? "" : " other") + (isToday ? " today" : "") + (isPast && inMonth ? " past" : "");

        const num = document.createElement("div");
        num.className = "cal-num";
        num.textContent = d.getDate();
        cell.appendChild(num);

        const dayTasks = byDate[iso] || [];
        dayTasks.slice(0, CAL_MAX).forEach(t => {
          const a = document.createElement("a");
          a.className = "cal-task";
          a.href = pulse(t.b, t.id);
          a.target = "_blank"; a.rel = "noopener noreferrer";
          a.style.setProperty("--accent", STATUS_COLOR[t.s]);
          a.title = t.n;
          a.textContent = t.n;
          cell.appendChild(a);
        });
        if (dayTasks.length > CAL_MAX){
          const more = document.createElement("div");
          more.className = "cal-more";
          more.textContent = "+" + (dayTasks.length - CAL_MAX) + " more";
          cell.appendChild(more);
        }
        grid.appendChild(cell);
      }
      wrap.appendChild(grid);

      const undated = tasks.filter(t => !t.due).sort((a,b) => a.n.localeCompare(b.n));
      if (undated.length){
        const det = document.createElement("details");
        det.className = "cal-undated";
        det.open = undated.length <= 8;
        const sum = document.createElement("summary");
        sum.innerHTML = '<span class="bucket-chev" aria-hidden="true">›</span><span>No due date</span><span class="bucket-count">' + undated.length + '</span>';
        det.appendChild(sum);
        const ul = document.createElement("ul");
        ul.className = "cal-undated-list";
        undated.forEach(t => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = pulse(t.b, t.id); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.innerHTML = '<span class="ud-dot" style="--accent:'+STATUS_COLOR[t.s]+'"></span>' +
            '<span class="ud-name"></span><span class="ud-board"></span>';
          a.querySelector(".ud-name").textContent = t.n;
          a.querySelector(".ud-board").textContent = BOARDS[t.b].label;
          li.appendChild(a);
          ul.appendChild(li);
        });
        det.appendChild(ul);
        wrap.appendChild(det);
      }

      calendarEl.appendChild(wrap);
    }

    /* ---- view toggle (Week / List / Board / Calendar) -------------- */
    function setView(v){
      view = v;
      try { localStorage.setItem("marlie-view-v2", v); } catch(e){}
      weekEl.hidden = v !== "week";
      bucketsEl.hidden = v !== "list";
      kanbanEl.hidden = v !== "board";
      calendarEl.hidden = v !== "calendar";
      updateToolbar();
      renderFilters();
      renderView();
    }
    document.querySelectorAll(".view-seg").forEach(b =>
      b.addEventListener("click", () => {
        setView(b.dataset.view);
        closeMenus();
      }));

    /* ---- snapshot note + live refresh ------------------------------ */
    const snapNote = document.getElementById("snapNote");
    const taskRefreshBtn = document.getElementById("taskRefresh");

    function paintSnapNote(){
      if (snapshotLive && lastSyncedAt) {
        const mins = Math.round((Date.now() - lastSyncedAt) / 60000);
        snapNote.textContent = mins <= 0 ? "synced just now" : "synced " + mins + " min ago";
        return;
      }
      const [y,m,d] = snapshotDate.split("-").map(Number);
      const label = new Date(y, m-1, d).toLocaleDateString(undefined, { month:"short", day:"numeric" });
      snapNote.textContent = "as of " + label;
    }

    taskRefreshBtn.addEventListener("click", async () => {
      if (taskRefreshBtn.disabled) return;
      taskRefreshBtn.disabled = true;
      taskRefreshBtn.classList.add("spinning");
      const prevNote = snapNote.textContent;
      snapNote.textContent = "refreshing…";
      try {
        const res = await fetch("/api/tasks/" + pageSlug, { cache: "no-store" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || ("HTTP " + res.status));
        }
        TASKS.length = 0;
        TASKS.push(...data.tasks);
        snapshotDate = data.snapshotDate || snapshotDate;
        snapshotLive = true;
        lastSyncedAt = Date.now();
        saveLiveTasks(data);
        paintSnapNote();
        refreshTasks();
      } catch (err) {
        snapNote.textContent = "refresh failed";
        taskRefreshBtn.title = String(err.message || err);
        setTimeout(() => {
          paintSnapNote();
          taskRefreshBtn.title = "Refresh from Monday";
        }, 4000);
      } finally {
        taskRefreshBtn.disabled = false;
        taskRefreshBtn.classList.remove("spinning");
        if (snapNote.textContent === "refreshing…") snapNote.textContent = prevNote;
      }
    });

    /* ---- theme toggle (shares tu-theme with the main site) --------- */
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const SUN='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    const isDark = () => (root.dataset.theme ? root.dataset.theme==="dark" : prefersDark.matches);
    function paintTheme(){
      const dark = isDark();
      toggle.innerHTML = dark ? SUN : MOON;
      toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");
      if (themeMeta) themeMeta.content = dark ? "#15171c" : "#efd1b9";
    }
    toggle.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("tu-theme", next); } catch(e){}
      paintTheme();
    });
    prefersDark.addEventListener("change", () => { if (!root.dataset.theme) paintTheme(); });
    paintTheme();

    /* ---- greeting -------------------------------------------------- */
    (function(){
      const h = now.getHours();
      // No name here -- the <h1> two inches to the left already says whose page
      // this is, and the band only has room for one line of meta.
      const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      document.getElementById("greeting").textContent = greet;
      document.getElementById("today").textContent =
        now.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
    })();

    /* ---- whose page this is ---------------------------------------- */
    /* Keyed off the <h1>, which is the one place the page states whose it is
       and the one thing generate-focus-pages.mjs localises -- so the mark stays
       correct without depending on the URL or on a per-page literal. */
    const PERSON_ACCENT = { marlie:"#3d6ea8", ashley:"#7d4f9e", carolina:"#4f8a5c", olivia:"#a8553d" };
    (function(){
      const nameEl = document.getElementById("whoName");
      const monoEl = document.getElementById("whoMono");
      if (!nameEl || !monoEl) return;
      const who = nameEl.textContent.trim();
      monoEl.textContent = who.charAt(0).toUpperCase();
      const accent = PERSON_ACCENT[who.toLowerCase()];
      if (accent) document.querySelector("header.hero").style.setProperty("--who", accent);
    })();

    /* =================================================================
       My Pins + My List — local-first, synced to Cloudflare KV.

       localStorage is what the UI renders from, so it paints instantly and
       keeps working offline or before the KV binding exists. KV is the sync
       layer: pull once on load, debounced push on change, last-write-wins on
       the `updated` stamp. Rendering from local rather than from the network
       is also what sidesteps KV's eventual consistency — we never wait on a
       read that might still be serving the previous value.

       Everything degrades to local-only if /api/data/* is missing.
       ================================================================= */
    const SLUG = "marlie";
    const LS_KEY = "tu-" + SLUG + "-data-v1";
    const API_URL = "/api/data/" + SLUG;
    const PUSH_DELAY = 2000;

    const PIN_COLORS = [
      "#bb573b","#c8791b","#5c7326","#179a72",
      "#0e7a80","#3a8ec9","#1a5aa0","#414852",
      "#735878","#c07888",
    ];
    const SVG = (d) => '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
    const PIN_ICONS = {

      sheet: SVG('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'),

      pin: SVG('<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>'),

      home: SVG('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
