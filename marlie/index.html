    /* ---- snapshot note + live refresh ------------------------------ */
    const snapNote = document.getElementById("snapNote");
    const taskRefreshBtn = document.getElementById("taskRefresh");
    /* The visible note re-words itself every minute, so it can't be the live
       region. This one only speaks when someone presses refresh. */
    const refreshStatus = document.getElementById("refreshStatus");

    function paintSnapNote(){
      if (snapshotLive && lastSyncedAt) {
        const mins = Math.round((Date.now() - lastSyncedAt) / 60000);
        snapNote.textContent = mins <= 0 ? "synced just now" : "synced " + mins + " min ago";
        return;
      }
      const [y,m,d] = snapshotDate.split("-").map(Number);
      const label = new Date(y, m-1, d).toLocaleDateString(undefined, { month:"short", day:"numeric" });
      snapNote.textContent = "as of " + label;
    }

    /* Shared by the refresh button and by syncToClock() below. Quiet mode skips
       the spinner and swallows failures: nobody asked for that fetch, so it has
       no business reporting on itself. */
    async function loadFreshTasks(opts){
      const quiet = !!(opts && opts.quiet);
      if (taskRefreshBtn.disabled) return;
      taskRefreshBtn.disabled = true;
      if (!quiet) taskRefreshBtn.classList.add("spinning");
      const prevNote = snapNote.textContent;
      if (!quiet) snapNote.textContent = refreshStatus.textContent = "refreshing…";
      try {
        /* An explicit press means "I just changed something in Monday", so it
           skips the five-minute board cache on the server. Quiet background
           syncs still take the cache -- nobody is waiting on those. */
        const url = "/api/tasks/" + pageSlug + (quiet ? "" : "?fresh=1");
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || ("HTTP " + res.status));
        }
        TASKS.length = 0;
        TASKS.push(...data.tasks);
        snapshotDate = data.snapshotDate || snapshotDate;
        snapshotLive = true;
        /* fetchedAt is when the boards were really read from Monday, which is
           older than now if the server answered from its cache -- so the note
           says "synced 3 min ago" instead of claiming a fresh pull. */
        lastSyncedAt = Date.parse(data.fetchedAt) || Date.now();
        saveLiveTasks(data);
        paintSnapNote();
        refreshTasks();
        if (!quiet) refreshStatus.textContent = "Tasks refreshed from Monday";
      } catch (err) {
        if (quiet) return;
        snapNote.textContent = "refresh failed";
        refreshStatus.textContent = "Couldn't refresh from Monday. Showing the last saved tasks.";
        taskRefreshBtn.title = String(err.message || err);
        setTimeout(() => {
          paintSnapNote();
          taskRefreshBtn.title = "Refresh from Monday";
        }, 4000);
      } finally {
        taskRefreshBtn.disabled = false;
        taskRefreshBtn.classList.remove("spinning");
        if (snapNote.textContent === "refreshing…") snapNote.textContent = prevNote;
      }
    }
    taskRefreshBtn.addEventListener("click", () => loadFreshTasks());

    /* ---- theme toggle (shares tu-theme with the main site) --------- */
    const root = document.documentElement;

    const SUN='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    const isDark = () => (root.dataset.theme ? root.dataset.theme==="dark" : prefersDark.matches);
    function paintTheme(){
      const dark = isDark();
      toggle.innerHTML = dark ? SUN : MOON;
      toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");

    toggle.addEventListener("click", () => {

      root.dataset.theme = next;
      try { localStorage.setItem("tu-theme", next); } catch(e){}

      rocket: SVG('<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>'),
      briefcase: SVG('<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>'),
      grad: SVG('<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/>'),
      clipboard: SVG('<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>'),
      target: SVG('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
      gift: SVG('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>'),
      trophy: SVG('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'),
      heart: SVG('<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>'),
      coffee: SVG('<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/>'),
      tag: SVG('<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>'),
      layers: SVG('<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12-8.97 4.08a2 2 0 0 1-1.66 0L2 12"/><path d="m22 17-8.97 4.08a2 2 0 0 1-1.66 0L2 17"/>'),
      settings: SVG('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'),
      sun: SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
    };
    const PIN_ICON_KEYS = Object.keys(PIN_ICONS);
    const CHECK_SVG = SVG('<path d="M20 6 9 17l-5-5"/>');

    const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    const nowISO = () => new Date().toISOString();

    /* A pin url becomes an href, so anything but http(s) is dropped — the
       same gate the Worker applies, repeated here because data can also
       arrive straight from localStorage. */
    function safeUrl(v) {
      let raw = String(v == null ? "" : v).trim();
      if (!raw) return "";
      if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) raw = "https://" + raw;
      try {
        const u = new URL(raw);
        return u.protocol === "http:" || u.protocol === "https:" ? u.href : "";
      } catch (e) { return ""; }
    }
    const clip = (v, n) => String(v == null ? "" : v).slice(0, n).trim();

    function normalize(o) {
      o = o && typeof o === "object" ? o : {};
      const pins = (Array.isArray(o.pins) ? o.pins : []).slice(0, 40).map(p => ({
        id: clip(p && p.id, 40) || rid(),
        label: clip(p && p.label, 60),
        url: safeUrl(p && p.url),
        icon: PIN_ICON_KEYS.indexOf(p && p.icon) > -1 ? p.icon : "link",
        color: /^#[0-9a-fA-F]{6}$/.test((p && p.color) || "") ? p.color : PIN_COLORS[0],
      })).filter(p => p.label && p.url);
      const todos = (Array.isArray(o.todos) ? o.todos : []).slice(0, 300).map(t => ({
        id: clip(t && t.id, 40) || rid(),
        text: clip(t && t.text, 300),
        done: Boolean(t && t.done),
        created: clip(t && t.created, 40) || nowISO(),
      })).filter(t => t.text);
      return { v: 1, pins, todos, updated: clip(o.updated, 40) || null };
    }

    let myData = (function () {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) return normalize(JSON.parse(raw));
      } catch (e) {}
      return normalize(null);
    })();

    /* ---- sync -------------------------------------------------------- */
    let pushTimer = null;
    let retryTimer = null;
    let retryAttempt = 0;
    let remoteLive = null;  // null = untested, true = KV answered, false = local only
    let pullDone = false;
    const RETRY_DELAYS = [5000, 15000, 30000, 60000, 120000];

    const syncEl = document.createElement("span");
    syncEl.className = "sync-note";
    syncEl.hidden = true;
    syncEl.innerHTML = '<span class="sync-dot"></span><span class="sync-text"></span>';
    document.getElementById("syncSlot").append(" · ", syncEl);

    function dataEqual(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    function mergeData(local, remote) {
      const localWins = (local.updated || "") >= (remote.updated || "");
      const winner = localWins ? local : remote;
      return normalize({
        v: 1,
        pins: winner.pins,
        todos: winner.todos,
        updated: [local.updated, remote.updated].filter(Boolean).sort().pop() || null,
      });
    }

    function applyData(next, opts) {
      const prev = JSON.stringify(myData);
      myData = next;
      if (JSON.stringify(myData) === prev) return false;
      if (opts && opts.bump) myData.updated = nowISO();
      saveLocal();
      renderPins();
      renderTodos();
      return true;
    }

    function setSync(state, text) {
      if (remoteLive === false && state !== "local") return;
      syncEl.hidden = false;
      syncEl.dataset.state = state;
      syncEl.querySelector(".sync-text").textContent = text;
    }

    function saveLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(myData)); } catch (e) {}
    }

    /* Every mutation goes through here: stamp, persist locally, queue a push. */
    function changed() {
      myData.updated = nowISO();
      saveLocal();
      clearTimeout(pushTimer);
      clearTimeout(retryTimer);
      retryAttempt = 0;
      if (remoteLive !== false) setSync("saving", "Saving…");
      pushTimer = setTimeout(push, PUSH_DELAY);
    }

    function scheduleRetry() {
      clearTimeout(retryTimer);
      if (retryAttempt >= RETRY_DELAYS.length) return;
      const wait = RETRY_DELAYS[retryAttempt++];
      retryTimer = setTimeout(push, wait);
    }

    async function push() {
      if (remoteLive === false) return;
      clearTimeout(retryTimer);
      try {
        const getRes = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (getRes.ok) {
          const remote = normalize(await getRes.json());
          const merged = mergeData(myData, remote);
          if (!dataEqual(merged, myData)) applyData(merged, { bump: true });
        }
        const res = await fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(myData),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        remoteLive = true;
        retryAttempt = 0;
        setSync("saved", "Synced across devices");
      } catch (e) {
        if (remoteLive === null && !pullDone) return;
        if (remoteLive === null) { remoteLive = false; setSync("local", "Saved on this device only"); }
        else { setSync("error", "Couldn't sync — will retry"); scheduleRetry(); }
      }
    }

    async function pull() {
      try {
        const res = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const remote = normalize(await res.json());
        remoteLive = true;
        const merged = mergeData(myData, remote);
        const differsFromLocal = !dataEqual(merged, myData);
        const differsFromRemote = !dataEqual(merged, remote);
        if (differsFromLocal) applyData(merged, { bump: differsFromRemote });
        if (differsFromLocal && differsFromRemote) {
          clearTimeout(pushTimer);
          if (remoteLive !== false) setSync("saving", "Saving…");
          pushTimer = setTimeout(push, PUSH_DELAY);
        }
        setSync("saved", "Synced across devices");
      } catch (e) {
        remoteLive = false;
        setSync("local", "Saved on this device only");
      } finally {
        pullDone = true;
      }
    }

    /* ---- pins -------------------------------------------------------- */
    const pinsEl = document.getElementById("pins");
    const pinEditorEl = document.getElementById("pinEditor");
    const pinManageBtn = document.getElementById("pinManage");
    let manageMode = false;
    let editingId = null;   // pin id being edited, or "new", or null

    function pinIconEl(p) {
      const icon = document.createElement("span");
      icon.className = "link-icon";
      icon.innerHTML = PIN_ICONS[p.icon] || PIN_ICONS.link;
      return icon;
    }

    function pinLink(p) {
      const a = document.createElement("a");
      a.href = p.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--link-accent", p.color);
      const name = document.createElement("span");
      name.className = "lname";
      name.textContent = p.label;
      const arr = document.createElement("span");
      arr.className = "larr";
      arr.setAttribute("aria-hidden", "true");
      arr.textContent = "↗";
      a.append(pinIconEl(p), name, arr);
      return a;
    }

    function miniBtn(label, title, onClick, disabled) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mini-btn icon-only";
      b.textContent = label;
      b.title = title;
      b.setAttribute("aria-label", title);
      b.disabled = Boolean(disabled);
      b.addEventListener("click", onClick);
      return b;
    }

    function renderPins() {
      pinsEl.replaceChildren();

      if (!myData.pins.length && !manageMode) {
        const li = document.createElement("li");
        li.className = "list-empty";
        li.textContent = "No pins yet — hit Manage to add one.";
        pinsEl.appendChild(li);
      }

      myData.pins.forEach((p, i) => {
        const li = document.createElement("li");
        if (!manageMode) {
          li.appendChild(pinLink(p));
        } else {
          li.className = "pin-manage";
          li.style.setProperty("--link-accent", p.color);
          const label = document.createElement("span");
          label.className = "pin-label";
          label.textContent = p.label;
          const actions = document.createElement("span");
          actions.className = "pin-actions";
          actions.append(
            miniBtn("↑", "Move up", () => movePin(i, -1), i === 0),
            miniBtn("↓", "Move down", () => movePin(i, 1), i === myData.pins.length - 1),
            miniBtn("✎", "Edit " + p.label, () => openEditor(p.id)),
            miniBtn("✕", "Delete " + p.label, () => deletePin(p.id))
          );
          li.append(pinIconEl(p), label, actions);
        }
        pinsEl.appendChild(li);
      });

      renderEditor();
    }

    function movePin(i, d) {
      const j = i + d;
      if (j < 0 || j >= myData.pins.length) return;
      const [p] = myData.pins.splice(i, 1);
      myData.pins.splice(j, 0, p);
      changed();
      renderPins();
    }

    function deletePin(id) {
      myData.pins = myData.pins.filter(p => p.id !== id);
      if (editingId === id) editingId = null;
      changed();
      renderPins();
    }

    function renderEditor() {
      pinEditorEl.replaceChildren();
      if (!manageMode) return;

      if (!editingId) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "mini-btn";
        add.textContent = "+ Add a pin";
        add.style.marginTop = "10px";
        add.addEventListener("click", () => openEditor("new"));
        pinEditorEl.appendChild(add);
        return;
      }

      const existing = myData.pins.find(p => p.id === editingId);
      const draft = existing
        ? Object.assign({}, existing)
        : { id: rid(), label: "", url: "", icon: "link", color: PIN_COLORS[0] };

      const form = document.createElement("form");
      form.className = "pin-form";

      const nameLabel = document.createElement("label");
      nameLabel.textContent = "Label";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.maxLength = 60;
      nameInput.value = draft.label;

      const urlLabel = document.createElement("label");
      urlLabel.textContent = "Link";
      const urlInput = document.createElement("input");
      urlInput.type = "text";
      urlInput.inputMode = "url";
      urlInput.autocomplete = "url";
      urlInput.value = draft.url;

      const iconLabel = document.createElement("label");
      iconLabel.textContent = "Icon";
      const iconGrid = document.createElement("div");
      iconGrid.className = "icon-grid";
      PIN_ICON_KEYS.forEach(k => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon-pick";
        b.innerHTML = PIN_ICONS[k];
        b.title = k;
        b.setAttribute("aria-label", "Icon: " + k);
        b.setAttribute("aria-pressed", String(draft.icon === k));
        b.addEventListener("click", () => {
          draft.icon = k;
          iconGrid.querySelectorAll(".icon-pick").forEach((x, xi) =>
            x.setAttribute("aria-pressed", String(PIN_ICON_KEYS[xi] === k)));
        });
        iconGrid.appendChild(b);
      });

      const colorLabel = document.createElement("label");
      colorLabel.textContent = "Color";
      const swatches = document.createElement("div");
      swatches.className = "swatches";
      PIN_COLORS.forEach(c => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.background = c;
        b.title = c;
        b.setAttribute("aria-label", "Color " + c);
        b.setAttribute("aria-pressed", String(draft.color === c));
        b.addEventListener("click", () => {
          draft.color = c;
          swatches.querySelectorAll(".swatch").forEach((x, xi) =>
            x.setAttribute("aria-pressed", String(PIN_COLORS[xi] === c)));
        });
        swatches.appendChild(b);
      });

      const actions = document.createElement("div");
      actions.className = "form-actions";
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "btn-sm btn-primary";
      save.textContent = existing ? "Save" : "Add pin";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "btn-sm btn-ghost";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => { editingId = null; renderEditor(); });
      actions.append(save, cancel);
      if (existing) {
        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-sm btn-danger";
        del.textContent = "Delete";
        del.addEventListener("click", () => deletePin(existing.id));
        actions.appendChild(del);
      }

      const err = document.createElement("p");
      err.className = "list-empty";
      err.style.cssText = "padding:6px 0 0;text-align:left;color:var(--danger)";
      err.hidden = true;

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const label = clip(nameInput.value, 60);
        const url = safeUrl(urlInput.value);
        if (!label) { err.textContent = "Give it a label."; err.hidden = false; return; }
        if (!url) { err.textContent = "Enter a web address like weather.com or https://…"; err.hidden = false; return; }
        const next = { id: draft.id, label, url, icon: draft.icon, color: draft.color };
        if (existing) myData.pins = myData.pins.map(p => (p.id === next.id ? next : p));
        else myData.pins.push(next);
        editingId = null;
        changed();
        renderPins();
      });

      form.append(nameLabel, nameInput, urlLabel, urlInput, iconLabel, iconGrid,
                  colorLabel, swatches, actions, err);
      pinEditorEl.appendChild(form);
      nameInput.focus();
    }

    function openEditor(id) { editingId = id; renderEditor(); }

    pinManageBtn.addEventListener("click", () => {
      manageMode = !manageMode;
      editingId = null;
      pinManageBtn.setAttribute("aria-pressed", String(manageMode));
      pinManageBtn.textContent = manageMode ? "Done" : "Manage";
      renderPins();
    });

    /* ---- my list ----------------------------------------------------- */
    const todosEl = document.getElementById("todos");
    const todoFootEl = document.getElementById("todoFoot");
    const todoAddForm = document.getElementById("todoAdd");
    const todoAddToggle = document.getElementById("todoAddToggle");
    const todoAddCancel = document.getElementById("todoAddCancel");
    const todoInput = document.getElementById("todoInput");
    let todoAddOpen = false;

    function setTodoAddOpen(open) {
      todoAddOpen = open;
      todoAddForm.hidden = !open;
      todoAddToggle.setAttribute("aria-expanded", String(open));
      todoAddToggle.textContent = open ? "Close" : "Add";
      if (open) {
        todoInput.focus();
      } else {
        todoInput.value = "";
      }
    }

    function renderTodos() {
      todosEl.replaceChildren();
      const open = myData.todos.filter(t => !t.done);
      const done = myData.todos.filter(t => t.done);
      const ordered = open.concat(done);

      if (!ordered.length) {
        const li = document.createElement("li");
        li.className = "list-empty";
        li.textContent = "Nothing on your list.";
        todosEl.appendChild(li);
      }

      ordered.forEach(t => {
        const section = t.done ? done : open;
        const i = section.findIndex(x => x.id === t.id);

        const li = document.createElement("li");
        li.className = "todo" + (t.done ? " done" : "");

        const check = document.createElement("button");
        check.type = "button";
        check.className = "todo-check";
        check.innerHTML = CHECK_SVG;
        check.setAttribute("aria-pressed", String(t.done));
        check.setAttribute("aria-label", (t.done ? "Mark unfinished: " : "Mark finished: ") + t.text);
        check.addEventListener("click", () => {
          t.done = !t.done;
          changed();
          renderTodos();
        });

        const text = document.createElement("span");
        text.className = "todo-text";
        text.dataset.id = t.id;
        text.textContent = t.text;
        text.title = "Click to edit";
        /* A span with a click handler is mouse-only. Make it a real control so
           the list can be edited without a pointer. */
        text.tabIndex = 0;
        text.setAttribute("role", "button");
        text.setAttribute("aria-label", "Edit: " + t.text);
        text.addEventListener("click", () => startEdit(li, text, t));
        text.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            startEdit(li, text, t);
          }
        });

        const actions = document.createElement("span");
        actions.className = "todo-actions";
        actions.append(
          miniBtn("↑", "Move up", () => moveTodo(t.id, -1), i === 0),
          miniBtn("↓", "Move down", () => moveTodo(t.id, 1), i === section.length - 1),
        );

        const del = document.createElement("button");
        del.type = "button";
        del.className = "todo-del";
        del.textContent = "✕";
        del.title = "Delete";
        del.setAttribute("aria-label", "Delete: " + t.text);
        del.addEventListener("click", () => {
          myData.todos = myData.todos.filter(x => x.id !== t.id);
          changed();
          renderTodos();
        });
        actions.appendChild(del);

        li.append(check, text, actions);
        todosEl.appendChild(li);
      });

      const doneCount = done.length;
      todoFootEl.hidden = !doneCount;
    }

    function moveTodo(id, d) {
      const open = myData.todos.filter(t => !t.done);
      const done = myData.todos.filter(t => t.done);
      let section = open;
      let i = open.findIndex(t => t.id === id);
      if (i === -1) {
        section = done;
        i = done.findIndex(t => t.id === id);
      }
      if (i === -1) return;
      const j = i + d;
      if (j < 0 || j >= section.length) return;
      const [item] = section.splice(i, 1);
      section.splice(j, 0, item);
      myData.todos = open.concat(done);
      changed();
      renderTodos();
    }

    function startEdit(li, textEl, todo) {
      const input = document.createElement("input");
      input.className = "todo-edit";
      input.type = "text";
      input.maxLength = 300;
      input.value = todo.text;
      let settled = false;
      const finish = (commit) => {
        if (settled) return;
        settled = true;
        const next = clip(input.value, 300);
        if (commit && next && next !== todo.text) { todo.text = next; changed(); }
        renderTodos();
        /* renderTodos() rebuilds the list, so put the caret back where the
           person left it instead of dropping focus to the top of the page. */
        const back = Array.from(todosEl.querySelectorAll(".todo-text"))
          .find((el) => el.dataset.id === todo.id);
        if (back) back.focus();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      input.addEventListener("blur", () => finish(true));
      li.replaceChild(input, textEl);
      input.focus();
      input.select();
    }

    todoAddToggle.addEventListener("click", () => setTodoAddOpen(!todoAddOpen));
    todoAddCancel.addEventListener("click", () => {
      setTodoAddOpen(false);
      todoAddToggle.focus();
    });
    todoAddForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = clip(todoInput.value, 300);
      if (!text) return;
      myData.todos.push({ id: rid(), text, done: false, created: nowISO() });
      changed();
      renderTodos();
      setTodoAddOpen(false);
      todoAddToggle.focus();
    });

    document.getElementById("clearDone").addEventListener("click", () => {
      myData.todos = myData.todos.filter(t => !t.done);
      changed();
      renderTodos();
    });

    /* ---- init ------------------------------------------------------ */
    loadLiveTasks();
    paintSnapNote();
    renderFilters();
    setView(view);
    renderNewAssigned();
    renderPins();
    renderTodos();
    pull();
    /* Tasks saved before subitems carried pid can't fold out a milestone's
       steps, and the baked snapshot only catches up overnight. Pull once,
       quietly, so the steps show without anyone pressing refresh. */
    if (TASKS.some(t => t.sub) && !TASKS.some(t => t.pid)) loadFreshTasks({ quiet: true });
    // A pending debounce would otherwise be lost when the tab closes.
    addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && pushTimer) { clearTimeout(pushTimer); push(); }
      else if (document.visibilityState === "visible" && pullDone) {
        pull();
        if (syncEl.dataset.state === "error" && remoteLive !== false) push();
      }
    });
    addEventListener("online", () => {
      if (remoteLive === false) {
        remoteLive = null;
        pull();
      } else if (syncEl.dataset.state === "error") {
        retryAttempt = 0;
        push();
      }
    });

    /* ---- keep the page honest about the time -------------------------
       A hard refresh used to be the only thing that moved this page's clock.
       Now the clock is re-read once a minute while the page is on screen, and
       again every time the app comes back to the foreground. Crossing midnight
       re-buckets every task, because "overdue", "today" and "this week" have
       all shifted underneath the render. */
    const RESUME_STALE_MS = 10 * 60 * 1000;

    function refreshToday(){
      now = new Date();
      today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      TODAY_ISO = toIso(today);
    }

    function syncToClock(opts){
      const rolled = toIso(new Date()) !== TODAY_ISO;
      refreshToday();
      paintGreeting();
      if (!taskRefreshBtn.disabled) paintSnapNote();   // don't talk over a live refresh
      if (rolled){
        /* A new day means the page has been idle since yesterday, so whichever
           week or month you had paged to is stale context, not state worth
           keeping. Land back on the present. */
        tlSel = null;
        refreshTasks();
      }
      const stale = lastSyncedAt === null || Date.now() - lastSyncedAt > RESUME_STALE_MS;
      if ((rolled || (opts && opts.resumed)) && stale) loadFreshTasks({ quiet: true });
    }

    setInterval(() => { if (document.visibilityState === "visible") syncToClock(); }, 60000);
    addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") syncToClock({ resumed: true });
    });

    /* ---- service worker --------------------------------------------- */
    if ("serviceWorker" in navigator) {
      /* An installed PWA can go weeks without a navigation, and a navigation is
         the only moment the browser looks for a new worker on its own. So ask on
         every return to the foreground, and reload once the new worker takes
         over -- that reload is what the hard refresh was standing in for.
         Dropping an in-flight push is safe: every edit hits localStorage
         synchronously first, and the next pull merges it back by timestamp. */
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController || reloading) return;   // a first install is not an update
        reloading = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          const check = () => {
            if (document.visibilityState === "visible") reg.update().catch(() => {});
          };
          addEventListener("visibilitychange", check);
          setInterval(check, 15 * 60 * 1000);
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
