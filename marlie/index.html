<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marlie · Focus Page</title>
  <meta name="description" content="Marlie's personal focus page — Monday tasks and quick links." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#efd1b9" />
  <link rel="icon" href="../icons/app/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../tokens.css" />

  <style>
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; overflow-x:clip; overscroll-behavior-x:none; }
    body {
      margin:0; width:100%; max-width:100%; overflow-x:clip; overscroll-behavior-x:none;
      touch-action:pan-y pinch-zoom;
      font-family:var(--sans); color:var(--ink); line-height:1.5;
      background:var(--canvas-bg);
      -webkit-font-smoothing:antialiased;
      padding:max(20px,env(safe-area-inset-top)) var(--layout-gutter) calc(40px + env(safe-area-inset-bottom));
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:stretch;
    }
    .wrap {
      width:100%; max-width:min(var(--layout-max),100%); margin-inline:auto; min-width:0;
      flex:1 0 auto; display:flex; flex-direction:column;
    }
    a { color:inherit; }
    .skip-link {
      position:absolute; left:16px; top:-100%; z-index:100; padding:10px 14px;
      border-radius:var(--radius); background:var(--card); color:var(--ink);
      font-weight:650; border:1px solid var(--line); box-shadow:var(--shadow);
      text-decoration:none;
    }
    .skip-link:focus { position:fixed; top:max(16px,env(safe-area-inset-top)); left:16px; outline:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ---- header ------------------------------------------------------
       A band, not a card: the wash and hairline run the full width of the
       window while the content stays on the same column as the page below.
       `margin-inline: calc(50% - 50vw)` reaches from .wrap out to both edges;
       .hero-inner puts the content back on the grid. html carries
       overflow-x:clip, so a scrollbar's worth of 100vw is clipped rather than
       becoming a sideways scroll. Mirrors the Command Center header. */
    header.hero {
      margin-inline:calc(50% - 50vw);
      margin-top:calc(-1 * max(20px,env(safe-area-inset-top)));
      margin-bottom:26px;
      padding-inline:var(--layout-gutter);
      background:var(--hero-bg);
      border-bottom:1px solid var(--line);
    }
    /* Padding and column match the Command Center's .hero-inner exactly, and
        both headers are governed by the same tallest child (the 44px icon
        button), so the band is the same height on every page. */
    .hero-inner {
      display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px;
      max-width:min(var(--layout-max),100%); margin-inline:auto; padding:18px 0 16px;
      min-width:0;
    }
    /* Back to the Command Center — plain text in the band, not a floating pill */
    .team-back {
      display:inline-flex; align-items:center; gap:6px; flex:none;
      text-decoration:none; font-size:13px; font-weight:650; color:var(--ink);
      padding:3px 2px; border-radius:6px;
      transition:color .15s;
    }
    .team-back:hover { color:var(--brand); }
    .team-back:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .tb-arrow { font-size:14px; line-height:1; }
    .hero-sep { flex:none; width:1px; height:20px; background:var(--line); }
    /* The person's mark — the same tinted circle the Command Center's avatar
       stack uses, so a face means the same thing on both pages. */
    .who-mono {
      flex:none; width:32px; height:32px; border-radius:50%;
      display:grid; place-items:center;
      font-family:var(--sans); font-weight:700; font-size:12.5px;
      color:var(--who,var(--brand));
      background:color-mix(in srgb,var(--who,var(--brand)) 16%,var(--card));
    }
    /* The person accents are literals, so unlike a token they do NOT lighten
       with the theme — accent-on-dark-tint lands near 3:1. Mixing the letter
       toward paper (and the ground a little further from it) restores it. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .who-mono {
        color:color-mix(in srgb,var(--who,var(--brand)) 45%,#fff);
        background:color-mix(in srgb,var(--who,var(--brand)) 26%,var(--card));
      }
    }
    :root[data-theme="dark"] .who-mono {
      color:color-mix(in srgb,var(--who,var(--brand)) 45%,#fff);
      background:color-mix(in srgb,var(--who,var(--brand)) 26%,var(--card));
    }
    h1 {
      font-family:var(--sans); font-weight:750; font-size:clamp(22px,2.8vw,28px);
      line-height:1.1; letter-spacing:-0.025em; color:var(--ink); margin:0;
    }
    /* Greeting and date on one line, joined by a middot */
    .head-meta {
      display:flex; align-items:baseline; gap:7px; min-width:0;
      margin-left:auto; flex:none;
    }
    .greeting { font-size:13px; font-weight:650; line-height:1.3; color:var(--ink); }
    /* Scoped: .cal-day.today in the calendar would inherit the middot otherwise */
    .head-meta .today { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .head-meta .today::before { content:"·"; margin-right:7px; color:var(--faint); }
    .head-right { display:flex; align-items:center; gap:8px; flex:none; }
    .icon-btn {
      width:44px; height:44px; display:grid; place-items:center; background:var(--card);
      border:1px solid var(--line); border-radius:999px; color:var(--ink); cursor:pointer;
      box-shadow:var(--shadow); transition:transform .17s, border-color .17s;
    }
    .icon-btn:hover { transform:translateY(-1px); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .icon-btn svg { width:20px; height:20px; }

    /* ---- layout (matches Command Center #board grid) --------------- */
    main.cols { margin-top:0; min-width:0; max-width:100%; margin-bottom:40px; }
    @media (min-width:960px){
      .cols {
        display:grid;
        grid-template-columns:minmax(0,63fr) minmax(300px,37fr);
        gap:44px;
        align-items:start;
      }
      .col { display:flex; flex-direction:column; gap:34px; min-width:0; }
    }
    @media (max-width:959px){
      .cols { display:flex; flex-direction:column; gap:30px; }
      .col { display:flex; flex-direction:column; gap:30px; min-width:0; max-width:100%; }
    }

    /* A section is a label and a rule. Nothing here is boxed or shadowed --
       the header band is the page's only container. */
    .panel { min-width:0; }
    .panel-head { margin:0 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .panel-title {
      display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; color:var(--earth-deep); margin:0;
    }
    .panel-title::before { content:""; flex:none; width:4px; height:11px; border-radius:2px; background:var(--earth); }
    .panel-title a { color:inherit; text-decoration:none; transition:color .15s; }
    .panel-title a:hover, .panel-title a:focus-visible { color:var(--brand); outline:none; }

    /* ---- Monday tasks header + filter menus ------------------------- */
    .monday-head {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:12px 16px; flex-wrap:wrap;
      margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line);
    }
    .monday-head-main {
      display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; min-width:0;
    }
    .monday-mark { flex:none; display:block; }
    .monday-title { font-size:15px; font-weight:650; color:var(--ink); margin:0; line-height:1.3; }
    .monday-meta { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
    .monday-meta::before { content:"·"; margin:0 8px 0 2px; color:var(--line); }
    .monday-refresh {
      position:relative;
      font:inherit; line-height:0; padding:2px; border:0; border-radius:6px;
      background:transparent; color:var(--faint); cursor:pointer;
      transition:color .15s, background .15s;
    }
    /* Drawn at 17px, tapped at 25px. */
    .monday-refresh::after { content:""; position:absolute; inset:-4px; }
    .monday-refresh:hover { color:var(--ink); background:var(--hover-tint); }
    .monday-refresh svg { width:13px; height:13px; display:block; }
    .monday-open {
      flex:none; font-size:13px; font-weight:650; color:var(--brand);
      text-decoration:none; line-height:1.3; padding-top:1px;
    }
    .monday-open:hover { text-decoration:underline; text-underline-offset:2px; }

    /* ---- assigned to you this week ------------------------------------
       Earth-tinted header with a NEW pill and a Got it / Show toggle, then
       one row per task: name over its group and assign date, area chip, due.
       Got it folds it to the header; it never removes anything, because
       subitems handed to you show nowhere else on the page. */
    .new-assign {
      margin:0 0 14px; overflow:hidden; background:var(--card);
      border:1px solid color-mix(in srgb, var(--earth) 28%, var(--line));
      border-radius:14px; font-size:14px; color:var(--ink);
    }
    .na-head {
      display:flex; align-items:center; gap:10px; padding:4px 6px 4px 16px; min-height:46px;
      background:color-mix(in srgb, var(--earth) 10%, var(--card));
    }
    .new-assign:not(.is-collapsed) .na-head { border-bottom:1px solid color-mix(in srgb, var(--earth) 18%, var(--line)); }
    .na-pill, .new-tag {
      flex:none; padding:3px 8px; border-radius:999px; line-height:1.15;
      font-size:11px; font-weight:700; letter-spacing:.08em;
      color:var(--on-accent); background:var(--earth);
    }
    .new-tag { font-size:10.5px; padding:2px 7px; }
    .na-title { font-size:13.5px; font-weight:700; color:var(--earth-deep); min-width:0; }
    .na-count { font-size:12.5px; color:var(--earth-deep); }
    .na-toggle {
      margin-left:auto; flex:none; min-height:36px; padding:0 12px; border-radius:8px; cursor:pointer;
      background:transparent; border:0; font:inherit; font-size:13px; font-weight:650; color:var(--earth-deep);
    }
    .na-toggle:hover { background:color-mix(in srgb, var(--earth) 12%, transparent); }
    .na-toggle:focus-visible { outline:none; box-shadow:0 0 0 2px color-mix(in srgb, var(--brand) 40%, transparent); }
    .na-list { list-style:none; margin:0; padding:0; }
    .na-list li + li { border-top:1px solid var(--line-soft); }
    /* Fixed chip and date columns so both line up from row to row. */
    .na-list a {
      display:grid; grid-template-columns:minmax(0,1fr) auto 7.5em; align-items:center; gap:4px 14px;
      padding:12px 16px; color:var(--ink); text-decoration:none;
    }
    .na-list a:hover { background:color-mix(in srgb, var(--ink) 3%, var(--card)); }
    .na-list a:hover .na-task { color:var(--brand); }
    .na-list a:focus-visible { outline:none; box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--brand) 40%, transparent); }
    .na-name { min-width:0; overflow-wrap:anywhere; }
    .na-task { display:block; font-size:14.5px; font-weight:600; line-height:1.35; transition:color .13s; }
    .na-sub { display:block; margin-top:3px; font-size:12.5px; color:var(--muted); }
    .na-due { justify-self:end; font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    @media (max-width:560px){
      .na-list a { grid-template-columns:auto minmax(0,1fr); }
      .na-name { grid-column:1 / -1; }
      .na-due { justify-self:start; }
    }

    /* ---- area chips --------------------------------------------------
       One hue per synced board. Every board sits in the LACE workspace, so the
       home page's project colours would all be the same red. The c-<board>
       classes set --chip / --chip-tint for anything that wants the area's
       colour: chips, timeline rows, area cards. */
    .c-ops     { --chip:var(--hue-7); --chip-tint:var(--hue-7-tint); }
    .c-trial   { --chip:var(--hue-2); --chip-tint:var(--hue-2-tint); }
    .c-lms     { --chip:var(--hue-3); --chip-tint:var(--hue-3-tint); }
    .c-comms   { --chip:var(--hue-4); --chip-tint:var(--hue-4-tint); }
    .c-data    { --chip:var(--hue-5); --chip-tint:var(--hue-5-tint); }
    .c-content { --chip:var(--hue-6); --chip-tint:var(--hue-6-tint); }
    .area-chip {
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
      padding:2px 9px 2px 8px; border-radius:999px; font-size:12px; font-weight:600; line-height:1.4;
      color:color-mix(in srgb, var(--chip,var(--hue-7)) 72%, var(--ink)); background:var(--chip-tint,var(--hue-7-tint));
      border:1px solid color-mix(in srgb, var(--chip,var(--hue-7)) 25%, var(--chip-tint,var(--hue-7-tint)));
    }
    .area-chip::before { content:""; flex:none; width:6px; height:6px; border-radius:50%; background:var(--chip,var(--hue-7)); }

    .monday-controls {
      display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap;
      margin:0 0 18px; padding:10px 12px;
      background:var(--paper-2);
      border:1px solid var(--line);
      border-radius:12px;
    }
    .monday-controls .menu-wrap { display:flex; align-items:center; position:relative; }
    .menu-wrap { position:relative; }
    .filter-trigger {
      font:inherit; font-size:13px; font-weight:650; color:var(--ink);
      background:var(--card); border:1px solid var(--line); border-radius:999px;
      padding:7px 12px 7px 11px; cursor:pointer;
      display:inline-flex; align-items:center; gap:7px;
      line-height:1.2; min-height:34px; box-shadow:var(--shadow);
      transition:color .15s, background .15s, border-color .15s;
    }
    .filter-trigger svg { width:14px; height:14px; color:var(--muted); flex:none; }
    .filter-trigger:hover {
      border-color:color-mix(in srgb,var(--brand) 40%,var(--line));
      color:var(--brand-deep);
    }
    .filter-trigger:hover svg { color:var(--brand-deep); }
    .filter-trigger:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent), var(--shadow);
    }
    .filter-trigger[aria-expanded="true"],
    .filter-trigger.is-filtered {
      border-color:color-mix(in srgb,var(--brand) 50%,var(--line));
      color:var(--brand-deep);
      background:var(--card);
    }
    .filter-trigger[aria-expanded="true"] svg,
    .filter-trigger.is-filtered svg { color:var(--brand); }
    .filter-summary {
      max-width:22ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      font-size:12.5px; font-weight:600; color:var(--muted);
    }
    .filter-summary:not([hidden])::before {
      content:"·"; margin-right:6px; color:var(--line);
    }
    .view-toggle {
      margin-left:auto;
      display:inline-flex; align-items:center; gap:0;
      padding:3px; background:var(--card);
      border:1px solid var(--line); border-radius:999px;
      box-shadow:var(--shadow);
    }
    .view-seg {
      font:inherit; font-size:12.5px; font-weight:650; color:var(--muted);
      background:transparent; border:0; border-radius:999px;
      padding:6px 12px; cursor:pointer; line-height:1.2; min-height:28px;
      transition:color .15s, background .15s;
    }
    .view-seg:hover { color:var(--ink); }
    .view-seg:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .view-seg[aria-pressed="true"] {
      background:var(--brand); color:var(--on-accent);
    }
    .menu-panel {
      position:absolute; top:calc(100% + 8px); left:0; z-index:25;
      min-width:210px; background:var(--card);
      border:1px solid var(--line); border-radius:10px;
      box-shadow:var(--shadow); padding:6px 0;
    }
    .menu-panel[hidden] { display:none; }
    .menu-section + .menu-section { margin-top:4px; padding-top:4px; border-top:1px solid var(--line-soft); }
    .menu-section-label {
      font-size:11px; font-weight:700; letter-spacing:.12em;
      text-transform:uppercase; color:var(--faint);
      padding:6px 14px 4px;
    }
    .menu-list { list-style:none; margin:0; padding:0; }
    .menu-item {
      display:flex; align-items:center; gap:8px; width:100%;
      font:inherit; font-size:14px; font-weight:500; color:var(--ink);
      background:transparent; border:0; padding:8px 14px;
      cursor:pointer; text-align:left; transition:background .13s;
    }
    .menu-item:hover { background:var(--hover-tint); }
    /* A picked filter is a control state, so it takes brand, not earth. */
    .menu-item[aria-pressed="true"] {
      background:color-mix(in srgb,var(--brand) 10%,var(--card));
      color:var(--brand-deep); font-weight:650;
    }
    .menu-check { margin-left:auto; flex:none; width:14px; height:14px; color:var(--brand); visibility:hidden; }
    .menu-item[aria-pressed="true"] .menu-check { visibility:visible; }
    .menu-dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .task-content { min-height:80px; }

    /* ---- milestone views: shared pieces ------------------------------
       --od-ink is overdue as TEXT: the raw --overdue sits right at 4.5:1 on
       white and dips under it on its own tint, so text pulls it toward ink. */
    .panel { --od-ink:color-mix(in srgb, var(--overdue) 80%, var(--ink)); }
    /* Status is a solid Monday-coloured label with squared corners; area chips
       are soft tinted pills with a dot. Shape alone tells them apart. */
    .status-pill {
      display:inline-flex; align-items:center; justify-content:center; min-width:7.5em;
      padding:4px 10px; border-radius:5px;
      font-size:12.5px; font-weight:600; white-space:nowrap; line-height:1.2;
    }
    .st-work   { background:var(--mon-work);   color:var(--mon-work-ink); }
    .st-wait   { background:var(--mon-wait);   color:var(--mon-wait-ink); }
    .st-review { background:var(--mon-review); color:var(--mon-review-ink); }
    .st-idle   { background:var(--mon-idle);   color:var(--mon-idle-ink); }
    .st-done   { background:var(--mon-done);   color:var(--mon-done-ink); }

    /* ---- summary tiles: counts that double as jump links -------------- */
    .ms-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:0 0 14px; }
    .ms-tile {
      font:inherit; text-align:left; cursor:pointer; color:var(--ink);
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:12px 14px; min-height:44px; display:flex; flex-direction:column; gap:5px;
      transition:border-color .15s, transform .15s;
    }
    .ms-tile:hover:not(:disabled) { border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); transform:translateY(-1px); }
    .ms-tile b { font-size:26px; font-weight:700; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums; }
    .ms-tile span { font-size:12.5px; font-weight:600; color:var(--muted); line-height:1.3; }
    .ms-tile.is-alert {
      background:color-mix(in srgb,var(--overdue) 8%,var(--card));
      border-color:color-mix(in srgb,var(--overdue) 35%,var(--line));
    }
    .ms-tile.is-alert b { color:var(--od-ink); }
    .ms-tile:disabled { cursor:default; }
    .ms-tile:disabled b { color:var(--faint); }
    @media (max-width:560px){ .ms-tiles { grid-template-columns:repeat(2,minmax(0,1fr)); } }

    /* ---- focus view ---------------------------------------------------- */
    .ms-sec { margin:0 0 20px; scroll-margin-top:16px; }
    .ms-sec:focus { outline:none; }
    .ms-sec:last-child { margin-bottom:0; }
    .ms-sec-head { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; padding:0 2px 10px; }
    .ms-sec-head h3, .ms-alert-head h3 { margin:0; font-size:14px; font-weight:700; color:inherit; }
    .ms-sec-note { font-size:12.5px; color:var(--faint); }
    .ms-card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    .ms-card.is-alert { border-color:color-mix(in srgb,var(--overdue) 35%,var(--line)); }
    .ms-alert-head {
      display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:11px 16px;
      background:color-mix(in srgb,var(--overdue) 8%,var(--card)); color:var(--od-ink);
    }
    .ms-alert-head svg { width:16px; height:16px; flex:none; }
    .ms-alert-head .ms-sec-note { color:var(--od-ink); }
    .ms-empty { margin:0; padding:18px 16px; font-size:14px; color:var(--muted); }

    .ms-row {
      display:grid; grid-template-columns:52px minmax(0,1fr) auto; align-items:center; gap:14px;
      padding:12px 14px; border-top:1px solid var(--line-soft);
      color:var(--ink); text-decoration:none; transition:background .13s;
    }
    .ms-card > .ms-row:first-child { border-top:0; }
    .ms-row:hover { background:color-mix(in srgb,var(--ink) 3%,var(--card)); }
    .ms-row:hover .ms-name { color:var(--brand); }
    .ms-date {
      width:52px; height:52px; border-radius:12px; background:var(--paper-2);
      display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
    }
    .ms-date b { font-size:19px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
    .ms-date span { font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
    .ms-date.is-od { background:color-mix(in srgb,var(--overdue) 10%,var(--card)); color:var(--od-ink); }
    .ms-date.is-od span { color:var(--od-ink); }
    .ms-date.is-none b { color:var(--faint); }
    .ms-main { min-width:0; }
    .ms-name { display:block; font-size:15px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; transition:color .13s; }
    .ms-meta { display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; margin-top:5px; font-size:12.5px; color:var(--muted); }
    .ms-side { display:flex; align-items:center; gap:14px; }
    .ms-when {
      min-width:6.5em; text-align:right; font-size:13px; font-weight:600; color:var(--muted);
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .ms-when.is-od { color:var(--od-ink); }
    .ms-when.is-soon { color:var(--warm-deep); }
    /* Steps: a milestone's open subitems, folded away until asked for. */
    .ms-steps-toggle {
      display:flex; align-items:center; gap:6px; width:100%; margin:0; padding:0 14px 10px 80px;
      border:0; background:none; font:inherit; font-size:12.5px; font-weight:600; color:var(--muted);
      text-align:left; cursor:pointer;
    }
    .ms-steps-toggle:hover { color:var(--brand); }
    .ms-steps-toggle:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; border-radius:6px; }
    .ms-steps-toggle .chev { display:inline-block; transition:transform .15s; }
    .ms-steps-toggle[aria-expanded="true"] .chev { transform:rotate(90deg); }
    .ms-steps { list-style:none; margin:0; padding:0 14px 12px 80px; }
    .ms-steps li + li { border-top:1px solid var(--line-soft); }
    .ms-steps a {
      display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:baseline;
      padding:7px 0; color:var(--ink); text-decoration:none; font-size:13.5px;
    }
    .ms-steps a:hover .ms-step-name { color:var(--brand); }
    .ms-step-name { overflow-wrap:anywhere; }
    .ms-step-who { grid-column:1; font-size:12px; color:var(--faint); }
    .ms-step-who.is-me { color:var(--brand); font-weight:600; }
    .ms-step-when { grid-column:2; grid-row:1; font-size:12.5px; font-weight:600; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .ms-step-when.is-od { color:var(--od-ink); }
    @media (prefers-reduced-motion: reduce){ .ms-steps-toggle .chev { transition:none; } }
    @media (max-width:560px){
      .ms-row { grid-template-columns:44px minmax(0,1fr); gap:8px 12px; align-items:start; }
      .ms-date { width:44px; height:44px; border-radius:11px; }
      .ms-date b { font-size:16px; }
      .ms-date span { font-size:9.5px; margin-top:3px; }
      .ms-side { grid-column:2; gap:10px; }
      .ms-when { min-width:0; text-align:left; }
      .ms-steps-toggle { padding-left:70px; }
      .ms-steps { padding-left:70px; }
    }

    /* Later: a month-by-month count, with the full list one press away */
    .ms-later {
      background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:16px 18px; display:flex; flex-direction:column; gap:14px;
    }
    .ms-later-head { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; }
    .ms-later-head h3 { margin:0; font-size:14px; font-weight:700; }
    .ms-more-btn {
      margin-left:auto; font:inherit; font-size:13px; font-weight:650; cursor:pointer;
      color:var(--brand-deep); background:var(--brand-tint); border:0; border-radius:999px;
      padding:0 14px; min-height:36px; transition:background .15s;
    }
    .ms-more-btn:hover { background:color-mix(in srgb,var(--brand) 18%,var(--card)); }
    .ms-hist { display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:8px; height:100px; }
    .ms-bar { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; min-width:0; }
    .ms-bar-n { font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; }
    .ms-bar-fill { width:100%; max-width:64px; border-radius:6px; background:color-mix(in srgb,var(--idle) 45%,var(--card)); }
    .ms-bar-m { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
    .ms-bar.is-peak .ms-bar-fill { background:var(--earth); }
    .ms-bar.is-peak .ms-bar-n, .ms-bar.is-peak .ms-bar-m { color:var(--earth-deep); }
    .ms-month { margin-top:16px; }
    .ms-month-head {
      margin:0 2px 8px; font-size:11px; font-weight:700; letter-spacing:.14em;
      text-transform:uppercase; color:var(--earth-deep);
    }
    @media (max-width:560px){ .ms-hist { gap:4px; } .ms-bar-m { font-size:10px; letter-spacing:.04em; } }

    /* No due date: folded away, like the other quiet buckets */
    .ms-undated { border-top:1px solid var(--line); }
    .ms-undated > summary {
      list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
      padding:12px 4px; font-weight:650; font-size:14px; min-height:44px;
    }
    .ms-undated > summary::-webkit-details-marker { display:none; }
    .ms-undated .ms-sec-note { font-weight:400; }
    .bucket-chev { color:var(--faint); transition:transform .16s; }
    .ms-undated[open] .bucket-chev { transform:rotate(90deg); }
    .ms-undated .ms-card { margin-bottom:4px; }

    /* ---- timeline view --------------------------------------------------
       One row per area, months across, a dot per milestone. Milestones that
       would sit on top of each other merge into one numbered circle; picking
       one lists what's in it underneath. Positions are percentages, so the
       chart reflows with the column. */
    .tl { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 18px 12px; margin-bottom:16px; }
    .tl-body { position:relative; }
    .tl-axis, .tl-row { display:grid; grid-template-columns:168px minmax(0,1fr); }
    .tl-axis { height:50px; }
    .tl-row { align-items:center; min-height:62px; border-top:1px solid var(--line-soft); }
    .tl-track { position:relative; align-self:stretch; margin:0 14px; }
    .tl-axis .tl-track { margin-top:0; }
    .tl-month {
      position:absolute; top:6px; font-size:11px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--faint); white-space:nowrap;
    }
    .tl-today-tag {
      position:absolute; top:26px; transform:translateX(-50%); z-index:2;
      font-size:11px; font-weight:700; line-height:1.4; white-space:nowrap;
      color:var(--on-accent); background:var(--earth); border-radius:999px; padding:1px 8px;
    }
    .tl-lines { position:absolute; top:50px; bottom:0; left:168px; right:0; pointer-events:none; }
    .tl-lines-in { position:absolute; inset:0 14px; }
    .tl-gl { position:absolute; top:0; bottom:0; width:1px; background:var(--line-soft); }
    .tl-now { position:absolute; top:-6px; bottom:0; width:2px; margin-left:-1px; background:var(--earth); }
    .tl-label { display:flex; align-items:center; gap:8px; min-width:0; font-size:13.5px; font-weight:650; padding-right:8px; white-space:nowrap; }
    .tl-label::before { content:""; flex:none; width:9px; height:9px; border-radius:50%; background:var(--chip); }
    .tl-label em { font-style:normal; font-weight:500; font-size:12px; color:var(--faint); }
    .tl-mk {
      --mk:var(--chip);
      position:absolute; top:50%; transform:translate(-50%,-50%); z-index:1;
      display:grid; place-items:center; padding:0; cursor:pointer;
      border-radius:999px; border:2px solid var(--card); background:var(--mk);
      color:var(--on-accent); font:inherit; font-size:11.5px; font-weight:700; line-height:1;
      box-shadow:0 1px 3px rgba(38,54,63,.25); transition:box-shadow .15s;
    }
    .tl-mk::after { content:""; position:absolute; inset:-5px; border-radius:inherit; }
    .tl-mk.is-od { --mk:var(--overdue); }
    .tl-mk[aria-pressed="true"] { z-index:3; box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--mk); }
    .tl-new {
      position:absolute; top:-5px; right:-5px; width:12px; height:12px; border-radius:50%;
      background:var(--earth); border:2px solid var(--card);
    }
    .tl-legend {
      display:flex; align-items:center; flex-wrap:wrap; gap:6px 18px; margin-top:8px; padding-top:10px;
      border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--muted);
    }
    .tl-legend span { display:inline-flex; align-items:center; gap:7px; }
    .tl-legend i { width:11px; height:11px; border-radius:50%; display:block; flex:none; }
    .tl-detail-head { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:13px 16px; border-bottom:1px solid var(--line-soft); }
    .tl-detail-head::before { content:""; flex:none; width:9px; height:9px; border-radius:50%; background:var(--chip); }
    .tl-detail-head.is-od::before { background:var(--overdue); }
    .tl-detail-head h3 { margin:0; font-size:15px; font-weight:700; }
    @media (max-width:560px){
      .tl { padding:12px 12px 10px; }
      .tl-axis, .tl-row { grid-template-columns:minmax(0,1fr); }
      .tl-axis .tl-spacer { display:none; }
      .tl-row { padding-top:8px; min-height:0; }
      .tl-label { justify-self:start; position:relative; z-index:2; background:var(--card); padding-right:10px; }
      .tl-row .tl-track { height:48px; }
      .tl-lines { left:0; }
      .tl-month { font-size:10px; letter-spacing:.04em; }
    }

    /* ---- areas view ------------------------------------------------------ */
    .ar-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    @media (max-width:720px){ .ar-grid { grid-template-columns:minmax(0,1fr); } }
    .ar-card {
      background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0;
    }
    .ar-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .ar-head::before { content:""; flex:none; width:10px; height:10px; border-radius:50%; background:var(--chip); }
    .ar-head h3 { margin:0; font-size:15px; font-weight:700; }
    .ar-n { font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
    .ar-od-badge {
      margin-left:auto; font-size:11.5px; font-weight:700; color:var(--od-ink);
      background:color-mix(in srgb,var(--overdue) 10%,var(--card)); border-radius:999px; padding:3px 9px;
    }
    .ar-bar { display:flex; gap:2px; height:8px; border-radius:999px; overflow:hidden; }
    .ar-bar span { display:block; height:100%; }
    .ar-next {
      display:flex; flex-direction:column; gap:3px; padding:12px 14px; border-radius:12px;
      background:var(--chip-tint); color:var(--ink); text-decoration:none;
    }
    .ar-next small {
      font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
      color:color-mix(in srgb, var(--chip) 72%, var(--ink));
    }
    .ar-next b { font-size:15px; font-weight:650; line-height:1.35; overflow-wrap:anywhere; transition:color .13s; }
    .ar-next b .new-tag { margin-right:7px; vertical-align:2px; }
    .ar-next em { font-style:normal; font-size:12.5px; color:var(--muted); }
    .ar-next:hover b { color:var(--brand); }
    .ar-next.is-od { background:color-mix(in srgb,var(--overdue) 9%,var(--card)); }
    .ar-next.is-od small { color:var(--od-ink); }
    .ar-then { list-style:none; margin:0; padding:0; }
    .ar-then a {
      display:flex; justify-content:space-between; gap:12px; padding:9px 2px;
      border-top:1px solid var(--line-soft); font-size:13.5px; color:var(--ink); text-decoration:none;
    }
    .ar-then a:hover { color:var(--brand); }
    .ar-then .new-tag { margin-right:6px; vertical-align:1px; }
    .ar-then-due { flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
    .ar-then-due.is-od { color:var(--od-ink); font-weight:600; }
    .ar-all {
      align-self:flex-start; margin-top:auto; font:inherit; font-size:13px; font-weight:650;
      color:var(--brand); background:none; border:0; padding:6px 0; min-height:32px; cursor:pointer;
    }
    .ar-all:hover { text-decoration:underline; text-underline-offset:2px; }
    /* Dashed: the one card that is a to-do about the plan, not a board */
    .ar-card.is-undated { background:transparent; border-style:dashed; }
    .ar-card.is-undated .ar-head::before { background:var(--idle); }
    .ar-then-area { flex:none; font-size:12.5px; color:var(--muted); white-space:nowrap; }
    .ar-more { margin:0; padding:9px 2px 0; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--muted); }
    .ar-undated-link {
      align-self:flex-start; margin-top:auto; font-size:13px; font-weight:650;
      color:var(--brand); text-decoration:none; padding:6px 0;
    }
    .ar-undated-link:hover { text-decoration:underline; text-underline-offset:2px; }

    .list-empty .wk-jump {
      font:inherit; font-size:13.5px; font-weight:650; margin-top:12px; cursor:pointer;
      background:var(--card); border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));
      color:var(--brand); border-radius:999px; padding:7px 15px; transition:transform .14s, background .14s;
    }
    .list-empty .wk-jump:hover { transform:translateY(-1px); background:color-mix(in srgb,var(--brand) 10%,var(--card)); }

    @keyframes task-spin { to { transform: rotate(360deg); } }
    .monday-refresh.spinning svg { animation: task-spin 0.85s linear infinite; }
    @media (max-width:520px){
      .monday-head { align-items:flex-start; }
      .monday-open { width:100%; }
      .menu-panel { min-width:min(240px,calc(100vw - 48px)); }
      .monday-controls { padding:10px; }
      .view-toggle { margin-left:0; width:100%; }
      .view-seg { flex:1; text-align:center; padding:7px 8px; }
      .filter-summary { max-width:16ch; }
    }

    /* ---- shared empty state (pins, list, tasks) --------------------- */
    .list-empty { color:var(--faint); font-size:14px; text-align:center; padding:16px 8px; }
    .task-content .list-empty { color:var(--muted); padding:26px 12px; }
    .task-content .list-empty .wk-jump { display:block; margin:12px auto 0; }

    /* ---- jump links ------------------------------------------------ */
    .links { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
    .links a {
      --link-accent:var(--earth);
      display:flex; align-items:center; gap:11px; text-decoration:none; padding:10px 4px;
      border-radius:7px; border:0; border-bottom:1px solid var(--line-soft);
      background:transparent;
      transition:background .15s, border-color .15s;
    }
    .links > li:last-child a { border-bottom:none; }
    .links a:hover {
      background:var(--hover-tint); border-bottom-color:transparent;
      box-shadow:inset 2px 0 0 var(--link-accent);
    }
    .link-icon {
      width:24px; height:24px; border-radius:50%; flex:none;
      display:grid; place-items:center;
      background:color-mix(in srgb,var(--link-accent) 16%,var(--card));
      color:var(--link-accent);
      border:1px solid color-mix(in srgb,var(--link-accent) 22%,var(--line));
    }
    .link-icon svg { width:13px; height:13px; display:block; }
    .links .lname { font-size:14.5px; font-weight:600; flex:1; min-width:0; line-height:1.35; }
    .links .larr {
      flex:none; width:20px; height:20px; border-radius:999px;
      display:grid; place-items:center; font-size:13px; line-height:1;
      color:var(--muted); background:transparent;
      opacity:.7; transition:opacity .15s, transform .15s, color .15s;
    }
    .links a:hover .larr { color:var(--link-accent); }
    .links a:hover .larr { opacity:1; transform:translate(1px,-1px); }

    /* ---- sidebar (pins + list — right column) ----------------------- */
    .sidebar .panel-head { margin-bottom:10px; }
    .sidebar .head-link {
      font:inherit; font-size:13px; font-weight:650; color:var(--brand);
      background:none; border:0; padding:0; cursor:pointer; text-decoration:none;
    }
    .sidebar .head-link:hover { text-decoration:underline; text-underline-offset:2px; }
    .sidebar .head-link[aria-pressed="true"] { color:var(--brand-deep); }
    .sidebar .links a {
      padding:11px 4px; gap:10px;
    }
    .sidebar .links a:hover {
      background:var(--hover-tint); border-bottom-color:var(--line-soft);
      box-shadow:none;
    }
    .sidebar .link-icon {
      width:20px; height:20px;
      background:var(--link-accent);
      color:var(--on-accent);
      border:none;
    }
    .sidebar .link-icon svg { width:11px; height:11px; }
    .sidebar .links .lname { font-size:14px; font-weight:600; }
    .sidebar .links .larr {
      width:auto; height:auto; font-size:13px; opacity:.5;
      transform:none;
    }
    .sidebar .links a:hover .larr { opacity:.85; transform:none; }
    .sidebar .list-empty { text-align:left; padding:8px 4px 12px; }
    .sidebar .pin-manage {
      display:flex; align-items:center; gap:10px;
      padding:11px 4px; border-bottom:1px solid var(--line-soft);
    }
    .sidebar .pin-manage:last-child { border-bottom:none; }
    .sidebar .pin-manage .pin-label { flex:1; min-width:0; font-size:14px; font-weight:600;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ---- my pins ---------------------------------------------------- */
    .pin-row { display:flex; align-items:center; gap:8px; }
    .pin-row .links { flex:1; min-width:0; }
    .pin-actions { display:flex; gap:6px; flex:none; }
    .mini-btn {
      font:inherit; font-size:12px; font-weight:650; cursor:pointer; color:var(--muted);
      background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
      padding:5px 9px; line-height:1.2; transition:border-color .15s, color .15s;
    }
    .mini-btn:hover { color:var(--ink); border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); }
    .mini-btn[aria-pressed="true"] { color:var(--brand-deep); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .mini-btn.icon-only {
      display:inline-flex; align-items:center; justify-content:center;
      line-height:0; min-width:28px; min-height:28px; padding:5px 7px;
    }
    .mini-btn.icon-only svg { width:14px; height:14px; display:block; flex-shrink:0; }
    .head-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }

    /* ---- pin editor -------------------------------------------------- */
    .pin-form { border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; padding:14px 0 4px; margin-top:8px; }
    .pin-form label { display:block; font-size:11px; font-weight:650; letter-spacing:.06em;
      text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
    .pin-form input[type="text"], .pin-form input[type="url"] {
      font:inherit; font-size:14px; width:100%; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:10px;
    }
    .pin-form input:focus { outline:none; border-color:var(--brand); }
    .swatches, .icon-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .swatch {
      width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
      border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .swatch[aria-pressed="true"] { border-color:var(--ink); }
    .icon-pick {
      width:32px; height:32px; border-radius:8px; cursor:pointer; display:grid; place-items:center;
      background:var(--card); border:1px solid var(--line); color:var(--muted); padding:0;
    }
    .icon-pick svg { width:16px; height:16px; }
    .icon-pick[aria-pressed="true"] { color:var(--brand); border-color:var(--brand); background:color-mix(in srgb,var(--brand) 10%,var(--card)); }
    .form-actions { display:flex; gap:8px; align-items:center; }
    .btn-sm { font:inherit; font-size:13px; font-weight:650; cursor:pointer; border-radius:8px; padding:7px 13px; }
    .btn-primary { background:var(--brand); border:1px solid var(--brand); color:var(--on-accent); }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
    .btn-danger { background:transparent; border:1px solid var(--line); color:var(--danger); margin-left:auto; }

    /* ---- my list ----------------------------------------------------- */
    .sidebar .todo-add { margin-bottom:10px; }
    .sidebar .todo-add[hidden] { display:none; }
    .sidebar .todo-add input { padding:9px 11px; font-size:14px; }
    .sidebar .todo-add .btn-primary {
      flex:none; background:var(--ink); border-color:var(--ink);
      padding:10px 14px; border-radius:8px;
    }
    .sidebar .todo-add .btn-primary:hover { background:color-mix(in srgb,var(--ink) 88%,var(--brand)); border-color:color-mix(in srgb,var(--ink) 88%,var(--brand)); }
    .sidebar .todo { padding:11px 4px; align-items:center; }
    .sidebar .todo-check { width:16px; height:16px; border-radius:3px; margin-top:0; }
    .sidebar .todo.done .todo-check { background:var(--ok); border-color:var(--ok); }
    .sidebar .todo-text { font-size:14px; line-height:1.4; }
    .todo-add { display:flex; gap:8px; margin-bottom:12px; }
    .todo-add input {
      font:inherit; font-size:14px; flex:1; min-width:0; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
    }

    @media (hover: none) {

       shown with their parent item so they read on their own. */
    function milestones(){
      return TASKS.filter(t => !t.sub || t.soon);
    }

    function visibleTasks(){
      return milestones().filter(t => {
        if (t.s === "done") return false;
        if (activeStatus !== "all" && t.s !== activeStatus) return false;
        if (activeArea !== "all" && t.b !== activeArea) return false;
        return true;
      });
    }

    function areaFilteredTasks(){
      return milestones().filter(t => activeArea === "all" || t.b === activeArea);
    }

    function countByStatus(status){
      return milestones().filter(t => {
        if (status !== "all" && t.s !== status) return false;
        if (activeArea !== "all" && t.b !== activeArea) return false;
        return true;
      }).length;
    }

    function countByArea(area){
      return milestones().filter(t => {
        if (activeStatus !== "all" && t.s !== activeStatus) return false;
        if (area !== "all" && t.b !== area) return false;
        return true;
      }).length;
    }

    function refreshTasks(){
      renderFilters();
      updateToolbar();
      renderNewAssigned();
      renderView();
    }

    /* ---- recently assigned ------------------------------------------
       t.a is the day someone else put you on the task (Eastern), set by
       scripts/refresh-tasks.mjs and /api/tasks only for the past week.
       Re-checked against today here so a stale snapshot still ages out.
       Hide collapses the card to its header and remembers those task ids;
       a newer assignment opens it again. It never removes anything: subitems
       show nowhere else on the page, so the card is their only home here. */
    const NEW_SEEN_KEY = "tu-" + pageSlug + "-new-seen-v1";
    const newAssignedEl = document.getElementById("newAssigned");
    function seenNew(){
      try { return new Set(JSON.parse(localStorage.getItem(NEW_SEEN_KEY) || "[]")); }
      catch(e){ return new Set(); }
    }
    function renderNewAssigned(){
      const seen = seenNew();
      const fresh = TASKS
        .filter(isNew)
        .sort((x, y) => (x.a < y.a ? 1 : x.a > y.a ? -1 : x.n.localeCompare(y.n)));
      newAssignedEl.replaceChildren();
      newAssignedEl.hidden = fresh.length === 0;
      if (!fresh.length) return;
      let collapsed = fresh.every(t => seen.has(t.id));

      const box = el("div", "new-assign");
      box.setAttribute("role", "region");
      box.setAttribute("aria-label", "Assigned to you this week");
      const head = el("div", "na-head");
      head.append(el("span", "na-pill", "NEW"), el("span", "na-title", "Assigned to you this week"),
        el("span", "na-count", fresh.length === 1 ? "1 item" : fresh.length + " items"));
      const toggle = el("button", "na-toggle");
      toggle.type = "button";
      toggle.setAttribute("aria-controls", "newAssignedList");
      head.append(toggle);

      const list = el("ul", "na-list");
      list.id = "newAssignedList";
      const paint = () => {
        box.classList.toggle("is-collapsed", collapsed);
        list.hidden = collapsed;
        toggle.textContent = collapsed ? "Show" : "Got it";
        toggle.setAttribute("aria-expanded", String(!collapsed));
      };
      toggle.addEventListener("click", () => {
        collapsed = !collapsed;
        fresh.forEach(t => collapsed ? seen.add(t.id) : seen.delete(t.id));
        /* Only ids still in the window are worth keeping. */
        const keep = [...seen].filter(id => TASKS.some(t => t.id === id && t.a));
        try { localStorage.setItem(NEW_SEEN_KEY, JSON.stringify(keep)); } catch(e){}
        paint();
      });
      fresh.forEach(t => {
        const li = el("li");
        const a = pulseLink(null, t);
        const name = el("span", "na-name");
        name.append(el("span", "na-task", t.n),
          el("span", "na-sub", [context(t), "assigned " + fmtShort(t.a)].filter(Boolean).join(" · ")));
        const due = el("span", "na-due", t.due ? "Due " + fmtShort(t.due) : "No due date");
        a.append(name, areaChip(t.b), due);
        li.append(a);
        list.append(li);
      });
      box.append(head, list);
      paint();
      newAssignedEl.append(box);
    }

    function updateToolbar(){
      if (taskToolbar) taskToolbar.dataset.view = view;
      if (statusMenuSection) statusMenuSection.hidden = view === "areas";
    }

    function closeMenus(except){
      if (!filterMenuWrap || filterMenuWrap === except) return;
      filterPanel.hidden = true;
      filterTrigger.setAttribute("aria-expanded", "false");
    }

    function toggleMenu(wrap, trigger, panel){
      const open = panel.hidden;
      closeMenus(open ? wrap : null);
      panel.hidden = !open;
      trigger.setAttribute("aria-expanded", open ? "true" : "false");
    }

    filterTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu(filterMenuWrap, filterTrigger, filterPanel);
    });
    document.addEventListener("click", () => closeMenus());
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMenus();
    });

    function menuItem(label, selected, dotColor, onPick){
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "menu-item";
      btn.setAttribute("aria-pressed", String(selected));
      if (dotColor) {
        const dot = document.createElement("span");
        dot.className = "menu-dot";
        dot.style.background = dotColor;
        dot.setAttribute("aria-hidden", "true");
        btn.appendChild(dot);
      }
      btn.appendChild(document.createTextNode(label));
      btn.insertAdjacentHTML("beforeend",
        '<svg class="menu-check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>');
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        onPick();
        closeMenus();
        refreshTasks();
      });
      li.appendChild(btn);
      return li;
    }

    function renderView(){
      renderTiles();
      if (view === "timeline") renderTimeline();
      else if (view === "areas") renderAreas();
      else renderFocus();
    }

    function renderFilters(){
      const statusDefs = [
        { k:"all",  label:"All statuses",    dot:"transparent" },  // keeps the label in line with the dotted rows
        { k:"work", label:"Working on it",   dot:"var(--mon-work)" },
        { k:"wait", label:"Waiting",         dot:"var(--mon-wait)" },
        { k:"review", label:"Needs review",  dot:"var(--mon-review)" },
        { k:"idle", label:"Not started",     dot:"var(--mon-idle)" },
      ];
      statusMenu.replaceChildren();
      statusDefs.forEach(d => {
        statusMenu.appendChild(menuItem(d.label, activeStatus === d.k, d.dot, () => { activeStatus = d.k; }));
      });

      const boards = AREA_ORDER.filter(k => milestones().some(t => t.b === k));
      areaMenu.replaceChildren();
      areaMenu.appendChild(menuItem("All areas", activeArea === "all", null, () => { activeArea = "all"; }));
      boards.forEach(k => {
        areaMenu.appendChild(menuItem(BOARDS[k].label, activeArea === k, null, () => { activeArea = k; }));
      });

      document.querySelectorAll(".view-seg").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.view === view)));

      const parts = [];
      if (activeStatus !== "all") parts.push(STATUS_FILTER_LABELS[activeStatus] || activeStatus);
      if (activeArea !== "all" && BOARDS[activeArea]) parts.push(BOARDS[activeArea].label);
      const filtered = parts.length > 0;
      filterTrigger.classList.toggle("is-filtered", filtered);
      if (filterSummary) {
        filterSummary.hidden = !filtered;
        filterSummary.textContent = parts.join(" · ");
      }
      filterTrigger.setAttribute(
        "aria-label",
        filtered ? "Filter tasks, " + parts.join(", ") : "Filter tasks"
      );
    }

    /* Shared empty state for List and Calendar. With a filter on, the way out
       is one press away; with none, there is genuinely nothing open. */
    function filterEmpty(){
      const p = document.createElement("div");
      p.className = "list-empty";
      const filtered = activeStatus !== "all" || activeArea !== "all";
      p.textContent = filtered ? "Nothing matches this filter." : "Nothing open on your boards.";
      if (filtered){
        const clear = document.createElement("button");
        clear.type = "button"; clear.className = "wk-jump"; clear.textContent = "Clear filter";
        clear.addEventListener("click", () => { activeStatus = "all"; activeArea = "all"; refreshTasks(); });
        p.appendChild(clear);
      }
      return p;
    }

    // Sort by soonest due date; undated tasks fall to the end.
    // Ties break on status then name, so what's in progress leads its day and
    // the order never depends on how the generated TASKS array happens to sit.
    const S_RANK = { work:0, review:1, wait:2, idle:3 };
    function byDue(a, b){
      const da = daysOut(a.due), db = daysOut(b.due);
      if (da !== null && db !== null && da !== db) return da - db;
      if (da === null && db !== null) return 1;
      if (db === null && da !== null) return -1;
      return S_RANK[a.s] - S_RANK[b.s] || a.n.localeCompare(b.n);
    }

    /* ---- shared pieces for the three milestone views ---------------- */
    function el(tag, cls, text){
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }
    function fmtShort(iso){ return parseDue(iso).toLocaleDateString(undefined, { month:"short", day:"numeric" }); }
    function monthShort(d){ return d.toLocaleDateString(undefined, { month:"short" }); }
    /* Someone else put you on it within the past week. Re-checked against
       today so a stale snapshot still ages out. */
    function isNew(t){ const n = daysOut(t.a); return n !== null && n > -7 && t.s !== "done"; }
    function whenText(n){
      if (n < -1) return (-n) + " days late";
      if (n === -1) return "1 day late";
      if (n === 0) return "today";
      if (n === 1) return "tomorrow";
      return "in " + n + " days";
    }
    /* A subitem names its parent so "Make comments" says what it is about.
       Group names and "shared" stay off the rows: the area chip is enough,
       and every extra word is one more thing to read past. */
    function context(t){
      return t.sub && t.p ? "in " + t.p : "";
    }
    function areaChip(k){ return el("span", "area-chip c-" + k, BOARDS[k].label); }
    function statusPill(s){
      const st = STATUS[s];
      const p = el("span", "status-pill " + st.cls);
      p.textContent = st.label;
      return p;
    }
    function pulseLink(cls, t){
      const a = el("a", cls);
      a.href = pulse(t.b, t.id); a.target = "_blank"; a.rel = "noopener noreferrer";
      return a;
    }
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    /* One milestone row: date block, name over area and context, status, when. */
    function msRow(t){
      const n = daysOut(t.due);
      const od = n !== null && n < 0;
      const a = pulseLink("ms-row", t);
      const d = el("span", "ms-date" + (od ? " is-od" : "") + (t.due ? "" : " is-none"));
      d.setAttribute("aria-hidden", "true");
      if (t.due){
        const dt = parseDue(t.due);
        d.append(el("b", null, dt.getDate()), el("span", null, monthShort(dt)));
      } else {
        d.append(el("b", null, "–"));
      }
      const main = el("span", "ms-main");
      main.append(el("span", "ms-name", t.n));
      const meta = el("span", "ms-meta");
      if (isNew(t)) meta.append(el("span", "new-tag", "NEW"));
      meta.append(areaChip(t.b));
      const ctx = context(t);
      if (ctx) meta.append(el("span", null, ctx));
      main.append(meta);
      const side = el("span", "ms-side");
      let whenTxt = "no date", whenCls = "";
      if (t.due){
        whenTxt = n > 30 ? fmtShort(t.due) : whenText(n);
        whenCls = od ? " is-od" : n <= 7 ? " is-soon" : "";
      }
      const when = el("span", "ms-when" + whenCls, whenTxt);
      if (t.due && n <= 30) when.append(el("span", "sr-only", ", " + fmtShort(t.due)));
      side.append(statusPill(t.s), when);
      a.append(d, main, side);
      return a;
    }
    /* A milestone's open subitems, sent along with pid for milestones that are
       yours. Steps under someone else's milestone only surface once they're
       due within two weeks, as their own rows. */
    function stepsFor(t){
      if (t.sub) return [];
      return TASKS.filter(x => x.sub && x.pid === t.id && x.s !== "done").sort(byDue);
    }
    const openSteps = new Set();   // which milestones are folded open, this visit only
    function msSteps(t){
      const steps = stepsFor(t);
      if (!steps.length) return null;
      const wrap = el("div", "ms-steps-wrap");
      const btn = el("button", "ms-steps-toggle");
      btn.type = "button";
      const list = el("ul", "ms-steps");
      list.id = "steps-" + t.id + "-" + Math.random().toString(36).slice(2, 7);
      btn.setAttribute("aria-controls", list.id);
      const label = steps.length === 1 ? "1 step" : steps.length + " steps";
      btn.innerHTML = '<span class="chev" aria-hidden="true">▸</span>';
      btn.append(label);
      steps.forEach(x => {
        const li = el("li");
        const a = pulseLink(null, x);
        a.append(el("span", "ms-step-name", x.n));
        const n = daysOut(x.due);
        const when = x.due ? (n < 0 ? whenText(n) : fmtShort(x.due)) : "no date";
        a.append(el("span", "ms-step-when" + (n !== null && n < 0 ? " is-od" : ""), when));
        a.append(el("span", "ms-step-who" + (x.me ? " is-me" : ""), x.me ? "You" : (x.o || "Unassigned")));
        li.append(a);
        list.append(li);
      });
      const paint = () => {
        const open = openSteps.has(t.id);
        btn.setAttribute("aria-expanded", String(open));
        list.hidden = !open;
      };
      btn.addEventListener("click", () => {
        openSteps.has(t.id) ? openSteps.delete(t.id) : openSteps.add(t.id);
        paint();
      });
      paint();
      wrap.append(btn, list);
      return wrap;
    }
    /* A milestone row plus, when it has any, its folded list of steps. */
    function msItem(t){
      const frag = document.createDocumentFragment();
      frag.append(msRow(t));
      const steps = msSteps(t);
      if (steps) frag.append(steps);
      return frag;
    }
    function msCard(items, cls){
      const card = el("div", "ms-card" + (cls ? " " + cls : ""));
      items.forEach(t => card.append(msItem(t)));
      return card;
    }

    /* Overdue / next 30 days / later / no date. The tiles and the Focus view
       both read from this, so their counts can never disagree. */
    function focusBuckets(tasks){
      const od = [], soon = [], later = [], none = [];
      tasks.forEach(t => {
        const n = daysOut(t.due);
        if (n === null) none.push(t);
        else if (n < 0) od.push(t);
        else if (n <= 30) soon.push(t);
        else later.push(t);
      });
      od.sort(byDue); soon.sort(byDue); later.sort(byDue);
      none.sort((a, b) => S_RANK[a.s] - S_RANK[b.s] || a.n.localeCompare(b.n));
      return { od, soon, later, none };
    }

    /* ---- summary tiles ---------------------------------------------- */
    function renderTiles(){
      const { od, soon, later, none } = focusBuckets(visibleTasks());
      const defs = [
        { k:"od",    n:od.length,    label:"Overdue", alert:od.length > 0 },
        { k:"soon",  n:soon.length,  label:"Next 30 days" },
        { k:"later", n:later.length, label:"Later" },
        { k:"none",  n:none.length,  label:"No due date" },
      ];
      tilesEl.replaceChildren();
      defs.forEach(d => {
        const b = el("button", "ms-tile" + (d.alert ? " is-alert" : ""));
        b.type = "button";
        b.disabled = d.n === 0;
        b.setAttribute("aria-label", d.n + " " + d.label + (d.n ? ", show them" : ""));
        b.append(el("b", null, d.n), el("span", null, d.label));
        b.addEventListener("click", () => jumpTo(d.k));
        tilesEl.append(b);
      });
    }
    function jumpTo(k){
      if (k === "later") laterOpen = true;
      if (k === "none") noneOpen = true;
      if (view !== "focus") setView("focus"); else renderFocus();
      const target = document.getElementById("ms-" + k);
      if (!target) return;
      target.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
      target.focus({ preventScroll: true });
    }

    /* ---- focus view -------------------------------------------------- */
    function section(id, extraCls){
      const s = el("section", "ms-sec" + (extraCls ? " " + extraCls : ""));
      s.id = id; s.tabIndex = -1;
      return s;
    }
    function renderFocus(){
      focusEl.replaceChildren();
      const tasks = visibleTasks();
      if (!tasks.length){ focusEl.append(filterEmpty()); return; }
      const { od, soon, later, none } = focusBuckets(tasks);

      if (od.length){
        const sec = section("ms-od");
        sec.setAttribute("aria-label", "Overdue");
        const card = el("div", "ms-card is-alert");
        const head = el("div", "ms-alert-head");
        head.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        head.append(el("h3", null, "Needs attention"));
        card.append(head);
        od.forEach(t => card.append(msItem(t)));
        sec.append(card);
        focusEl.append(sec);
      }

      const soonSec = section("ms-soon");
      const soonHead = el("div", "ms-sec-head");
      soonHead.append(el("h3", null, "Next 30 days"));
      soonSec.append(soonHead);
      if (soon.length) soonSec.append(msCard(soon));
      else {
        const box = el("div", "ms-card");
        const next = later[0];
        box.append(el("p", "ms-empty", next
          ? "Nothing due in the next 30 days. Next up is " + next.n + " on " + fmtShort(next.due) + "."
          : "Nothing due in the next 30 days."));
        soonSec.append(box);
      }
      focusEl.append(soonSec);

      if (later.length) focusEl.append(laterSection(later));

      if (none.length){
        const det = el("details", "ms-undated ms-sec");
        det.id = "ms-none"; det.tabIndex = -1;
        det.open = noneOpen;
        det.addEventListener("toggle", () => { noneOpen = det.open; });
        const sum = el("summary");
        sum.innerHTML = '<span class="bucket-chev" aria-hidden="true">›</span>';
        sum.append(el("span", null, "No due date"), el("span", "ms-sec-note", String(none.length)));
        det.append(sum, msCard(none));
        focusEl.append(det);
      }
    }

    function laterSection(later){
      const sec = section("ms-later");
      const box = el("div", "ms-later");
      const first = parseDue(later[0].due), last = parseDue(later[later.length - 1].due);
      const head = el("div", "ms-later-head");
      head.append(el("h3", null, "Later"));
      const more = el("button", "ms-more-btn", laterOpen ? "Hide list" : "Show all " + later.length);
      more.type = "button";
      more.setAttribute("aria-expanded", String(laterOpen));
      more.setAttribute("aria-controls", "msLaterList");
      more.addEventListener("click", () => {
        laterOpen = !laterOpen;
        renderFocus();
        const again = document.querySelector("#ms-later .ms-more-btn");
        if (again) again.focus();
      });
      head.append(more);
      box.append(head);

      /* Month by month, first later month to last, empty months included so
         the gaps read as gaps. */
      const months = [];
      for (let m = new Date(first.getFullYear(), first.getMonth(), 1); m <= last; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)){
        const key = m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0");
        months.push({ m, key, items: later.filter(t => t.due.startsWith(key)) });
      }
      const max = Math.max(...months.map(x => x.items.length));
      const peak = months.length > 1 && max >= 3 ? months.find(x => x.items.length === max) : null;
      const hist = el("div", "ms-hist");
      hist.style.setProperty("--n", months.length);
      hist.setAttribute("role", "img");
      hist.setAttribute("aria-label", "Later milestones by month: " +
        months.map(x => monthShort(x.m) + " " + x.items.length).join(", "));
      months.forEach((x, i) => {
        const bar = el("div", "ms-bar" + (x === peak ? " is-peak" : ""));
        const fill = el("div", "ms-bar-fill");
        fill.style.height = Math.max(4, Math.round(x.items.length / max * 56)) + "px";
        const yr = x.m.getFullYear() !== today.getFullYear() && (i === 0 || x.m.getMonth() === 0)
          ? " ’" + String(x.m.getFullYear()).slice(2) : "";
        bar.append(el("span", "ms-bar-n", x.items.length || ""), fill, el("span", "ms-bar-m", monthShort(x.m) + yr));
        hist.append(bar);
      });
      box.append(hist);
      sec.append(box);

      if (laterOpen){
        const list = el("div");
        list.id = "msLaterList";
        months.filter(x => x.items.length).forEach(x => {
          const g = el("div", "ms-month");
          g.append(el("h4", "ms-month-head", x.m.toLocaleDateString(undefined, { month:"long", year:"numeric" })), msCard(x.items));
          list.append(g);
        });
        sec.append(list);
      }
      return sec;
    }

    /* ---- timeline view ----------------------------------------------- */
    function renderTimeline(){
      timelineEl.replaceChildren();
      const tasks = visibleTasks();
      if (!tasks.length){ timelineEl.append(filterEmpty()); return; }
      const dated = tasks.filter(t => t.due).sort(byDue);
      if (!dated.length){
        timelineEl.append(el("p", "list-empty", "None of these milestones has a due date yet."));
        return;
      }

      /* The axis runs from the start of the earliest month (today's, if that
         is earlier) to the end of the latest one. */
      const first = parseDue(dated[0].due), last = parseDue(dated[dated.length - 1].due);
      const lo = first < today ? first : today, hi = last > today ? last : today;
      const start = new Date(lo.getFullYear(), lo.getMonth(), 1);
      const end = new Date(hi.getFullYear(), hi.getMonth() + 1, 1);
      const span = end - start;
      const pct = d => (d - start) / span * 100;

      /* Merge markers closer than ~26px at this width into one circle. */
      const narrow = timelineEl.clientWidth < 560;
      const trackW = Math.max(160, timelineEl.clientWidth - (narrow ? 24 : 36) - (narrow ? 0 : 168) - 28);
      const mergePct = 26 / trackW * 100;

      const areas = AREA_ORDER.filter(k => dated.some(t => t.b === k));
      const rows = areas.map(k => {
        const clusters = [];
        dated.filter(t => t.b === k).forEach(t => {
          const p = pct(parseDue(t.due));
          const c = clusters[clusters.length - 1];
          const late = t.due < TODAY_ISO;
          if (c && p - c.p0 < mergePct && c.late === late) c.items.push(t);
          else clusters.push({ p0: p, late, items: [t] });
        });
        clusters.forEach(c => {
          c.k = k;
          c.key = k + ":" + c.items[0].due;
          c.left = c.items.reduce((s, t) => s + pct(parseDue(t.due)), 0) / c.items.length;
          c.od = c.items.some(t => t.due < TODAY_ISO);
          c.isNew = c.items.some(isNew);
          const a = c.items[0].due, b = c.items[c.items.length - 1].due;
          c.range = a === b ? fmtShort(a) : fmtShort(a) + " – " + fmtShort(b);
        });
        return { k, count: dated.filter(t => t.b === k).length, clusters };
      });
      const all = rows.flatMap(r => r.clusters);
      if (!all.some(c => c.key === tlSel)){
        const upcoming = all.filter(c => c.items[c.items.length - 1].due >= TODAY_ISO)
          .sort((x, y) => (x.items[0].due < y.items[0].due ? -1 : 1))[0];
        tlSel = (upcoming || all[all.length - 1]).key;
      }

      const box = el("div", "tl");
      const body = el("div", "tl-body");
      const months = [];
      for (let m = new Date(start); m < end; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) months.push(m);

      const lines = el("div", "tl-lines");
      lines.setAttribute("aria-hidden", "true");
      const linesIn = el("div", "tl-lines-in");
      months.forEach(m => { const g = el("div", "tl-gl"); g.style.left = pct(m) + "%"; linesIn.append(g); });
      const nowLine = el("div", "tl-now"); nowLine.style.left = pct(today) + "%";
      linesIn.append(nowLine);
      lines.append(linesIn);

      const axis = el("div", "tl-axis");
      axis.setAttribute("aria-hidden", "true");
      const axisTrack = el("div", "tl-track");
      /* Every other label when a month is too narrow to hold one. */
      const step = trackW / months.length < 34 ? 2 : 1;
      months.forEach((m, i) => {
        if (i % step) return;
        const yr = m.getMonth() === 0 || i === 0 ? " ’" + String(m.getFullYear()).slice(2) : "";
        const lab = el("span", "tl-month", monthShort(m) + (yr && m.getFullYear() !== today.getFullYear() ? yr : ""));
        lab.style.left = pct(m) + "%";
        axisTrack.append(lab);
      });
      const tag = el("span", "tl-today-tag", "Today");
      tag.style.left = pct(today) + "%";
      axisTrack.append(tag);
      axis.append(el("div", "tl-spacer"), axisTrack);
      body.append(lines, axis);

      let picked = null;
      rows.forEach(r => {
        const row = el("div", "tl-row c-" + r.k);
        const label = el("div", "tl-label", BOARDS[r.k].label);
        label.append(" ", el("em", null, r.count));
        const track = el("div", "tl-track");
        r.clusters.forEach(c => {
          const n = c.items.length;
          const size = n === 1 ? 18 : Math.min(36, 20 + n * 2.5);
          const b = el("button", "tl-mk" + (c.od ? " is-od" : ""), n > 1 ? String(n) : "");
          b.type = "button";
          b.dataset.key = c.key;
          b.style.left = c.left + "%";
          b.style.width = b.style.height = size + "px";
          const on = c.key === tlSel;
          if (on) picked = c;
          b.setAttribute("aria-pressed", String(on));
          b.setAttribute("aria-label", BOARDS[r.k].label + ", " + c.range + ", " + n +
            (n === 1 ? " milestone" : " milestones") + (c.od ? ", overdue" : "") + (c.isNew ? ", new for you" : ""));
          if (c.isNew){ const dot = el("span", "tl-new"); dot.setAttribute("aria-hidden", "true"); b.append(dot); }
          b.addEventListener("click", () => {
            tlSel = c.key;
            renderTimeline();
            const again = timelineEl.querySelector('.tl-mk[data-key="' + c.key + '"]');
            if (again) again.focus();
          });
          track.append(b);
        });
        row.append(label, track);
        body.append(row);
      });
      box.append(body);

      const legend = el("div", "tl-legend");
      legend.innerHTML =
        '<span><i style="background:var(--overdue)" aria-hidden="true"></i>Overdue</span>' +
        '<span><i style="background:var(--earth)" aria-hidden="true"></i>Corner dot: new for you</span>';

        card.setAttribute("aria-live", "polite");

        const n = picked.items.length;
        head.append(el("h3", null, BOARDS[picked.k].label + " · " + picked.range),
          el("span", "ms-sec-note", n + (n === 1 ? " milestone" : " milestones")));
        card.append(head);
        picked.items.forEach(t => card.append(msItem(t)));
        timelineEl.append(card);
      }
    }
    let tlResizeTimer = null;
    let tlLastWidth = 0;
    addEventListener("resize", () => {
      if (view !== "timeline") return;
      clearTimeout(tlResizeTimer);
      tlResizeTimer = setTimeout(() => {
        if (Math.abs(timelineEl.clientWidth - tlLastWidth) < 24) return;
        tlLastWidth = timelineEl.clientWidth;
        renderTimeline();
      }, 150);
    });

    /* ---- areas view ---------------------------------------------------
       One card per board. Status filter doesn't apply here (the status bar IS
       the status breakdown), so its menu section hides in this view. */
    function renderAreas(){
      areasEl.replaceChildren();
      const tasks = areaFilteredTasks().filter(t => t.s !== "done");
      if (!tasks.length){ areasEl.append(filterEmpty()); return; }

      const groups = AREA_ORDER.map(k => {
        const items = tasks.filter(t => t.b === k);
        const dated = items.filter(t => t.due).sort(byDue);
        return {
          k, items, dated,
          od: dated.filter(t => t.due < TODAY_ISO),
          ahead: dated.filter(t => t.due >= TODAY_ISO),
          undated: items.filter(t => !t.due),
        };
      }).filter(g => g.items.length);
      /* Anything overdue leads; then whichever area has the soonest date. */
      groups.sort((a, b) =>
        (b.od.length > 0) - (a.od.length > 0) ||
        (a.ahead[0] ? a.ahead[0].due : "9999").localeCompare(b.ahead[0] ? b.ahead[0].due : "9999"));

      const grid = el("div", "ar-grid");
      groups.forEach(g => {
        const card = el("section", "ar-card c-" + g.k);
        const head = el("div", "ar-head");
        head.append(el("h3", null, BOARDS[g.k].label), el("span", "ar-n", g.items.length));
        if (g.od.length) head.append(el("span", "ar-od-badge", g.od.length + " overdue"));
        card.append(head);

        const c = { work:0, review:0, wait:0, idle:0 };
        g.items.forEach(t => { if (c[t.s] !== undefined) c[t.s]++; });
        const parts = [
          { k:"work", n:c.work, color:"var(--mon-work)", label:"working" },
          { k:"review", n:c.review, color:"var(--mon-review)", label:"needs review" },
          { k:"wait", n:c.wait, color:"var(--mon-wait)", label:"waiting" },
          { k:"idle", n:c.idle, color:"var(--mon-idle)", label:"not started" },
        ].filter(p => p.n);
        /* The bar uses the status pill colours, so it reads without a legend;
           the exact counts are on hover and for screen readers. */
        const bar = el("div", "ar-bar");
        const mix = parts.map(p => p.n + " " + p.label).join(", ");
        bar.setAttribute("role", "img");
        bar.setAttribute("aria-label", mix);
        bar.title = mix;
        parts.forEach(p => {
          const s = el("span"); s.style.width = (p.n / g.items.length * 100) + "%"; s.style.background = p.color;
          bar.append(s);
        });
        card.append(bar);

        const lead = g.od[0] || g.ahead[0] || g.undated[0];
        const leadOd = lead.due && lead.due < TODAY_ISO;
        const next = pulseLink("ar-next" + (leadOd ? " is-od" : ""), lead);
        let eyebrow = "No date yet";
        if (lead.due){
          const n = daysOut(lead.due);
          eyebrow = leadOd ? "Overdue · " + fmtShort(lead.due)
            : "Next · " + fmtShort(lead.due) + (n <= 30 ? " · " + whenText(n) : "");
        }
        const nm = el("b");
        if (isNew(lead)) nm.append(el("span", "new-tag", "NEW"));
        nm.append(lead.n);
        next.append(el("small", null, eyebrow), nm,
          el("em", null, [context(lead), STATUS[lead.s].label].filter(Boolean).join(" · ")));
        card.append(next);

        const rest = [...g.od, ...g.ahead].filter(t => t !== lead).slice(0, 2);
        if (rest.length){
          const ul = el("ul", "ar-then");
          rest.forEach(t => {
            const li = el("li");
            const a = pulseLink(null, t);
            const name = el("span");
            if (isNew(t)) name.append(el("span", "new-tag", "NEW"));
            name.append(t.n);
            a.append(name, el("span", "ar-then-due" + (t.due < TODAY_ISO ? " is-od" : ""), fmtShort(t.due)));
            li.append(a);
            ul.append(li);
          });
          card.append(ul);
        }
        if (g.items.length > 1){
          const all = el("button", "ar-all", "See all " + g.items.length + " →");
          all.type = "button";
          all.addEventListener("click", () => {
            activeArea = g.k;
            setView("focus");
            focusEl.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
          });
          card.append(all);
        }
        grid.append(card);
      });

      const undated = tasks.filter(t => !t.due);
      if (undated.length){
        const SHOW = 6;
        const card = el("section", "ar-card is-undated");
        const head = el("div", "ar-head");
        head.append(el("h3", null, "No due date"), el("span", "ar-n", undated.length));
        card.append(head);
        const ul = el("ul", "ar-then");
        undated.slice(0, SHOW).forEach(t => {
          const li = el("li");
          const a = pulseLink(null, t);
          const name = el("span");
          if (isNew(t)) name.append(el("span", "new-tag", "NEW"));
          name.append(t.n);
          a.append(name, el("span", "ar-then-area", BOARDS[t.b].label));
          li.append(a);
          ul.append(li);
        });
        card.append(ul);
        if (undated.length > SHOW) card.append(el("p", "ar-more", "+ " + (undated.length - SHOW) + " more"));
        const a = el("a", "ar-undated-link", "Set dates in Monday ↗");
        a.href = "https://training-unit-hq.monday.com/workspaces/16174604";
        a.target = "_blank"; a.rel = "noopener noreferrer";
        card.append(a);
        grid.append(card);
      }
      areasEl.append(grid);
    }

      view = v;

      focusEl.hidden = v !== "focus";
